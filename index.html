<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mizan 2.1 - Salik Company P.J.S.C. FY2025</title>
<style>
  :root{
    --ink:#15181d; --ink-2:#3c424c; --muted:#7c8492; --faint:#aeb4be;
    --paper:#f6f4ef; --card:#fffefb; --line:#e2ddd3; --line-2:#cfc9bd;
    --accent:#0f5f57; --good:#1f7a4d; --warn:#b9791b; --bad:#b23b2e; --none:#9aa0aa;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
  a{color:inherit}
  .tone-good{color:var(--good)} .tone-warn{color:var(--warn)} .tone-bad{color:var(--bad)} .tone-none{color:var(--none)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle}
  .bg-good{background:var(--good)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)} .bg-none{background:var(--none)}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
    padding:10px 20px;background:var(--ink);color:#f3efe6;border-bottom:2px solid #000}
  .brand{font-family:var(--serif);font-size:19px;letter-spacing:.02em;font-weight:600}
  .brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:#b9c2b0;display:block;margin-top:1px}
  .topbar .entity{font-size:12.5px;color:#d8d2c4}
  .topbar .spacer{flex:1}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid #4a4f57;border-radius:2px;padding:3px 7px;color:#e7e2d6}
  .chip.warn{border-color:#7a5a1e;color:#e6c98d}
  .btn{font-family:var(--sans);font-size:12.5px;border:1px solid #4a4f57;background:#22262c;color:#f3efe6;
    padding:6px 11px;border-radius:3px;cursor:pointer}
  .btn.primary{background:#0f5f57;border-color:#0b463f}
  select.scope{font-family:var(--mono);font-size:11px;background:#22262c;color:#f3efe6;border:1px solid #4a4f57;border-radius:3px;padding:5px 6px}

  /* ---------- workspace ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 80px}
  .rule{height:1px;background:var(--line);margin:22px 0}
  .rule.strong{background:var(--ink);height:2px}
  section.block{margin-top:26px}
  .sechead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:12px}
  .sechead .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
  .sechead h2{font-size:17px}
  .sechead .meta{margin-left:auto}

  /* executive strip */
  .exec{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:stretch}
  .score-card{border:1px solid var(--line-2);background:var(--card);border-radius:4px;padding:14px 16px}
  .score-num{font-family:var(--serif);font-size:52px;line-height:1;letter-spacing:-.02em}
  .score-num span{font-size:20px;color:var(--muted)}
  .score-sub{margin-top:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line-2);border-radius:4px;background:var(--card);overflow:hidden}
  .kpi{padding:12px 14px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:3px}
  .kpi .d{font-family:var(--mono);font-size:11px;margin-top:2px}
  .integrity-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .ipill{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:2px;padding:3px 7px;background:var(--card)}

  /* scorecard */
  .families{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .fam{border:1px solid var(--line-2);border-top:3px solid var(--none);border-radius:3px;background:var(--card);padding:9px 10px;min-height:74px}
  .fam.good{border-top-color:var(--good)} .fam.warn{border-top-color:var(--warn)} .fam.bad{border-top-color:var(--bad)} .fam.none{border-top-color:var(--none)}
  .fam .fn{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .fam .fs{font-family:var(--serif);font-size:26px;line-height:1.1;margin-top:4px}
  .fam .fs small{font-size:12px;color:var(--muted)}
  .fam .fl{font-size:11px;margin-top:1px}
  .fam .fc{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:4px}

  /* ratios */
  .fam-group{margin-bottom:4px;border-bottom:1px solid var(--line)}
  .fam-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 2px}
  .fam-group summary::-webkit-details-marker{display:none}
  .fam-group summary .lbl{font-family:var(--serif);font-size:15px}
  .fam-group summary .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
  .rrow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:6px 8px;border-top:1px dotted var(--line)}
  .rrow .rname{font-size:13px}
  .rrow .rval{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
  .rrow .rstate{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:2px;padding:2px 5px;color:var(--muted);white-space:nowrap}
  .rrow.pending .rval,.rrow.market .rval{color:var(--faint)}
  .rrow .caveat{grid-column:1/-1;font-size:11.5px;color:var(--warn);padding:0 8px 3px}
  .trace{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--ink-2);background:#f1eee7;border-left:2px solid var(--accent);padding:7px 9px;margin:2px 8px 6px;border-radius:0 3px 3px 0}
  .linkish{color:var(--accent);cursor:pointer;font-size:11px;font-family:var(--mono)}

  /* findings */
  .finding{border-left:3px solid var(--line-2);padding:8px 0 8px 12px;margin:10px 0}
  .finding.high{border-left-color:var(--bad)} .finding.medium{border-left-color:var(--warn)} .finding.low{border-left-color:var(--none)}
  .finding .ftop{display:flex;align-items:center;gap:8px}
  .finding .fsev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;color:#fff}
  .finding.high .fsev{background:var(--bad)} .finding.medium .fsev{background:var(--warn)} .finding.low .fsev{background:var(--none)}
  .finding .fdec{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:auto}
  .finding .fobs{font-weight:600;margin-top:3px}
  .finding .fbody{font-size:13px;color:var(--ink-2);margin-top:2px}
  .finding .fcalc{font-family:var(--mono);font-size:12px;background:#f1eee7;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:4px}
  .finding .fsrc{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px}
  .cluster{border:1px solid var(--line-2);border-left:3px solid var(--bad);border-radius:3px;background:#fdfbf7;padding:12px 14px;margin:12px 0}
  .cluster h3{font-size:15px}
  .cluster .csum{font-size:13px;color:var(--ink-2);margin:4px 0 6px}

  /* verification */
  .vq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .vqcell{border:1px solid var(--line-2);border-radius:3px;background:var(--card);padding:11px 13px}
  .vqcell .vn{font-family:var(--serif);font-size:24px}
  .vqcell .vl{font-size:12px;color:var(--ink-2)}

  .foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:14px}

  /* collapsed observations */
  details.obs summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--accent);padding:6px 0}
  details.obs summary::-webkit-details-marker{display:none}

  /* ============ PRINT DOCUMENT (separate renderer) ============ */
  #report{display:none}
  @media screen{ #report.show{display:block;position:fixed;inset:0;overflow:auto;background:#5c5c5c;padding:24px 0;z-index:50} }
  .page{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 18px;padding:20mm 18mm 24mm;position:relative;
    box-shadow:0 2px 14px rgba(0,0,0,.35);font-family:var(--sans);font-size:10.5pt;line-height:1.45}
  .page .runhead{position:absolute;top:8mm;left:18mm;right:18mm;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:8pt;letter-spacing:.06em;color:#555;border-bottom:.5pt solid #bbb;padding-bottom:2mm}
  .page .runfoot{position:absolute;bottom:10mm;left:18mm;right:18mm;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:7.5pt;color:#666;border-top:.5pt solid #bbb;padding-top:2mm}
  .doc-h1{font-family:var(--serif);font-size:19pt;margin:0 0 2mm}
  .doc-secnum{font-family:var(--mono);font-size:9pt;color:var(--accent);letter-spacing:.1em}
  .doc-h2{font-family:var(--serif);font-size:14pt;border-bottom:1.5pt solid #000;padding-bottom:1.5mm;margin:0 0 3mm}
  .doc-lead{color:#333;margin:0 0 4mm}
  table.doc{width:100%;border-collapse:collapse;font-size:9.5pt;margin:2mm 0 4mm}
  table.doc th{font-family:var(--mono);font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;color:#555;
    text-align:left;border-bottom:1pt solid #000;padding:2mm 2mm 1.5mm}
  table.doc td{padding:1.6mm 2mm;border-bottom:.5pt solid #ddd;vertical-align:top}
  table.doc td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  table.doc tr{break-inside:avoid}
  .doc-note{font-size:8.5pt;color:#666;font-style:italic;margin:1mm 0 4mm}
  .cover{display:flex;flex-direction:column;min-height:257mm}
  .cover .cbrand{font-family:var(--serif);font-size:30pt;letter-spacing:.02em}
  .cover .cbrand small{display:block;font-family:var(--mono);font-size:9pt;letter-spacing:.28em;color:#0f5f57;margin-top:2mm}
  .cover .ctitle{font-family:var(--mono);font-size:11pt;letter-spacing:.18em;text-transform:uppercase;color:#333;margin-top:26mm}
  .cover .centity{font-family:var(--serif);font-size:22pt;margin-top:3mm}
  .cover .cmeta{font-family:var(--mono);font-size:9.5pt;color:#444;margin-top:2mm;line-height:1.9}
  .cover .cscore{margin-top:auto;display:flex;gap:16mm;align-items:flex-end}
  .cover .cscore .big{font-family:var(--serif);font-size:44pt;line-height:1}
  .cover .integ{border:1pt solid #000;padding:5mm 6mm;margin-top:8mm}
  .cover .integ .cap{color:#333}
  .cover .integ ul{margin:2mm 0 0;padding-left:5mm;font-family:var(--mono);font-size:8.5pt;color:#333;line-height:1.8}
  .cover .tag{font-family:var(--serif);font-style:italic;font-size:12pt;margin-top:6mm;color:#0f5f57}
  .keymatter{break-inside:avoid;border-left:2.5pt solid #b23b2e;padding:1mm 0 1mm 4mm;margin:3mm 0}
  .keymatter.medium{border-left-color:#b9791b} .keymatter.low{border-left-color:#999}
  .keymatter .km-obs{font-weight:700;font-size:10.5pt}
  .keymatter .km-cap{font-family:var(--mono);font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;color:#666}
  .keymatter .km-body{font-size:9.5pt;color:#333;margin-top:.5mm}
  .keymatter .km-src{font-family:var(--mono);font-size:8pt;color:#666;margin-top:.5mm}
  .doc-ratiofam{break-inside:avoid;margin:0 0 3mm}
  .doc-ratiofam h4{font-family:var(--serif);font-size:11pt;margin:0 0 1mm;display:flex;justify-content:space-between}
  .doc-ratiofam h4 span{font-family:var(--mono);font-size:8pt;color:#666;font-weight:400}
  .unavail{font-family:var(--mono);font-size:8.5pt;color:#777;margin-top:1mm}

  @media print{
    html,body{background:#fff}
    .topbar,.wrap,.no-print{display:none !important}
    #report{display:block !important}
    #report.show{position:static;background:#fff;padding:0;overflow:visible}
    .page{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none;break-after:page}
    .page:last-child{break-after:auto}
    .page .runhead{position:fixed;top:6mm} .page .runfoot{position:fixed;bottom:6mm}
    @page{size:A4;margin:20mm 18mm 22mm}
  }
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">Mizan<small>2.1</small></div>
  <div class="entity" id="tb-entity"></div>
  <div class="spacer"></div>
  <span class="chip warn" id="tb-integrity"></span>
  <select class="scope" id="tb-scope" title="Report scope">
    <option value="full">Full report</option>
    <option value="executive">Executive</option>
    <option value="appendix">Evidence appendix</option>
  </select>
  <button class="btn primary" id="tb-export">Export Report &rarr; PDF</button>
  <button class="btn" id="tb-close" style="display:none">Close preview</button>
</div>

<div class="wrap" id="app"></div>
<div id="report"></div>

<script>
/* =====================================================================
   MIZAN 2.1  -  one evidence model, two renderers (web + print document)
   All three fixes in one file:
     (1) evidence/ratio engine  (2) compact web renderer  (3) PDF document
   ===================================================================== */

/* ---------- 1a. ENGINE: normalization, hardened ---------- */
const SCALE = { units:1, thousands:1e3, millions:1e6, billions:1e9 };

// The ONLY producer of canonicalMinor. Callers cannot hand-set it, so a wrong
// scale cannot slip past. This closes the "makeFigure loophole" note.
function makeFigure(o){
  if(!(o.sourceScale in SCALE)) throw new Error("bad scale "+o.sourceScale);
  const scaleFactor = SCALE[o.sourceScale];
  return Object.freeze({
    id:o.id, label:o.label, period:o.period, entity:o.entity,
    raw:o.raw, sourceScale:o.sourceScale, currency:o.currency||"AED",
    confidence:o.confidence??0.95, source:o.source, derived:!!o.derived,
    canonicalMinor:o.raw*scaleFactor, scaleFactor
  });
}
// Narrowed view handed to compute(): ONLY canonical value is reachable, so a
// ratio function literally cannot read .raw. This closes the compute loophole.
function canon(fig){ return { id:fig.id, period:fig.period, entity:fig.entity, currency:fig.currency, v:fig.canonicalMinor }; }

// Unit-integrity gate: currency + entity always; period only for single-period
// measures (growth/turnover are cross-period by design and opt out).
function assertIntegrity(inputs, singlePeriod, crossCurrency){
  const xs = Object.values(inputs);
  const a = xs[0];
  for(const x of xs){
    if(!crossCurrency && x.currency!==a.currency) throw new Error("integrity: currency "+x.currency+" vs "+a.currency);
    if(x.entity!==a.entity)     throw new Error("integrity: entity mismatch "+x.id);
    if(!Number.isFinite(x.v))   throw new Error("integrity: "+x.id+" not normalized");
    if(singlePeriod && x.period!==a.period) throw new Error("integrity: period "+x.period+" vs "+a.period+" ("+x.id+")");
  }
}

/* ---------- 1b. FORMATTERS ---------- */
const fmt = {
  pct:v=>(v*100).toFixed(1)+"%",
  x:v=> v>=100 ? Math.round(v)+"x" : v.toFixed(2)+"x",
  days:v=>v.toFixed(1)+" days",
  aed:v=>"AED "+abbr(v),
  aed2:v=>"AED "+v.toFixed(4),
};
function abbr(v){ const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(2)+"bn";
  if(a>=1e6) return (v/1e6).toFixed(1)+"m";
  if(a>=1e3) return (v/1e3).toFixed(0)+"k";
  return String(v);
}
function th(v){ return v.toLocaleString("en-US"); } // full number with thousands separators

/* ---------- 1c. SOURCE FIGURES (Salik FY2025, canonical via factory) ---------- */
const E="Salik Company P.J.S.C.", D="EN Salik FS Dec 25 S.pdf";
const S=(p,note)=>({document:D,page:p,note});
const F={};
const add=o=>{F[o.id]=makeFigure(o);};
add({id:"revenue.2025",label:"Revenue",period:"2025",entity:E,raw:3096913,sourceScale:"thousands",source:S(30)});
add({id:"revenue.2024",label:"Revenue",period:"2024",entity:E,raw:2291907,sourceScale:"thousands",source:S(30)});
add({id:"netProfit.2025",label:"Net profit",period:"2025",entity:E,raw:1553362,sourceScale:"thousands",source:S(44)});
add({id:"netProfit.2024",label:"Net profit",period:"2024",entity:E,raw:1164548,sourceScale:"thousands",source:S(44)});
add({id:"pbt.2025",label:"Profit before tax",period:"2025",entity:E,raw:1706954,sourceScale:"thousands",source:S(42)});
add({id:"financeCosts.2025",label:"Total finance costs",period:"2025",entity:E,raw:313146,sourceScale:"thousands",source:S(31)});
add({id:"dna.2025",label:"Depreciation and amortisation",period:"2025",entity:E,raw:144769,sourceScale:"thousands",source:S(31)});
add({id:"equity.2025",label:"Total equity",period:"2025",entity:E,raw:1218666,sourceScale:"thousands",source:S(14)});
add({id:"finLiab.2025",label:"Total financial liabilities",period:"2025",entity:E,raw:6068266,sourceScale:"thousands",source:S(45)});
add({id:"tradeRecvNet.2025",label:"Trade receivables (net)",period:"2025",entity:E,raw:169010,sourceScale:"thousands",source:S(36)});
add({id:"tradeRecvGross.2025",label:"Trade receivables (gross)",period:"2025",entity:E,raw:326847,sourceScale:"thousands",source:S(36)});
add({id:"ppeNet.2025",label:"Property and equipment (net)",period:"2025",entity:E,raw:5610,sourceScale:"thousands",source:S(35,"Note 18")});
add({id:"shares.2025",label:"Weighted-average shares",period:"2025",entity:E,raw:7500000,sourceScale:"thousands",currency:"shares",source:S(44)});
add({id:"dividendsPaid.2025",label:"Dividends declared and paid",period:"2025",entity:E,raw:1390694,sourceScale:"thousands",source:S(43)});
// reconstructed figures (derived, still canonical via factory on their computed base)
const operatingProfit = F["pbt.2025"].canonicalMinor + F["financeCosts.2025"].canonicalMinor; // 2,020,100k
const ebitda = operatingProfit + F["dna.2025"].canonicalMinor; // 2,164,869k
F["operatingProfit.2025"]=makeFigure({id:"operatingProfit.2025",label:"Operating profit (reconstructed)",period:"2025",entity:E,raw:operatingProfit/1000,sourceScale:"thousands",confidence:0.9,derived:true,source:S(42)});
F["ebitda.2025"]=makeFigure({id:"ebitda.2025",label:"EBITDA (reconstructed)",period:"2025",entity:E,raw:ebitda/1000,sourceScale:"thousands",confidence:0.9,derived:true,source:S(31)});

// values the entity reported (not independently rebuilt)
const REPORTED = {
  netDebtEbitda:{ value:2.24, display:"2.24x", source:S(40,"Note 30") }
};

/* ---------- 1d. MEASURE SPECS (compute reads canonical .v only) ---------- */
const M = [
  // Profitability
  {id:"grossMargin",name:"Gross profit margin",family:"profitability",formula:"Gross profit / Revenue",dir:"higher_better",na:"No discrete cost-of-revenue line disclosed."},
  {id:"opMargin",name:"Operating profit margin",family:"profitability",formula:"Operating profit / Revenue",dir:"higher_better",single:true,
    req:{op:"operatingProfit.2025",rev:"revenue.2025"},f:i=>i.op.v/i.rev.v,fmt:"pct",caveatAlways:"Operating profit reconstructed as PBT + finance costs; excludes finance income."},
  {id:"netMargin",name:"Net profit margin",family:"profitability",formula:"Net profit / Revenue",dir:"higher_better",single:true,
    req:{np:"netProfit.2025",rev:"revenue.2025"},f:i=>i.np.v/i.rev.v,fmt:"pct"},
  {id:"ebitdaMargin",name:"EBITDA margin",family:"profitability",formula:"EBITDA / Revenue",dir:"higher_better",single:true,
    req:{e:"ebitda.2025",rev:"revenue.2025"},f:i=>i.e.v/i.rev.v,fmt:"pct"},
  {id:"roa",name:"Return on assets",family:"profitability",formula:"Net profit / Total assets",dir:"higher_better",req:{np:"netProfit.2025",ta:"totalAssets.2025"},f:i=>i.np.v/i.ta.v,fmt:"pct"},
  {id:"roe",name:"Return on equity",family:"profitability",formula:"Net profit / Total equity",dir:"higher_better",single:true,
    req:{np:"netProfit.2025",eq:"equity.2025"},f:i=>i.np.v/i.eq.v,fmt:"pct",note:"High on thin equity with ~90% payout, not operating outperformance."},
  // Solvency
  {id:"interestCoverage",name:"Interest coverage",family:"solvency",formula:"Operating profit / Finance costs",dir:"higher_better",single:true,
    req:{op:"operatingProfit.2025",fc:"financeCosts.2025"},f:i=>i.op.v/i.fc.v,fmt:"x"},
  {id:"netDebtEbitda",name:"Net debt / EBITDA",family:"solvency",formula:"Net debt / EBITDA",dir:"lower_better",reported:"netDebtEbitda",
    note:"Reconciles only if the related-party payable is counted as debt."},
  {id:"finLiabEquity",name:"Financial-liabilities / equity",family:"solvency",formula:"Total financial liabilities / Total equity",dir:"lower_better",single:true,

/* ---------- 1e. COMPUTE (single path, four states) ---------- */
function computeMeasure(spec){
  const base={id:spec.id,name:spec.name,family:spec.family,formula:spec.formula,dir:spec.dir,
    note:spec.note,lowSignal:false,caveat:spec.caveatAlways||null};
  if(spec.na) return {...base,state:"na",display:"n/a",caveat:spec.na};
  if(spec.market) return {...base,state:"market"};
  // reported-only measures have no compute function: surface the disclosed value, never call spec.f
  if(!spec.f){
    if(spec.reported && REPORTED[spec.reported]){
      const r=REPORTED[spec.reported];
      return {...base,state:"reported",provenance:"reported",value:r.value,display:r.display,trace:[r.source],
        caveat:(base.caveat?base.caveat+" ":"")+"Disclosed by the entity; not independently reconstructed."};
    }
    return {...base,state:"pending",missing:["not computed"]};
  }
  // resolve inputs
  const inputs={}; const missing=[];
  if(spec.req){ for(const [role,fid] of Object.entries(spec.req)){
    if(F[fid]) inputs[role]=canon(F[fid]); else missing.push(prettyMissing(fid));
  }}
  if(missing.length){
    if(spec.reported && REPORTED[spec.reported]){
      const r=REPORTED[spec.reported];
      return {...base,state:"reported",provenance:"reported",value:r.value,display:r.display,trace:[r.source],
        caveat:(base.caveat?base.caveat+" ":"")+"Disclosed by the entity; not independently reconstructed."};
    }
    return {...base,state:"pending",missing};
  }
  assertIntegrity(inputs, !!spec.single, !!spec.crossCurrency); // throws -> ingestion bug, never a silent number
  const value=spec.f(inputs);
  const trace=Object.values(inputs).map(x=>F[x.id].source);
  const low=!!spec.lowSignal;
  return {...base,state:"computed",provenance:"computed",value,display:fmt[spec.fmt](value),
    trace, lowSignal:low, caveat: low?spec.lowSignal:(base.caveat),
    scoreExclude: low || !!spec.scoreExclude};
}
function prettyMissing(fid){
  const map={ "totalAssets.2025":"total assets (balance sheet)","totalAssets.2024":"prior total assets (balance sheet)",
    "totalLiab.2025":"total liabilities (balance sheet)","currentAssets.2025":"current assets (balance sheet)",
    "currentLiab.2025":"current liabilities (balance sheet)","cash.2025":"cash (balance sheet)","inventory.2025":"inventory (balance sheet)",
    "ocf.2025":"operating cash flow (cash flow statement)","capex.2025":"capex (cash flow statement)"};
  return map[fid]||fid;
}

/* ---------- 1f. SCORING (transparent, documented default rubric v0) ----------
   Every threshold is visible here and easy to replace. The overall is labelled
   "available metrics only". Reported and low-signal ratios never score.        */
function scoreRatio(m){
  if(m.state!=="computed"||m.scoreExclude) return null;
  const v=m.value, up=m.dir==="higher_better", down=m.dir==="lower_better";
  if(!up&&!down) return null; // neutral ratios are informational, not scored
  const bands = {
    netMargin:[[0.20,95],[0.10,80],[0.05,60],[0,40]],
    opMargin:[[0.20,95],[0.10,80],[0.05,60],[0,40]],
    ebitdaMargin:[[0.25,95],[0.12,80],[0.05,60],[0,40]],
    roe:[[0.15,100],[0.08,80],[0.03,55],[0,35]],
    interestCoverage:[[6,90],[4,80],[2,55],[0,30]],
    finLiabEquity:[[1,90],[2,65],[3,45],[5,30],[9e9,20]], // lower better: ascending thresholds, v<=band -> score
    receivableTurnover:[[12,95],[6,80],[3,55],[0,35]],
    dso:[[30,90],[45,70],[60,50],[9e9,30]],          // lower better on days
    revenueGrowth:[[0.10,100],[0.04,80],[0,55],[-9,30]],
    netProfitGrowth:[[0.10,100],[0.04,80],[0,55],[-9,30]],
  };
  const b=bands[m.id]; if(!b) return null;
  for(const [th,sc] of b){ if(down){ if(v<=th) return sc; } else { if(v>=th) return sc; } }
  return b[b.length-1][1];
}

function toneFor(s){ if(s==null) return "none"; if(s>=75) return "good"; if(s>=50) return "warn"; return "bad"; }
function labelFor(s){ if(s==null) return "No data"; if(s>=80) return "Strong"; if(s>=60) return "Adequate"; return "Weak"; }

/* ---------- 1g. BUILD THE REPORT MODEL ---------- */
function buildModel(){
  const measures=M.map(computeMeasure);
  const byFam={}; FAMILY_ORDER.forEach(f=>byFam[f]=[]);
  measures.forEach(m=>byFam[m.family].push(m));
  const families=FAMILY_ORDER.map(fam=>{
    const list=byFam[fam];
    const scores=list.map(scoreRatio).filter(s=>s!=null);
    const total=list.length;
    const computed=list.filter(m=>m.state==="computed").length;
    const excludedLowSignal=list.filter(m=>m.state==="computed"&&m.scoreExclude).length;
    const score=scores.length? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
    return {family:fam,score,label:labelFor(score),tone:toneFor(score),
      scored:scores.length,computed,total,excludedLowSignal};
  });
  const scoredFams=families.filter(f=>f.score!=null);
  const overall=scoredFams.length? Math.round(scoredFams.reduce((a,b)=>a+b.score,0)/scoredFams.length):null;
  return {
    entity:E, period:"FY2025", preparedAt:"2026-08-26", mizanVersion:"2.1.0",
    sha256:"5ef096ae85951ee6f4abb41d414f011f", preparedBy:"Jonathan Z",
    integrity:{ coverageRead:17, coverageTotal:19, complete:false, balanceSheetRead:false, cashFlowRead:false,
      itemsHeldForPerson:7, classificationBasis:"IFRS (assumed from entity type; not confirmed)",

      {label:"Total equity",v:fmt.aed(F["equity.2025"].canonicalMinor),d:"31 Dec 2025",tone:"none"},
      {label:"EPS",v:"AED 0.21",d:"matches reported",tone:"none"},
    ],
    overall, families, measures, byFam,
    clusters:[CLUSTER], findings:FINDINGS, tieOuts:TIEOUTS, figures:Object.values(F),
    verification:{ evidenceGaps:2, confirmations:4, judgments:1, items:VITEMS }
  };
}

  model.verification.items.forEach(it=>dl.appendChild($(`<div class="rrow" style="grid-template-columns:auto 1fr auto">
     <span class="dot ${it.k==='evidence'?'bg-bad':it.k==='confirm'?'bg-warn':'bg-none'}"></span>
     <span class="rname">${esc(it.t)}</span><span class="rstate">${esc(srcStr(it.src))}</span></div>`)));
  vz.appendChild(dl);
  app.appendChild(vz);

  app.appendChild($(`<div class="foot">
    <span>Mizan ${model.mizanVersion}</span><span>SHA-256 ${model.sha256}</span>
    <span>Prepared by ${esc(model.preparedBy)}</span><span>${model.preparedAt}</span>
    <span>Figures read from source. Not an opinion on the accounts.</span></div>`));
}

function ratioRow(m){
  const row=$(`<div class="rrow ${m.state}"></div>`);
  row.appendChild($(`<span class="rname">${esc(m.name)}${m.lowSignal?' <span class="tone-warn" title="low-signal">\u26a0</span>':""}</span>`));
  row.appendChild($(`<span class="rval">${esc(m.display||"\u2014")}</span>`));
  const tag=m.state==="reported"?"reported":m.lowSignal?"low-signal":"computed";
  row.appendChild($(`<span class="rstate">${tag}</span>`));
  if(m.caveat) row.appendChild($(`<div class="caveat">${esc(m.caveat)}</div>`));
  // trace on demand
  const tr=$(`<div class="trace" style="display:none"></div>`);
  tr.textContent=m.formula+"   \u2022   "+(m.trace?m.trace.map(srcStr).join("  |  "):"");
  const link=$(`<span class="linkish" style="grid-column:1/-1;padding:0 8px 4px">Trace \u25be</span>`);
  link.onclick=()=>{tr.style.display=tr.style.display==="none"?"block":"none";};
  row.appendChild(link); row.appendChild(tr);
  return row;
}
function findingEl(f,inCluster){
  const el=$(`<div class="finding ${f.severity}"></div>`);
  el.appendChild($(`<div class="ftop"><span class="fsev">${f.severity}</span>
     <span class="fdec">${f.decision.replace(/_/g," ")}</span></div>`));
  el.appendChild($(`<div class="fobs">${esc(f.obs)}</div>`));
  if(f.calc) el.appendChild($(`<div class="fcalc">${esc(f.calc)}</div>`));
  el.appendChild($(`<div class="fbody">${esc(f.interpretation)}${f.decisionNeeded?` <b>Decision:</b> ${esc(f.decisionNeeded)}`:""}</div>`));
  el.appendChild($(`<div class="fsrc">${f.evidence.map(srcStr).join("  |  ")}</div>`));
  return el;
}

/* ====================== 3. PDF DOCUMENT RENDERER ======================
   A separate renderer that lays out for paper. Scope selects sections.
   Sections: 1 Executive, 2 Financial Profile, 3 Key Findings,
             4 Financial Statements, 5 Evidence, 6 Verification, Appendix     */
const SCOPE_SECTIONS={
  executive:["cover","exec","profile","findings"],
  full:["cover","exec","profile","findings","statements","evidence","verification","appendix"],
  appendix:["cover","evidence","verification","appendix"],
};
function runhead(model){return `<div class="runhead"><span>${esc(model.entity)} \u00b7 ${model.period}</span><span>Mizan ${model.mizanVersion} \u00b7 Financial Statement Analysis</span></div>`;}
function runfoot(model){return `<div class="runfoot"><span>Prepared by ${esc(model.preparedBy)} \u00b7 SHA-256 ${model.sha256}</span><span>Confidential \u00b7 figures read from source</span></div>`;}
function page(model,inner,cover){return `<div class="page">${cover?"":runhead(model)}${inner}${cover?"":runfoot(model)}</div>`;}

function renderPrint(model,scope){
  const secs=SCOPE_SECTIONS[scope]||SCOPE_SECTIONS.full;
  let html="";
  for(const s of secs) html+=SECTION[s](model);
  const r=document.getElementById("report"); r.innerHTML=html;
}
const SECTION={
  cover:(m)=>page(m,`<div class="cover">
     <div class="cbrand">Mizan<small>Nexus AI Assurance FZCO \u00b7 Dubai</small></div>
     <div class="ctitle">Financial Statement Analysis</div>
     <div class="centity">${esc(m.entity)}</div>
     <div class="cmeta">Year ended 31 December 2025<br>Prepared ${m.preparedAt} \u00b7 Mizan ${m.mizanVersion}<br>${esc(m.integrity.classificationBasis)}</div>
     <div class="cscore">
       <div><div class="cap">Available-metric score</div><div class="big num">${m.overall??"\u2014"}<span style="font-size:16pt;color:#777">/100</span></div>
         <div class="cap">${m.families.filter(f=>f.score!=null).length} of 7 families \u00b7 rubric v0</div></div>
       <div class="integ"><div class="cap">Source coverage: ${m.integrity.coverageRead} / ${m.integrity.coverageTotal} slices \u00b7 incomplete</div>
         <ul><li>Balance sheet not read (liquidity and asset ratios pending)</li>
             <li>Cash flow partial (cash-conversion pending)</li>
             <li>${m.integrity.itemsHeldForPerson} items held for a person</li>
             <li>2 batches timed out; an interrupted batch is never evidence a page is blank</li></ul></div>
     </div>
     <div class="tag">Autonomous when certain. Accountable when not.</div>
   </div>`,true),

  exec:(m)=>page(m,`<div class="doc-secnum">SECTION 1</div><h2 class="doc-h2">Executive Summary</h2>
     <table class="doc"><tr><th>Measure</th><th style="text-align:right">Value</th><th>Basis</th></tr>
       <tr><td>Revenue</td><td class="n">AED 3.10bn</td><td>+35.1% YoY</td></tr>
       <tr><td>Net profit</td><td class="n">AED 1.55bn</td><td>+33.4% YoY</td></tr>
       <tr><td>Total equity</td><td class="n">AED 1.22bn</td><td>31 Dec 2025</td></tr>
       <tr><td>EPS</td><td class="n">AED 0.21</td><td>computed 0.2071, matches reported</td></tr>
       <tr><td>Available-metric score</td><td class="n">${m.overall}/100</td><td>4 of 7 families, rubric v0</td></tr></table>
     <h4 style="font-family:var(--serif);margin:4mm 0 1mm">Matters ranked highest</h4>
     ${m.findings.filter(f=>f.tier==="key_matter").slice(0,5).map((f,i)=>`
        <div class="keymatter ${f.severity}"><div class="km-cap">${String(i+1).padStart(2,"0")} \u00b7 ${f.severity} \u00b7 ${f.decision.replace(/_/g," ")}</div>
          <div class="km-obs">${esc(f.obs)}</div>${f.calc?`<div class="km-body">${esc(f.calc)}</div>`:""}
          <div class="km-src">${f.evidence.map(srcStr).join("  |  ")}</div></div>`).join("")}`),

  profile:(m)=>page(m,`<div class="doc-secnum">SECTION 2</div><h2 class="doc-h2">Financial Profile</h2>
     <p class="doc-lead">Ratios computed from unit-normalized figures. Reported ratios are labelled. Ratios whose inputs are absent are listed compactly rather than expanded.</p>
     ${FAMILY_ORDER.map(fam=>{
        const list=m.byFam[fam]; const shown=list.filter(x=>x.state==="computed"||x.state==="reported");
        const hidden=list.filter(x=>x.state==="pending"||x.state==="market"||x.state==="na");
        const fsc=m.families.find(f=>f.family===fam);
        return `<div class="doc-ratiofam"><h4>${FAMILY_LABEL[fam]} <span>${fsc.score!=null?fsc.score+"/100 "+fsc.label:"no data"}</span></h4>
          ${shown.length?`<table class="doc"><tr><th>Ratio</th><th style="text-align:right">Value</th><th>Formula</th></tr>
            ${shown.map(x=>`<tr><td>${esc(x.name)}${x.lowSignal?" (low-signal)":""}${x.state==="reported"?" (reported)":""}</td>
               <td class="n">${esc(x.display)}</td><td>${esc(x.formula)}</td></tr>`).join("")}</table>`:""}
          ${hidden.length?`<div class="unavail">Unavailable: ${hidden.map(x=>esc(x.name)+" ("+(x.state==="market"?"market data":x.state==="na"?"n/a":"pending")+")").join(" \u00b7 ")}</div>`:""}
        </div>`;
     }).join("")}
     <div class="doc-note">Scoring uses documented default rubric v0 (thresholds inspectable in source). Reported and low-signal ratios are excluded from scoring.</div>`),

  findings:(m)=>page(m,`<div class="doc-secnum">SECTION 3</div><h2 class="doc-h2">Key Findings</h2>
     <div class="keymatter high"><div class="km-cap">cluster \u00b7 high</div>
       <div class="km-obs">${esc(m.clusters[0].title)}</div><div class="km-body">${esc(m.clusters[0].summary)}</div></div>
     ${m.findings.map(f=>`<div class="keymatter ${f.severity}">
        <div class="km-cap">${f.tier==="key_matter"?"key matter":"observation"} \u00b7 ${f.severity} \u00b7 ${f.decision.replace(/_/g," ")}</div>
        <div class="km-obs">${esc(f.obs)}</div>
        ${f.calc?`<div class="km-body">${esc(f.calc)}</div>`:""}
        <div class="km-body">${esc(f.interpretation)}${f.decisionNeeded?" Decision: "+esc(f.decisionNeeded):""}</div>
        <div class="km-src">${f.evidence.map(srcStr).join("  |  ")}</div></div>`).join("")}`),

  statements:(m)=>page(m,`<div class="doc-secnum">SECTION 4</div><h2 class="doc-h2">Financial Statements (extract)</h2>
     <p class="doc-lead">All figures AED thousands unless marked. Read from source; balance sheet not read on this coverage.</p>
     <table class="doc"><tr><th>Income statement</th><th style="text-align:right">2025</th><th style="text-align:right">2024</th></tr>
       <tr><td>Revenue</td><td class="n">3,096,913</td><td class="n">2,291,907</td></tr>
       <tr><td>Total finance costs</td><td class="n">(313,146)</td><td class="n">(256,824)</td></tr>
       <tr><td>Depreciation and amortisation</td><td class="n">(144,769)</td><td class="n">(89,863)</td></tr>
       <tr><td>Profit before tax</td><td class="n">1,706,954</td><td class="n">1,279,686</td></tr>
       <tr><td>Net profit</td><td class="n">1,553,362</td><td class="n">1,164,548</td></tr>
       <tr><td>EPS (AED)</td><td class="n">0.21</td><td class="n">0.16</td></tr></table>
     <table class="doc"><tr><th>Selected balances</th><th style="text-align:right">2025</th></tr>
       <tr><td>Total equity</td><td class="n">1,218,666</td></tr>
       <tr><td>Total financial liabilities</td><td class="n">6,068,266</td></tr>
       <tr><td>Due to a related party</td><td class="n">1,985,477</td></tr>
       <tr><td>Net borrowings</td><td class="n">3,995,191</td></tr>
       <tr><td>Trade receivables (net)</td><td class="n">169,010</td></tr></table>`),

  evidence:(m)=>page(m,`<div class="doc-secnum">SECTION 5</div><h2 class="doc-h2">Evidence and Traceability</h2>
     <p class="doc-lead">Every figure carries the page it was read from. Arithmetic is computed only from normalized values.</p>
     <table class="doc"><tr><th>Figure</th><th style="text-align:right">AED thousands</th><th>Source</th><th style="text-align:right">Conf.</th></tr>
       ${m.figures.filter(f=>f.currency==="AED"&&!f.derived).map(f=>`<tr><td>${esc(f.label)} ${f.period}</td>
          <td class="n">${th(f.raw)}</td><td>${srcStr(f.source)}</td><td class="n">${Math.round(f.confidence*100)}%</td></tr>`).join("")}</table>
     <h4 style="font-family:var(--serif);margin:3mm 0 1mm">Tie-outs</h4>
     <table class="doc"><tr><th>Check</th><th>Result</th><th>Source</th></tr>
       ${m.tieOuts.map(t=>`<tr><td>${esc(t.statement)}</td><td>${t.ok?"reconciles":"review"}</td><td>${srcStr(t.source)}</td></tr>`).join("")}</table>`),

  verification:(m)=>page(m,`<div class="doc-secnum">SECTION 6</div><h2 class="doc-h2">Verification Queue</h2>
     <p class="doc-lead">${m.verification.evidenceGaps} evidence gaps \u00b7 ${m.verification.confirmations} management confirmations \u00b7 ${m.verification.judgments} judgment. Primary owner unassigned.</p>
     <table class="doc"><tr><th>Item</th><th>Type</th><th>Source</th></tr>
       ${m.verification.items.map(it=>`<tr><td>${esc(it.t)}</td><td>${it.k}</td><td>${srcStr(it.src)}</td></tr>`).join("")}</table>`),

  appendix:(m)=>page(m,`<div class="doc-secnum">APPENDIX</div><h2 class="doc-h2">Full Ratio Catalogue</h2>
     <table class="doc"><tr><th>Ratio</th><th>Family</th><th style="text-align:right">Value</th><th>State</th></tr>
       ${m.measures.map(x=>`<tr><td>${esc(x.name)}</td><td>${FAMILY_LABEL[x.family]}</td>
          <td class="n">${esc(x.display||"\u2014")}</td><td>${x.state}${x.lowSignal?", low-signal":""}</td></tr>`).join("")}</table>
     <div class="doc-note">States: computed (Mizan calculated from canonical inputs) \u00b7 reported (entity disclosed, not rebuilt) \u00b7 pending (input absent) \u00b7 market (needs market data) \u00b7 n/a (not applicable to this entity).</div>`),
};

/* ---------- wire up ---------- */
const MODEL=buildModel();
renderWeb(MODEL);
const report=document.getElementById("report");
const btnExport=document.getElementById("tb-export"), btnClose=document.getElementById("tb-close");
btnExport.onclick=()=>{
  const scope=document.getElementById("tb-scope").value;
  renderPrint(MODEL,scope);
  report.classList.add("show");
  btnClose.style.display="";
  // give layout a tick, then open the browser's Save-as-PDF on the DOCUMENT render
  setTimeout(()=>window.print(),120);
};
btnClose.onclick=()=>{report.classList.remove("show");btnClose.style.display="none";};
window.onafterprint=()=>{/* keep preview open so the user can review the document render */};
</script>
