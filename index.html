              <div className="mz-class">
                <div>
                  <div className="mz-class-meta">Classified as</div>
                  <div className="mz-class-lens">
                    {data.classification?.lens === "public_sector" ? "Public sector entity" : "Corporate entity"}
                  </div>
                  <div className="mz-class-meta" style={{ marginTop: ".4rem", marginBottom: 0 }}>
                    {[data.classification?.basis, data.entity?.name, data.entity?.period].filter(Boolean).join(" · ")}
                  </div>
                </div>
                <p className="mz-class-why">{data.classification?.why}</p>
              </div>
            </section>

            {data.entity?.auditOpinion && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Audit opinion</h2>
                  <span className="mz-sec-note">as stated</span>
                </div>
                <div className="mz-row landed">
                  <div className="mz-tick verified">{MARK.verified}</div>
                  <div className="mz-body"><p className="mz-title">{data.entity.auditOpinion}</p></div>
                  <div className="mz-ref">Auditor's report</div>
                </div>
              </section>
            )}

            {bal && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Does it balance</h2>
                  <span className="mz-sec-note">arithmetic, not a model</span>
                </div>
                <div className="mz-arith">
                  <div className="mz-arith-strip">
                    <span>Computed in this browser</span>
                    <span>{data.entity?.currency} {data.entity?.scale}</span>
                  </div>
                  <div className="mz-eq">
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total assets</span><span className="mz-eq-val">{fmt(data.balance.totalAssets)}</span></div>
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total liabilities</span><span className="mz-eq-val">{fmt(data.balance.totalLiabilities)}</span></div>
                    <div className="mz-eq-line">
                      <span className="mz-eq-lbl">{data.classification?.lens === "public_sector" ? "Net assets" : "Total equity"}</span>
                      <span className="mz-eq-val">{fmt(data.balance.totalNetAssets)}</span>
                    </div>
                    <div className="mz-eq-rule" />
                    <div className="mz-eq-line">
                      <span className="mz-eq-lbl">Difference</span>
                      <span className="mz-eq-val" style={{ color: bal.ok ? "var(--tick)" : "var(--esc)" }}>{fmt(bal.delta)}</span>
                    </div>
                  </div>
                  <div className={"mz-verdict " + (bal.ok ? "pass" : "fail")}>
                    {bal.ok
                      ? MARK.verified + "  Assets equal liabilities plus net assets. Nothing here rests on judgement."
                      : MARK.escalate + "  Off by " + fmt(Math.abs(bal.delta)) + ". Reported as-is. No figure on this page should be relied on until a person finds the cause."}
                  </div>
                </div>
              </section>
            )}

            {data.tieOut?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Tie-out</h2>
                  <span className="mz-sec-note">{data.tieOut.length} checks</span>
                </div>
                {data.tieOut.map((t, i) => {
                  const st = t.result === "pass" ? "verified" : t.result === "fail" ? "escalate" : "review";
                  return (
                    <div key={i} className="mz-row landed">
                      <div className={"mz-tick " + st}>{MARK[st]}</div>
                      <div className="mz-body"><p className="mz-title">{t.check}</p><p className="mz-detail">{t.detail}</p></div>
                      <div className="mz-ref">{tidyRef(t.ref)}</div>
                    </div>
                  );
                })}
              </section>
            )}

            {data.figures?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Figures</h2>
                  <span className="mz-sec-note">every one carries its page and its certainty</span>
                </div>
                <div className="mz-figs">
                  {data.figures.map((f, i) => {
                    const corrected = edits[f.label] != null;
                    const cf = typeof f.confidence === "number" ? f.confidence : null;
                    const band = cf == null ? "" : cf >= 95 ? "hi" : cf >= 80 ? "mid" : "lo";
                    const open = openFig === i;
                    return (
                      <div key={i} className={"mz-fig " + (f.state || "review")}>
                        <div
                          className={"mz-fig-lbl" + (f.quote ? " mz-fig-label click" : "")}
                          title={f.quote ? "Show the sentence this came from" : f.label}
                          onClick={() => f.quote && setOpenFig(open ? null : i)}
                        >
                          {f.label}{corrected && <span className="mz-corrected">corrected</span>}
                        </div>
                        <input
                          className="mz-fig-input"
                          value={corrected ? edits[f.label] : normNum(f.value)}
                          onChange={(e) => setEdits((p) => ({ ...p, [f.label]: e.target.value }))}
                          aria-label={"Value for " + f.label}
                        />
                        {cf != null && (
                          <div>
                            <span className={"mz-conf " + band}>
                              <span className="mz-conf-dot" />{cf}% confidence
                            </span>
                            {f.origin && f.origin !== "stated" && (
                              <span className={"mz-origin " + f.origin}>
                                {f.origin === "narrative" ? "AI generated" : f.origin}
                              </span>
                            )}
                            <div className="mz-conf-track">
                              <div className={"mz-conf-fill " + band} style={{ width: cf + "%" }} />
                            </div>
                          </div>
                        )}
                        {(() => {
                          const cp = compPair(f.value);
                          if (!cp) return null;
                          const mx = Math.max(cp.cur, cp.pri);
                          return (
                            <div className="mz-fig-comp">
                              <div className="mz-fig-comp-row">
                                <span>now</span>
                                <div className="mz-fig-comp-track"><div className={"mz-fig-comp-fill " + (cp.up ? "up" : "dn")} style={{ width: (cp.cur / mx * 100) + "%" }} /></div>
                              </div>
                              <div className="mz-fig-comp-row">
                                <span>prior</span>
                                <div className="mz-fig-comp-track"><div className="mz-fig-comp-fill pri" style={{ width: (cp.pri / mx * 100) + "%" }} /></div>
                              </div>
                            </div>
                          );
                        })()}
                        {open && f.quote && (
                          <div className="mz-quote">
                            <div className="mz-quote-l">Source sentence · {tidyRef(f.ref)}</div>
                            <div className="mz-quote-t">“{f.quote}”</div>
                          </div>
                        )}
                        <div className="mz-fig-ref">{tidyRef(f.ref)}{corrected && " · edited from " + f.value}</div>
                      </div>
                    );
                  })}
                </div>
                <div className="mz-legend">
                  <span>Confidence is the reading's own certainty, stated per figure rather than assumed.</span>
                  <span>Click a label with a source sentence to see the exact text it was read from.</span>
                </div>
              </section>
            )}

            {data.variance?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Budget against actual</h2>
                  <span className="mz-sec-note">bar shows spend against approved</span>
                </div>
                {data.variance.map((v, i) => {
                  const pct = v.budget ? (v.actual / v.budget) * 100 : 0;
                  const under = pct < 90;
                  return (
                    <div key={i} className="mz-var-row">
                      <div>
                        <div className="mz-var-lbl">{v.label}</div>
                        <div className="mz-var-track">
                          <div className={"mz-var-fill" + (under ? " under" : "")} style={{ width: Math.min(pct, 100) + "%" }} />
                        </div>
                      </div>
                      <div className="mz-var-pct" style={{ color: under ? "var(--query)" : "var(--ink)" }}>{pct.toFixed(0)}%</div>
                    </div>
                  );
                })}
              </section>
            )}

            {ratios && ratiosOk.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Financial ratios</h2>
                  <span className="mz-sec-note">
                    {ratiosOk.length} of {ratios.length} computed · arithmetic, not a model
                  </span>
                </div>
                {FAMILIES.map((fam) => {
                  const group = ratios.filter((r) => r.family === fam);
                  if (!group.length) return null;
                  const done = group.filter((r) => r.status === "ok").length;
                  return (
                    <div key={fam} className="mz-rfam">
                      <div className="mz-rfam-h">{fam} · {done}/{group.length}</div>
                      {group.map((r) => {
                        const card = openRatio === r.name;
                        const explain = r.what || r.why || r.typical || r.limits;
                        return (
                        <div key={r.name} className={"mz-ratio " + (r.status === "ok" ? "ok" : "missing")}>
                          <div className="mz-ratio-main">
                            <div
                              className={"mz-ratio-name" + (explain ? " click" : "")}
                              title={explain ? "What this ratio means" : r.name}
                              onClick={() => explain && setOpenRatio(card ? null : r.name)}
                            >{r.name}</div>
                            <div className="mz-ratio-formula">{r.formula}</div>
                            {r.status === "ok"
                              ? (
                                <>
                                  <div className="mz-ratio-note">{r.note}</div>
                                  {r.typical && (
                                    <div className="mz-ratio-typ">Typical range · {r.typical}</div>
                                  )}
                                </>
                              )
                              : (
                                <div className="mz-ratio-miss">
                                  <strong>Could not compute.</strong>{" "}
                                  Reason: {r.reason ? r.reason.headline : "an input was missing."}{" "}
                                  {r.reason ? r.reason.detail : "Needs " + (r.missing || []).join(" and ") + "."}{" "}
                                  Held for a person, not estimated.
                                </div>
                              )}
                          </div>
                          <div className="mz-ratio-right">
                            <div className="mz-ratio-val">
                              {r.status === "ok" ? r.shown : "\u2014"}
                            </div>
                            {r.status === "ok" && isFinite(r.value) && (
                              <div className="mz-ratio-bar">
                                <div
                                  className="mz-ratio-bar-fill"
                                  style={{ width: Math.min(100, Math.max(4,
                                    r.pct ? Math.abs(r.value) * 100
                                    : Math.min(Math.abs(r.value) * 10, 100))) + "%" }}
                                />
                              </div>
                            )}
                            {r.status === "ok" && r.score != null && (
                              <div className={"mz-score-tag " + scoreBand(r.score).tone}
                                   style={{ marginTop: ".35rem" }}>
                                {scoreBand(r.score).label}
                              </div>
                            )}
                          </div>
                          {card && (
                            <div className="mz-card">
                              <div className="mz-card-g">
                                <div className="mz-card-b"><span className="mz-card-l">Definition</span><p>{r.what || "—"}</p></div>
                                <div className="mz-card-b"><span className="mz-card-l">Formula</span><p>{r.formula}</p></div>
                                <div className="mz-card-b"><span className="mz-card-l">Why investors care</span><p>{r.why || "—"}</p></div>
                                <div className="mz-card-b"><span className="mz-card-l">Typical range</span><p>{r.typical || "—"}</p></div>
                                <div className="mz-card-b"><span className="mz-card-l">Limitations</span><p>{r.limits || "—"}</p></div>
                                <div className="mz-card-b"><span className="mz-card-l">Inputs it needs</span><p>{(r.needs || []).map((k) => NEED_LABEL[k] || k).join(", ")}</p></div>
                              </div>
                            </div>
                          )}
                        </div>
                        );
                      })}
                    </div>
                  );
                })}
                <div className="mz-legend">
                  <span>Every computed ratio uses figures the reading pulled from the statements.</span>
                  <span>A ratio marked — is missing an input and is never guessed.</span>
                  <span>Click a ratio name for what it means, why it matters and where it misleads.</span>
                </div>
              </section>
            )}

            {(evalState !== "idle") && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Performance evaluation</h2>
                  <span className="mz-sec-note">
                    {evalState === "working" ? "writing\u2026" : evalState === "error" ? "unavailable" : "AI analysis \u00b7 not arithmetic"}
                    {lens ? " \u00b7 " + LENS_LABEL[lens] : ""}
                  </span>
                </div>

                {/* Same data, re-read for a different audience. The figures and ratios
                    never change; only the reader the evaluation is written for does. */}
                <div className="mz-lens">
                  {LENSES.map((l) => (
                    <button
                      key={l.key || "general"}
                      className={"mz-lens-b" + (lens === l.key ? " on" : "")}
                      disabled={evalState === "working"}
                      onClick={() => { setLens(l.key); runEvaluation(data, ratios, l.key); }}
                    >{l.label}</button>
                  ))}
                </div>
                <div className="mz-lens-blurb">
                  {(LENSES.find((l) => l.key === lens) || LENSES[0]).blurb}{" "}
                  Same figures, same ratios \u2014 a different reader.
                </div>

                {evalState === "working" && (
                  <div className="mz-eval-load">
                    <div className="mz-eval-load-t">Interpreting the ratios and figures</div>
                    <div className="mz-scan" style={{ maxWidth: "20rem" }} />
                  </div>
                )}

                {evalState === "error" && (
                  <div className="mz-note" style={{ borderColor: "var(--query)" }}>
                    The written evaluation could not be produced: {evalErr} The ratios and findings above are unaffected.
                  </div>
                )}

                {evalState === "done" && evaluation && (
                  <div className="mz-eval">
                    <div className="mz-eval-banner">
                      Written analysis by the model, interpreting the figures above. It is judgment, not audited fact \u2014 weigh it as an analyst\u2019s view.
                    </div>

                    {evaluation.headline && <p className="mz-eval-head">{evaluation.headline}</p>}
                    {evaluation.overall && <p className="mz-eval-over">{evaluation.overall}</p>}

                    {(evaluation.assessment || []).length > 0 && (
                      <div className="mz-eval-grid">
                        {evaluation.assessment.map((a, i) => (
                          <div key={i} className={"mz-eval-area read-" + (a.read || "mixed")}>
                            <div className="mz-eval-area-h">
                              <span>{a.area}</span>
                              <span className={"mz-eval-tag read-" + (a.read || "mixed")}>{a.read}</span>
                            </div>
                            <p className="mz-eval-area-t">{a.text}</p>
                            {((a.drivers || []).length > 0 || a.conclusion) && (
                              <div className="mz-why">
                                <div className="mz-why-h">Why this reading</div>
                                {(a.drivers || []).map((d, j) => (
                                  <div key={j} className="mz-why-d"><span>✓</span><span>{d}</span></div>
                                ))}
                                {a.conclusion && (
                                  <div className="mz-why-c"><b>Conclusion</b>{a.conclusion}</div>
                                )}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}

                    {((evaluation.strengths || []).length > 0 || (evaluation.concerns || []).length > 0) && (
                      <div className="mz-eval-sc">
                        {(evaluation.strengths || []).length > 0 && (
                          <div className="mz-eval-col">
                            <div className="mz-eval-col-h pos">Strengths</div>
                            <ul>{evaluation.strengths.map((s, i) => <li key={i}>{s}</li>)}</ul>
                          </div>
                        )}
                        {(evaluation.concerns || []).length > 0 && (
                          <div className="mz-eval-col">
                            <div className="mz-eval-col-h neg">Concerns</div>
                            <ul>{evaluation.concerns.map((s, i) => <li key={i}>{s}</li>)}</ul>
                          </div>
                        )}
                      </div>
                    )}

                    {(evaluation.considerations || []).length > 0 && (
                      <div className="mz-eval-rec">
                        <div className="mz-eval-rec-h">Considerations for management</div>
                        <div className="mz-eval-rec-note">Options to weigh, grounded in the figures. Not directives.</div>
                        {evaluation.considerations.map((c, i) => (
                          <div key={i} className="mz-eval-rec-item">
                            <div className="mz-eval-rec-for">{c.for}</div>
                            <p>{c.text}</p>
                          </div>
                        ))}
                      </div>
                    )}

                    {(evaluation.dataGaps || []).length > 0 && (
                      <div className="mz-eval-gaps">
                        <b>What limited this evaluation:</b> {evaluation.dataGaps.join("; ")}.
                      </div>
                    )}
                  </div>
                )}
              </section>
            )}

            {((data.findings?.length > 0) || manual.length > 0) && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Findings</h2>
                  <span className="mz-sec-note">{shownFindings.length} shown</span>
                </div>
                <div className="mz-controls">
                  <input className="mz-in" placeholder="Search findings" value={query}
                    onChange={(e) => setQuery(e.target.value)} aria-label="Search findings" />
                  <div className="mz-filters">
                    {["all", "verified", "review", "escalate"].map((k) => (
                      <button key={k} className={"mz-filter" + (filterState === k ? " on" : "")}
                        onClick={() => setFilterState(k)}>{k}</button>
                    ))}
                  </div>
                  <button className="mz-btn ghost" onClick={addManualFinding}>+ Add finding</button>
                </div>
                {shownFindings.map((f, i) => (
                  f.manual ? (
                    <div key={"m" + i} className="mz-row mz-manual landed">
                      <div className={"mz-tick " + (f.state || "review")}>{MARK[f.state] || "?"}</div>
                      <div className="mz-body">
                        <input className="mz-edit-title" value={f.title}
                          onChange={(e) => updateManual(manual.indexOf(f), "title", e.target.value)} />
                        <textarea className="mz-edit-detail" value={f.detail} placeholder="Detail"
                          onChange={(e) => updateManual(manual.indexOf(f), "detail", e.target.value)} />
                        <div className="mz-edit-row">
                          <select value={f.state} onChange={(e) => updateManual(manual.indexOf(f), "state", e.target.value)}>
                            <option value="verified">verified</option>
                            <option value="review">review</option>
                            <option value="escalate">escalate</option>
                          </select>
                          <select value={f.severity} onChange={(e) => updateManual(manual.indexOf(f), "severity", e.target.value)}>
                            <option value="high">high</option>
                            <option value="medium">medium</option>
                            <option value="low">low</option>
                          </select>
                          <button className="mz-del" onClick={() => removeManual(manual.indexOf(f))}>remove</button>
                        </div>
                      </div>
                      <div className="mz-ref">operator entry</div>
                    </div>
                  ) : (
                    <div key={"f" + i} className="mz-row landed">
                      <div className={"mz-tick " + (f.state || "review")}>{MARK[f.state] || "?"}</div>
                      <div className="mz-body">
                        <p className="mz-title">{f.title}{f.severity && <span className={"mz-sev " + f.severity}>{f.severity}</span>}</p>
                        <p className="mz-detail">{f.detail}</p>
                        {f.metric && <p className="mz-metric">{f.metric}</p>}
                        {typeof f.confidence === "number" && (
                          <span className={"mz-conf " + (f.confidence >= 95 ? "hi" : f.confidence >= 80 ? "mid" : "lo")}
                                style={{ marginTop: ".35rem" }}>
                            <span className="mz-conf-dot" />{f.confidence}% confidence
                          </span>
                        )}
                      </div>
                      <div className="mz-ref">{tidyRef(f.ref)}</div>
                    </div>
                  )
                ))}
                {shownFindings.length === 0 && (
                  <div className="mz-row"><div className="mz-tick"></div>
                    <div className="mz-body"><p className="mz-detail">No findings match this filter or search.</p></div>
                    <div className="mz-ref"></div></div>
                )}
                <div className="mz-legend">
                  <span><b style={{ color: "var(--tick)" }}>{MARK.verified}</b> read from the document</span>
                  <span><b style={{ color: "var(--query)" }}>{MARK.review}</b> derived, confirm it</span>
                  <span><b style={{ color: "var(--esc)" }}>{MARK.escalate}</b> a person decides</span>
                </div>
              </section>
            )}

            {data.escalations?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Held for a person</h2>
                  <span className="mz-sec-note">not answered, on purpose</span>
                </div>
                {data.escalations.map((e, i) => (
                  <div key={i} className="mz-esc-card">
                    <p className="mz-esc-t">{e.title}</p>
                    <p className="mz-esc-w">{e.why}</p>
                    <div className="mz-esc-d">
                      <b>Decision needed</b>
                      {e.decisionNeeded}
                      <div className="mz-owner">
                        <label htmlFor={"own" + i}>Accountable owner</label>
                        <input id={"own" + i} className="mz-in" placeholder="Name the person"
                          value={owners[i] || ""} onChange={(ev) => setOwners({ ...owners, [i]: ev.target.value })} />
                      </div>
                      <span style={{ display: "block", marginTop: ".5rem", fontFamily: "'IBM Plex Mono',monospace", fontSize: ".63rem", color: "var(--ink-soft)" }}>{e.ref}</span>
                    </div>
                  </div>
                ))}
              </section>
            )}

            {trail.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">How this reading happened</h2>
                  <span className="mz-sec-note">{trail.length} steps · in order</span>
                </div>
                <div className="mz-tl">
                  {trail.map((t, i) => (
                    <div key={i} className={"mz-tl-i " + t.kind}>
                      <div className="mz-tl-t">
                        {trail[0] ? "+" + ((t.at - trail[0].at) / 1000).toFixed(1) + "s" : ""}
                      </div>
                      <div className="mz-tl-rail"><div className="mz-tl-dot" /></div>
                      <div>
                        <div className="mz-tl-txt">{t.text}</div>
                        {t.detail && <div className="mz-tl-d">{t.detail}</div>}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mz-legend">
                  <span>Recorded as the reading ran, not reconstructed afterwards.</span>
                  <span>A red dot is a step that did not succeed.</span>
                </div>
              </section>
            )}

            {aiCalls.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">AI audit log</h2>
                  <span className="mz-sec-note">every model call made for this document</span>
                </div>
                <div className="mz-log">
                  <table>
                    <thead>
                      <tr>
                        <th>#</th><th>Step</th><th>Scope</th><th>Model</th><th>Result</th>
                        <th className="n">Tokens in</th><th className="n">Tokens out</th><th className="n">Cost USD</th>
                      </tr>
                    </thead>
                    <tbody>
                      {aiCalls.map((c, i) => (
                        <tr key={i}>
                          <td>{i + 1}</td>
                          <td>{c.step}</td>
                          <td>{c.detail}</td>
                          <td>{c.model}</td>
                          <td style={{ color: c.status === "ok" ? "var(--tick)" : c.status === "failed" ? "var(--esc)" : "var(--query)" }}>
                            {c.status}
                          </td>
                          <td className="n">{c.input_tokens.toLocaleString()}</td>
                          <td className="n">{c.output_tokens.toLocaleString()}</td>
                          <td className="n">{c.cost_usd.toFixed(5)}</td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot>
                      <tr>
                        <td colSpan={5}>{aiCalls.length} calls</td>
                        <td className="n">{aiCalls.reduce((a, c) => a + c.input_tokens, 0).toLocaleString()}</td>
                        <td className="n">{aiCalls.reduce((a, c) => a + c.output_tokens, 0).toLocaleString()}</td>
                        <td className="n">{aiCalls.reduce((a, c) => a + c.cost_usd, 0).toFixed(5)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <div className="mz-legend">
                  <span>Balance, tie-out and every ratio were computed on this machine and cost nothing.</span>
                  <span>Only the calls listed here involved a model.</span>
                </div>
              </section>
            )}

            {meta && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Evidence record</h2>
                  <span className="mz-sec-note">emitted for every reading</span>
                </div>
                <div className="mz-ev">
                  <div><b>Document</b> {meta.name} · {meta.pages} pages</div>
                  {(meta.docs || []).length > 1 && (meta.docs || []).map((d, i) => (
                    <div key={i} style={{ paddingLeft: "1.2rem" }}>
                      <b>{i + 1}</b> {d.name} · {d.pages} pages · {(d.hash || "").slice(0, 16)}…
                    </div>
                  ))}
                  <div><b>SHA-256</b> {meta.hash}{(meta.docs || []).length > 1 && " (of the set, in order)"}</div>
                  <div><b>Read at</b> {meta.at} · took {meta.seconds}s</div>
                  <div><b>System</b> Mizan {VERSION} · {meta.model}</div>
                  <div>
                    <b>Coverage</b> {meta.read}/{meta.slices} slices
                    {meta.failed > 0 && <span style={{ color: "var(--esc)" }}> · {meta.failed} unread, this reading is not complete</span>}
                  </div>
                  <div>
                    <b>Cost of this reading</b> ${meta.cost_usd?.toFixed(4)} ·{" "}
                    {(meta.input_tokens || 0).toLocaleString()} in / {(meta.output_tokens || 0).toLocaleString()} out
                  </div>
                  <div><b>Operator</b> {operator || "UNRECORDED"}</div>
                  <div><b>Escalations open</b> {(data.escalations || []).length} · owners named {(data.escalations || []).filter((_, i) => owners[i]).length}</div>
                </div>
                <div className="mz-sec-head" style={{ marginTop: "1.2rem" }}>
                  <h2 className="mz-sec-title">Take it away</h2>
                  <span className="mz-sec-note">the same reading, six shapes</span>
                </div>
                <div className="mz-dl" style={{ padding: ".8rem 0" }}>
                  <button className="mz-btn ghost" onClick={downloadAuditPackage}>Audit package</button>
                  <button className="mz-btn ghost" onClick={downloadEvidence}>Evidence JSON</button>
                  <button className="mz-btn ghost" onClick={downloadCSV}>CSV</button>
                  <button className="mz-btn ghost" onClick={downloadExcel}>Excel</button>
                  <button className="mz-btn ghost" onClick={downloadMarkdown}>Markdown</button>
                  <button className="mz-btn ghost" onClick={downloadApiResponse}>API response</button>
                </div>
                <div className="mz-legend">
                  <span>The audit package carries the reading, the arithmetic, the judgment and the trail in one file.</span>
                  <span>The API response is the merged model output exactly as the ratio engine received it.</span>
                </div>
              </section>
            )}

            {state === "done" && (
              <footer className="mz-foot">
                <div>
                  <b>Mizan</b> {VERSION} · reading of {meta?.name || "document"}<br />
                  Figures are read from the document. Nothing here is an opinion on the accounts.
                </div>
                <div style={{ textAlign: "right" }}>
                  <b>Jonathan Z</b><br />
                  Nexus AI Assurance FZCO · Dubai<br />
                  [contact] · nexusai.ae
                </div>
              </footer>
            )}
          </>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
