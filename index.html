const STATEMENTS = [
  { key: "income_statement", label: "Income statement" },
  { key: "balance_sheet", label: "Balance sheet" },
  { key: "cash_flow", label: "Cash flow" },
  { key: "equity_statement", label: "Changes in equity" },
  { key: "notes", label: "Notes" },
  { key: "auditor_report", label: "Auditor report" }
];
const STATEMENT_PROOF = {
  income_statement: ["revenue", "operatingProfit", "netProfit", "costOfSales", "grossProfit"],
  balance_sheet: ["totalAssets", "totalLiabilities", "totalEquity", "currentAssets", "currentLiabilities"],
  cash_flow: ["operatingCashFlow", "capex", "dividendsPaid"]
};

const SOURCE_OF = {
  revenue: "Income statement", priorRevenue: "Income statement", costOfSales: "Income statement",
  grossProfit: "Income statement", operatingProfit: "Income statement", netProfit: "Income statement",

const coverageOf = (d) => STATEMENTS.map((s) => {
  const seen = (d.sections || []).filter((x) => x.kind === s.key);
  const proof = STATEMENT_PROOF[s.key] || [];
  const got = proof.filter((k) => d.lineItems && d.lineItems[k] != null).length;
  const pct = proof.length ? Math.round((got / proof.length) * 100) : (seen.length ? 100 : 0);
  return { ...s, pct, seen: seen.length > 0,
    pages: seen.map((x) => ((x.doc ? x.doc + " " : "") + (x.pages || "")).trim()).filter(Boolean).join(", "),
    proven: proof.length ? got + "/" + proof.length + " key lines" : (seen.length ? "seen" : "not seen") };
});

const missReason = (keys) => {
  const stmts = [...new Set(keys.map((k) => SOURCE_OF[k]).filter(Boolean))];
  const names = keys.map((k) => NEED_LABEL[k] || k);
  if (stmts.length === 1) return { headline: stmts[0] + " not yet read.", detail: "Needs " + names.join(" and ") + "." };
  return { headline: "Inputs not found in what was read.", detail: "Needs " + names.join(" and ") + "." };
};

// Ratios are arithmetic, computed here, never a model output. Two guards keep
// them honest: a missing input is reported as missing rather than estimated,
// and a result far outside its plausible band is blocked rather than printed,
// because that is the signature of two figures read in different scales.
const computeRatios = (lineItems) => {
  if (!lineItems) return null;
  const v = lineItems;
  return RATIO_DEFS.map((d) => {
    const missing = d.needs.filter((k) => v[k] == null || (v[k] === 0 && k !== "priorRevenue"));
    if (missing.length) {
      return { ...d, status: "missing", missing: missing.map((k) => NEED_LABEL[k] || k), reason: missReason(missing) };
    }
    let val;
    try { val = d.calc(v); } catch {
      return { ...d, status: "missing", reason: { headline: "Could not compute.", detail: "The arithmetic failed on these inputs." } };
    }
    if (!isFinite(val)) {
      return { ...d, status: "missing", reason: { headline: "Could not compute.", detail: "The denominator is zero." } };
    }
    // Scale guard. One figure read in thousands against another in millions
    // produces a result off by a factor of a thousand. Refuse it.
    // Plausibility gate. A result outside any believable band is the signature of
    // inputs read in different scales, or of a missing figure that collapsed the
    // arithmetic. Either way it is not publishable.
    const wild = (d.pct && Math.abs(val) > 5)
      || (d.unit === "x" && Math.abs(val) > 500)
      || (d.unit === " days" && Math.abs(val) > 3650)
      // A change of exactly -100% means the current figure vanished, which for a
      // going concern reporting both years means the prior value did not arrive.
      || (d.growth && val <= -0.999)
      // Per-share money rounding to zero means the profit and the share count are
      // in different units, not that each share earned nothing.
      || (d.money && Math.abs(val) > 0 && Math.abs(val) < 0.001)
      || (d.money && val === 0);
    if (wild) {
      return { ...d, status: "blocked",
        reason: { headline: "Blocked: inputs are in different scales.",
          detail: "The figures behind this ratio were read in mismatched units, so the result would be off by orders of magnitude. Normalise the source figures before relying on it." } };
    }
    const shown = d.pct ? (val * 100).toFixed(1) + "%"
      : d.money ? "AED " + val.toFixed(3)
      : d.raw ? Math.round(val).toLocaleString("en-US")
      : val.toFixed(2) + (d.unit || "");
    let score = null;
    if (d.bands && d.dir && !d.raw) {
      const [weak, strong] = d.bands;
      if (d.dir === "high") score = val >= strong ? 100 : val >= weak ? 62 : 28;
      else score = val <= strong ? 100 : val <= weak ? 62 : 28;
    }
    return { ...d, status: "ok", value: val, shown, score, note: d.plain(val) };
  });
};

function App() {
  const [state, setState] = useState("idle");
  const [data, setData] = useState(null);
  const [meta, setMeta] = useState(null);
  const [slices, setSlices] = useState([]);
  const [docs, setDocs] = useState([]);
  const [staged, setStaged] = useState([]);
  const [err, setErr] = useState("");
  const [notice, setNotice] = useState("");
  const [owners, setOwners] = useState({});
  const [operator, setOperator] = useState("");
  const [evaluation, setEvaluation] = useState(null);
  const [evalState, setEvalState] = useState("idle");
  const [evalErr, setEvalErr] = useState("");
  const cacheRef = useRef({});
  const builtRef = useRef([]);
  const inputRef = useRef(null);

  const fmt = (n) => (typeof n === "number" && isFinite(n) ? n.toLocaleString("en-US") : String(n ?? ""));

  const sha256 = async (buf) => {
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, "0")).join("");
  };
  const b64 = (bytes) => {
    let s = "";
    for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(s);
  };

  const checkBalance = (b) => {
    if (!b || !b.totalAssets) return null;
    const rhs = (b.totalLiabilities || 0) + (b.totalNetAssets || 0);
    const delta = b.totalAssets - rhs;
    return { rhs, delta, ok: Math.abs(delta) < Math.max(1, b.totalAssets * 0.001) };
  };

  const stampDoc = (p, docName) => {
    if (!p || !docName) return p;
    const tag = (item) => {
      if (!item || typeof item !== "object") return item;
      const ref = item.ref && !String(item.ref).startsWith(docName) ? docName + " \u00b7 " + item.ref : (item.ref || docName);
      return { ...item, doc: docName, ref };
    };
    const out = { ...p, doc: docName };
    for (const k of ["tieOut", "figures", "findings", "escalations", "sections"]) {
      if (Array.isArray(p[k])) out[k] = p[k].map(tag);
    }
    if (p.balance) out.balance = tag(p.balance);
    if (p.lineItems) out.lineItemDoc = Object.fromEntries(Object.keys(p.lineItems).map((k) => [k, docName]));
    return out;
  };

  const merge = (partials) => {
    const out = { entity: {}, classification: {}, balance: null, lineItems: {}, lineItemDoc: {},
      conflicts: [], entities: [], sections: [], tieOut: [], figures: [], findings: [], escalations: [] };
    const seen = new Set();
    const votes = {};
    let balScore = -1;

    for (const p of partials) {
      if (!p) continue;
      if (p.entity) {
        for (const k of ["name", "period", "currency", "scale", "auditOpinion"]) {
          if (!out.entity[k] && p.entity[k]) out.entity[k] = p.entity[k];
        }
        if (p.entity.name || p.entity.period) {
          const id = "e|" + (p.doc || "") + "|" + (p.entity.name || "") + "|" + (p.entity.period || "");
          if (!seen.has(id)) { seen.add(id); out.entities.push({ doc: p.doc || "", name: p.entity.name || "", period: p.entity.period || "" }); }
        }
      }
      if (p.classification?.lens) {
        votes[p.classification.lens] = (votes[p.classification.lens] || 0) + 1;
        if (!out.classification.basis && p.classification.basis) {
          out.classification.basis = p.classification.basis;
          out.classification.why = p.classification.why;
        }
      }
      if (p.balance?.totalAssets) {
        const b = p.balance;
        const hasAll = b.totalLiabilities > 0 && b.totalNetAssets > 0;
        const ties = hasAll && Math.abs(b.totalAssets - (b.totalLiabilities + b.totalNetAssets)) < Math.max(1, b.totalAssets * 0.001);
        const sc = (ties ? 100 : 0) + (hasAll ? 10 : 0) + 1;
        if (sc > balScore) { out.balance = b; balScore = sc; }
      }
      for (const [k, raw] of Object.entries(p.lineItems || {})) {
        const n = typeof raw === "number" ? raw : parseFloat(String(raw).replace(/[,\s]/g, ""));
        if (!isFinite(n)) continue;
        const from = (p.lineItemDoc || {})[k] || p.doc || "";
        if (out.lineItems[k] == null) { out.lineItems[k] = n; if (from) out.lineItemDoc[k] = from; continue; }
        const held = out.lineItems[k];
        const heldFrom = out.lineItemDoc[k] || "";
        const ratio = held && n ? Math.max(Math.abs(held), Math.abs(n)) / Math.min(Math.abs(held), Math.abs(n)) : 1;
        const scaleTwin = [1e3, 1e6, 1e9].some((f) => Math.abs(ratio - f) / f < 0.005);
        const differs = !scaleTwin && Math.abs(held - n) > Math.max(1, Math.abs(held) * 0.005);
        if (differs && from && heldFrom && from !== heldFrom) {
          const id = "c|" + k + "|" + from;
          if (!seen.has(id)) {
            seen.add(id);
            out.conflicts.push({ key: k, label: NEED_LABEL[k] || k, held: { doc: heldFrom, value: held }, other: { doc: from, value: n } });
          }
        }
      }
      for (const s of p.sections || []) {
        if (!s || !s.kind) continue;
        const id = "s|" + s.kind + "|" + (s.pages || "");
        if (seen.has(id)) continue;
        seen.add(id); out.sections.push(s);
      }
      for (const key of ["tieOut", "figures", "findings", "escalations"]) {
        for (const item of p[key] || []) {
          const id = key + "|" + (item.title || item.label || item.check || JSON.stringify(item)).toLowerCase().slice(0, 60);
          if (seen.has(id)) continue;
          seen.add(id); out[key].push(item);
        }
      }
    }

    out.classification.lens = (votes.public_sector || 0) > (votes.corporate || 0) ? "public_sector" : "corporate";

    const opinionFound = !!out.entity.auditOpinion;
    const absence = (t) => /opinion|auditor/i.test(t || "") && /\bno\b|\bnot\b|missing|absent|undisclosed/i.test(t || "");
    if (opinionFound) {
      out.findings = out.findings.filter((f) => !(absence(f.title) || absence(f.detail)));
      out.escalations = out.escalations.filter((e) => !(absence(e.title) || absence(e.why)));
    }
    const noStmt = (t) => /no (financial statements|balance sheet|income statement|financials)/i.test(t || "");
    if (balScore >= 100) {
      out.findings = out.findings.filter((f) => !(noStmt(f.title) || noStmt(f.detail)));
      out.escalations = out.escalations.filter((e) => !(noStmt(e.title) || noStmt(e.why)));
    }
    out.findings.sort((a, b) => (SEV_RANK[a.severity] ?? 3) - (SEV_RANK[b.severity] ?? 3));
    return out;
  };

  // Why a slice did not come back matters more than the fact that it did not.
  // A timeout says the request died before the model finished; it says nothing
  // at all about whether the pages were readable. Treating those two as one
  // state is how a reader failure becomes a false accounting conclusion.
  const classify = (msg) => {
    const m = String(msg || "");
    if (/504|timed? ?out|gateway/i.test(m)) return "TIMEOUT";
    if (/failed to fetch|networkerror|load failed/i.test(m)) return "TIMEOUT";
    if (/rate[ _-]?limit|429/i.test(m)) return "RATE_LIMIT";
    if (/overloaded|529|503/i.test(m)) return "OVERLOADED";
    if (/unreadable|incomplete|output cap/i.test(m)) return "EXTRACTION_FAILED";
    if (/api[ _-]?key|401|403/i.test(m)) return "AUTH";
    return "ERROR";
  };
  const KIND_TEXT = {
    TIMEOUT: "processing was interrupted before it finished, so these pages are not classified as unreadable",
    RATE_LIMIT: "the rate window was exhausted, so these pages were never read",
    OVERLOADED: "the service was overloaded, so these pages were never read",
    EXTRACTION_FAILED: "the pages were reached but nothing usable could be extracted",
    AUTH: "the server rejected the request",
    ERROR: "the request did not complete"
  };

  const readSlice = async (payload) => {
    let lastErr = "Unreachable."; let kind = "ERROR";
    for (let attempt = 0; attempt <= RETRIES; attempt++) {
      try {
        const r = await fetch("/.netlify/functions/chunk", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
        });
        const j = await r.json().catch(() => ({ error: "Netlify returned " + r.status + "." }));
        if (r.ok && j.partial) return j;
        lastErr = j.error || "Netlify returned " + r.status + ".";
      } catch (e) { lastErr = String(e.message || e); }
      kind = classify(lastErr);
      if (attempt === RETRIES) break;
      // A timeout will time out again at the same size. Retrying the identical
      // request is the one thing guaranteed not to work, so the caller splits
      // it instead. Rate limits do reset, so those are worth waiting out.
      if (kind === "TIMEOUT") break;
      const slow = kind === "RATE_LIMIT" || kind === "OVERLOADED";
      await new Promise((r) => setTimeout(r, slow ? 22000 : 1500 * (attempt + 1)));
    }
    return { error: lastErr, kind };
  };

  // A timed-out batch says nothing about its individual pages. Split it and read
  // them one at a time: a single page is a fraction of the work and clears the
  // ceiling that killed the batch. This is a deliberate recovery action, taken
  // only after a timeout, never as the first attempt.
  const splitAndRead = async (s) => {
    const src = await PDFDocument.load(s.rawDoc, { ignoreEncryption: true });
    const out = [];
    for (let p = s.start; p < s.end; p++) {
      const one = await PDFDocument.create();
      const [pg] = await one.copyPages(src, [p]);
      one.addPage(pg);
      const res = await readSlice({ pdf: b64(await one.save()), offset: p + 1, total: s.docPages });
      if (res.partial) out.push(res);
      await new Promise((r) => setTimeout(r, 400));
    }
    return out;
  };

  const dispatch = useCallback(async (built, seedPartials) => {
    const partials = seedPartials || new Array(built.length).fill(null);
    const costs = []; const failures = [];
    let cursor = 0; let modelSeen = null;
    const worker = async () => {
      while (cursor < built.length) {
        const i = cursor++;
        if (partials[i]) continue;
        const s = built[i];
        setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "busy" } : x)));
        let res = await readSlice({ pdf: s.pdf, offset: s.from, total: s.docPages });

        // Recovery: a timed-out batch gets read one page at a time rather than
        // resent whole. Anything recovered is merged as if it had arrived first.
        if (!res.partial && res.kind === "TIMEOUT" && (s.end - s.start) > 1) {
          setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "busy", why: "splitting after timeout" } : x)));
          const pages = await splitAndRead(s);
          if (pages.length) {
            const combined = merge(pages.map((p) => p.partial));
            pages.forEach((p) => { if (p.meta) { costs.push(p.meta); modelSeen = modelSeen || p.meta.model; } });
            res = { partial: combined, recovered: pages.length, ofPages: s.end - s.start };
          }
        }

        if (res.partial) {
          partials[i] = stampDoc(res.partial, s.docName);
          if (res.meta) { costs.push(res.meta); modelSeen = modelSeen || res.meta.model; }
          setSlices((prev) => prev.map((x) => (x.idx === i
            ? { ...x, status: "done", why: res.recovered ? "recovered " + res.recovered + "/" + res.ofPages + " pages after timeout" : undefined }
            : x)));
          setData(merge(partials.filter(Boolean)));
        } else {
          failures.push(res.error);
          setSlices((prev) => prev.map((x) => (x.idx === i
            ? { ...x, status: "miss", why: res.error, kind: res.kind || "ERROR" } : x)));
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, built.length) }, worker));
    return { partials, costs, failures, modelSeen };
  }, []);

  const runEvaluation = async (reading, ratioList, m) => {
    setEvalState("working"); setEvalErr(""); setEvaluation(null);
    try {
      const ok = (ratioList || []).filter((r) => r.status === "ok")
        .map((r) => "- " + r.name + " (" + r.family + "): " + r.shown + " [" + r.note + "]");
      const bad = (ratioList || []).filter((r) => r.status !== "ok")
        .map((r) => "- " + r.name + ": " + (r.reason ? r.reason.headline : "not computed"));
      const figs = (reading.figures || []).map((f) => "- " + f.label + ": " + f.value + " (" + f.ref + ")");
      const finds = (reading.findings || []).map((f) => "- [" + (f.severity || "") + "] " + f.title + ": " + (f.detail || ""));
      const cov = coverageOf(reading).map((c) => "- " + c.label + ": " + c.pct + "% (" + c.proven + ")");
      const covLine = m && m.failed > 0
        ? "COVERAGE WARNING: only " + m.read + " of " + m.slices + " slices were read. Treat every conclusion as provisional and say so."
        : "COVERAGE: complete.";
      const summary = [covLine,
        "ENTITY: " + (reading.entity?.name || "unknown") + " | " + (reading.classification?.basis || "") + " | " + (reading.entity?.period || ""),
        "", "READING COVERAGE:", cov.join("\n"),
        "", "COMPUTED RATIOS:", ok.join("\n") || "(none)",
        "", "RATIOS NOT COMPUTED:", bad.join("\n") || "(all computed)",
        "", "KEY FIGURES:", figs.join("\n") || "(none)",
        "", "FINDINGS:", finds.join("\n") || "(none)"].join("\n");
      const r = await fetch("/.netlify/functions/evaluate", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ summary })
      });
      const j = await r.json();
      if (!r.ok || !j.evaluation) throw new Error(j.error || "The evaluation could not be produced.");
      setEvaluation(j.evaluation); setEvalState("done");
    } catch (e) {
      setEvalErr(e.message || "Evaluation failed."); setEvalState("error");
    }
  };

  const finish = (docList, hash, pageCount, built, partials, costs, modelSeen, began) => {
    const got = partials.filter(Boolean);
    const reading = merge(got);
    const m = {
      hash, name: docList.length === 1 ? docList[0].name : docList.length + " documents",
      docs: docList, size: docList.reduce((a, d) => a + (d.size || 0), 0), pages: pageCount,
      slices: built.length, read: got.length, failed: built.length - got.length, model: modelSeen,
      input_tokens: costs.reduce((a, c) => a + (c.input_tokens || 0), 0),
      output_tokens: costs.reduce((a, c) => a + (c.output_tokens || 0), 0),
      cost_usd: Number(costs.reduce((a, c) => a + (c.cost_usd || 0), 0).toFixed(4)),
      seconds: Math.round((Date.now() - began) / 1000), at: new Date().toISOString()
    };
    setData(reading); setMeta(m); setDocs(docList); setState("done");
    cacheRef.current[hash] = { reading, meta: m, partials, costs, modelSeen, pageCount, built, docs: docList };
    runEvaluation(reading, computeRatios(reading.lineItems), m);
  };

  const run = useCallback(async (fileList) => {
    const chosen = Array.from(fileList || []).filter(Boolean);
    if (!chosen.length) return;
    setState("working"); setErr(""); setNotice(""); setData(null); setMeta(null);
    setSlices([]); setOwners({}); setEvaluation(null); setEvalState("idle");
    const began = Date.now();
    try {
      const loaded = [];
      for (const f of chosen) {
        const buf = await f.arrayBuffer();
        loaded.push({ file: f, buf, hash: await sha256(buf) });
      }
      const hash = loaded.length === 1 ? loaded[0].hash
        : await sha256(new TextEncoder().encode(loaded.map((d) => d.hash).join("|")).buffer);

      const hit = cacheRef.current[hash];
      if (hit) {
        builtRef.current = hit.built;
        setSlices(hit.built.map((b, i) => ({ ...b, status: hit.partials && hit.partials[i] ? "done" : "miss" })));
        setDocs(hit.docs || []); setData(hit.reading); setMeta(hit.meta); setState("done");
        setNotice("This exact set was already read this session. Showing the cached reading.");
        return;
      }

      const plan = []; const docList = [];
      for (let d = 0; d < loaded.length; d++) {
        const { file: f, buf, hash: dhash } = loaded[d];
        const src = await PDFDocument.load(buf, { ignoreEncryption: true });
        const pageCount = src.getPageCount();
        docList.push({ doc: d, name: f.name, size: f.size, pages: pageCount, hash: dhash });
        const STEP = Math.max(1, PAGES_PER_SLICE - (pageCount > PAGES_PER_SLICE ? 1 : 0));
        for (let start = 0; start < pageCount; start += STEP) {
          const end = Math.min(start + PAGES_PER_SLICE, pageCount);
          plan.push({ idx: plan.length, doc: d, docName: f.name, docPages: pageCount, start, end, from: start + 1, to: end, src, raw: buf });
          if (end >= pageCount) break;
        }
      }
      setDocs(docList);
      setSlices(plan.map((p) => ({ ...p, src: undefined, status: "queued" })));

      const built = [];
      for (const p of plan) {
        const out = await PDFDocument.create();
        const pages = await out.copyPages(p.src, Array.from({ length: p.end - p.start }, (_, i) => p.start + i));
        pages.forEach((pg) => out.addPage(pg));
        built.push({ ...p, src: undefined, raw: undefined, rawDoc: p.raw, pdf: b64(await out.save()) });
      }
      builtRef.current = built;

      const totalPages = docList.reduce((a, d) => a + d.pages, 0);
      const { partials, costs, failures, modelSeen } = await dispatch(built);
      if (!partials.filter(Boolean).length) {
        throw new Error("No part of these documents could be read. First failure: " + (failures[0] || "unknown."));
      }
      finish(docList, hash, totalPages, built, partials, costs, modelSeen, began);
    } catch (e) {
      setErr(e.message || "Something went wrong reading these documents.");
      setState("error");
    }
  }, [dispatch]);

  const retryFailed = useCallback(async () => {
    const built = builtRef.current;
    if (!built.length || !meta) return;
    const cached = cacheRef.current[meta.hash];
    const partials = cached ? cached.partials.slice() : new Array(built.length).fill(null);
    setSlices((prev) => prev.map((x) => (x.status === "miss" ? { ...x, status: "queued" } : x)));
    setState("working"); setErr("");
    const began = Date.now() - (meta.seconds * 1000);
    try {
      const { partials: filled, costs, modelSeen } = await dispatch(built, partials);
      finish(meta.docs, meta.hash, meta.pages, built, filled, (cached ? cached.costs : []).concat(costs), modelSeen || meta.model, began);
    } catch (e) {
      setErr(e.message || "Retry failed."); setState("error");
    }
  }, [dispatch, meta]);

  const onPick = (e) => {
    const picked = Array.from(e.target.files || []);
    if (!picked.length) return;
    setStaged((prev) => {
      const seen = new Set(prev.map((f) => f.name + "|" + f.size));
      return [...prev, ...picked.filter((f) => !seen.has(f.name + "|" + f.size))];
    });
    e.target.value = "";
  };
  const removeStaged = (i) => setStaged((prev) => prev.filter((_, ix) => ix !== i));
  const analyzeStaged = () => { if (!staged.length) return; const f = staged; setStaged([]); run(f); };
  const clearAll = () => {
    setData(null); setMeta(null); setSlices([]); setDocs([]); setStaged([]);
    setState("idle"); setNotice(""); setErr(""); setOwners({});
    setEvaluation(null); setEvalState("idle");
  };

  const bal = data ? checkBalance(data.balance) : null;
  const ratios = data ? computeRatios(data.lineItems) : null;
  const ratiosOk = (ratios || []).filter((r) => r.status === "ok");
  const blocked = (ratios || []).filter((r) => r.status === "blocked");
  const coverage = data ? coverageOf(data) : null;
  const doneCount = slices.filter((s) => s.status === "done").length;
  const missCount = slices.filter((s) => s.status === "miss").length;
  const pagesRead = slices.filter((s) => s.status === "done").reduce((a, s) => a + (s.to - s.from + 1), 0);

  const failedRanges = () => slices.filter((s) => s.status === "miss")
    .map((s) => ({ from: s.from, to: s.to, doc: s.docName, kind: s.kind || "ERROR" }));
  const refTouchesUnread = (ref) => {
    if (!ref) return false;
    const ranges = failedRanges();
    if (!ranges.length) return false;
    const mm = String(ref).match(/p(?:age|p)?\.?\s*(\d+)/i);
    if (!mm) return false;
    const pg = parseInt(mm[1], 10);
    return ranges.some((r) => pg >= r.from && pg <= r.to);
  };

  const scoreBand = (s) => s == null ? { label: "No data", tone: "none" }
    : s >= 85 ? { label: "Strong", tone: "good" }
    : s >= 55 ? { label: "Adequate", tone: "warn" } : { label: "Weak", tone: "bad" };

  const scorecard = !ratios ? null : FAMILIES.map((fam) => {
    const inFam = ratios.filter((r) => r.family === fam);
    const scored = inFam.filter((r) => r.status === "ok" && r.score != null);
    const score = scored.length ? Math.round(scored.reduce((a, r) => a + r.score, 0) / scored.length) : null;
    return { family: fam, score, ...scoreBand(score),
      computed: inFam.filter((r) => r.status === "ok").length, total: inFam.length };
  });

  // A score built from a minority of the families is not a health verdict. Say
  // that plainly rather than printing a confident grade over empty families.
  const overall = (() => {
    if (!scorecard) return null;
    const got = scorecard.filter((s) => s.score != null);
    if (!got.length) return null;
    const score = Math.round(got.reduce((a, s) => a + s.score, 0) / got.length);
    const thin = got.length < 4 || (ratiosOk.length / (ratios || []).length) < 0.5;
    const band = scoreBand(score);
    return { score, families: got.length, of: FAMILIES.length, partial: thin,
      label: thin ? "Available metrics only" : band.label, tone: thin ? "warn" : band.tone };
  })();

  const evidence = () => {
    if (!data || !meta) return null;
    const counts = { verified: 0, review: 0, escalate: 0 };
    (data.findings || []).forEach((f) => { if (counts[f.state] !== undefined) counts[f.state]++; });
    return {
      generated_at: meta.at, operator: operator || "UNRECORDED",
      documents: (meta.docs || []).map((d) => ({ file_name: d.name, pages: d.pages, sha256: d.hash })),
      coverage: { slices_total: meta.slices, slices_read: meta.read, slices_failed: meta.failed, complete: meta.failed === 0 },
      unread_pages: failedRanges(),
      system: { tool: "Mizan", version: VERSION, model: meta.model, elapsed_seconds: meta.seconds },
      cost_of_reading: { input_tokens: meta.input_tokens, output_tokens: meta.output_tokens, usd: meta.cost_usd },
      classification: data.classification,
      deterministic_checks: [bal && { check: "assets = liabilities + net assets", computed_by: "client arithmetic",
        result: bal.ok ? "pass" : "fail", difference: bal.delta }].filter(Boolean),
      ratios: (ratios || []).map((r) => ({ name: r.name, family: r.family, status: r.status,
        value: r.status === "ok" ? r.shown : null,
        not_computed_because: r.status === "ok" ? null : (r.reason ? r.reason.headline : null) })),
      scorecard, overall, determinations: counts,
      escalations: (data.escalations || []).map((e, i) => ({ item: e.title, decision_needed: e.decisionNeeded,
        source: e.ref, state: refTouchesUnread(e.ref) ? "NOT_READ" : "NOT_PRESENT",
        accountable_owner: owners[i] || "UNASSIGNED", decision: "PENDING" })),
      failure_states: slices.filter((s) => s.status === "miss")
        .map((s) => ({ pages: s.from + "-" + s.to, doc: s.docName, state: s.kind || "ERROR",
          means: KIND_TEXT[s.kind] || KIND_TEXT.ERROR })),
      note: "Figures are read from the source document. This record is not an opinion on the accounts. " +
            "A batch that timed out is recorded as interrupted, never as an unreadable or undisclosed page."
    };
  };

  const downloadEvidence = () => {
    const rec = evidence(); if (!rec) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 2)], { type: "application/json" }));
    a.download = "mizan-evidence-" + (meta?.hash || "").slice(0, 12) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };

  const working = state === "working";

  return (
    <div className="mz">
      <style>{CSS}</style>
      <div className="mz-wrap">

        <header className="mz-head">
          <div>
            <div className="mz-mark">Mizan<span>&#1605;&#1610;&#1586;&#1575;&#1606;</span></div>
            <div className="mz-sub">Financial statement analysis that shows its work</div>
          </div>
          <p className="mz-thesis">Autonomous when it is certain. Accountable when it is not.</p>
        </header>

        <div className="mz-intake">
          <input ref={inputRef} type="file" accept="application/pdf" multiple onChange={onPick} style={{ display: "none" }} />
          <button className="mz-btn" disabled={working} onClick={() => inputRef.current?.click()}>
            {working ? "Reading" : staged.length ? "Add more files" : "Choose statements PDFs"}
          </button>
          {staged.length > 0 && !working && (
            <button className="mz-btn go" onClick={analyzeStaged}>
              Analyze {staged.length} {staged.length === 1 ? "document" : "documents"}
            </button>
          )}
          <input className="mz-in" placeholder="Your name, for the record"
            value={operator} onChange={(e) => setOperator(e.target.value)} />
          {state === "done" && (
            <>
              <button className="mz-btn ghost" onClick={() => window.print()}>Print</button>
              <button className="mz-btn ghost" onClick={downloadEvidence}>Evidence JSON</button>
              <button className="mz-btn ghost" onClick={clearAll}>New reading</button>
            </>
          )}
        </div>

        {staged.length > 0 && !working && (
          <div className="mz-tray">
            <div className="mz-tray-h">Ready to analyze &middot; nothing runs until you say so</div>
            {staged.map((f, i) => (
              <div key={i} className="mz-tray-row">
                <span className="mz-tray-name">{f.name}</span>
                <span className="mz-tray-name" style={{ flex: "none", color: "var(--soft)", fontSize: ".62rem" }}>
                  {(f.size / 1024).toFixed(0)} KB
                </span>
                <button className="mz-tray-x" onClick={() => removeStaged(i)}>remove</button>
              </div>
            ))}
          </div>
        )}

        {state === "idle" && staged.length === 0 && (
          <div className="mz-empty">
            <p className="mz-empty-t">Nothing read yet.</p>
            <p className="mz-empty-s">
              Load one set of financial statements, or several at once. Long documents are cut
              into overlapping slices and read in parallel, and every figure keeps the page it
              came from.
            </p>
          </div>
        )}

        {slices.length > 0 && (
          <div className="mz-panel">
            <div className="mz-strip">
              <span>{working ? "Reading in parallel" : "Coverage"}</span>
              <span>{PAGES_PER_SLICE} pages per slice &middot; {CONCURRENCY} at once</span>
            </div>
            <div className="mz-dials">
              <div className="mz-dial">
                <div className="mz-dial-l">Slices read</div>
                <div className="mz-dial-v">{doneCount}/{slices.length}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Pages covered</div>
                <div className="mz-dial-v">{pagesRead}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Findings</div>
                <div className="mz-dial-v">{data?.findings?.length || 0}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Unread</div>
                <div className="mz-dial-v" style={{ color: missCount ? "var(--esc)" : "var(--ink)" }}>{missCount}</div>
              </div>
            </div>
            <div className="mz-grid">
              {slices.map((s, i) => (
                <div key={s.idx ?? i} className={"mz-cell " + s.status}
                  title={(s.docName ? s.docName + " \u00b7 " : "") + "pages " + s.from + " to " + s.to + (s.why ? " \u00b7 " + s.why : "")}>
                  {s.from}
                </div>
              ))}
            </div>
          </div>
        )}

        {notice && <div className="mz-note">{notice}</div>}

        {state === "done" && meta && meta.failed > 0 && (
          <div className="mz-retry">
            <span>
              <b>INCOMPLETE SOURCE READ.</b> {meta.read} of {meta.slices} batches completed.
              {" " + meta.failed + " require recovery: "}
              {failedRanges().map((r) => (r.doc ? r.doc.replace(/\.pdf$/i, "") + " " : "") + "p." + r.from + "-" + r.to).join(", ")}
              {". "}
              {(() => {
                const kinds = [...new Set(slices.filter((s) => s.status === "miss").map((s) => s.kind || "ERROR"))];
                const interrupted = kinds.some((k) => k === "TIMEOUT" || k === "RATE_LIMIT" || k === "OVERLOADED");
                return kinds.map((k) => KIND_TEXT[k] || KIND_TEXT.ERROR).join("; ") +
                  (interrupted
                    ? ". These pages are NOT classified as unreadable, and nothing here should be read as a missing disclosure."
                    : ".");
              })()}
            </span>
            <button className="mz-btn ghost" onClick={retryFailed}>Retry failed slices</button>
          </div>
        )}

        {state === "error" && (
          <div className="mz-err">
            <p className="mz-err-t">Reading stopped</p>
            <p className="mz-detail" style={{ marginTop: ".4rem" }}>{err}</p>
          </div>
        )}

        {data && state === "done" && (
          <>
            <section className="mz-sec">
              <div className="mz-sec-head">
                <h2 className="mz-sec-title">Lens applied</h2>
                <span className="mz-sec-note">settled</span>
              </div>
              <div className="mz-class">
                <div>
                  <div className="mz-class-meta">Classified as</div>
                  <div className="mz-class-lens">
                    {data.classification?.lens === "public_sector" ? "Public sector entity" : "Corporate entity"}
                  </div>
                  <div className="mz-class-meta" style={{ marginTop: ".4rem", marginBottom: 0 }}>
                    {[data.classification?.basis, data.entity?.name, data.entity?.period].filter(Boolean).join(" \u00b7 ")}
                  </div>
                </div>
                <p className="mz-class-why">{data.classification?.why}</p>
              </div>
            </section>

            {overall && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">{overall.partial ? "Available-metric score" : "Overall financial health"}</h2>
                  <span className="mz-sec-note">{overall.families} of {overall.of} families scored</span>
                </div>
                <div className="mz-score">
                  <div className="mz-score-top">
                    <div>
                      <div className={"mz-score-big " + overall.tone}>{overall.score}</div>
                      <div className="mz-score-lab">out of 100</div>
                    </div>
                    <div>
                      <div className="mz-score-verdict">{overall.label}</div>
                      <div className="mz-score-lab">
                        {overall.partial
                          ? "Overall financial health: not available. " + overall.families +
                            " of " + overall.of + " families have enough data, so this score covers only what was computed."
                          : "averaged across the families with enough data"}
                      </div>
                    </div>
                  </div>
                  {scorecard.map((s, i) => (
                    <div key={i} className="mz-score-row">
                      <div>
                        <div className="mz-score-name">{s.family}</div>
                        <div className="mz-score-sub">{s.computed}/{s.total} computed</div>
                      </div>
                      <div className="mz-score-track">
                        {s.score != null && <div className={"mz-score-fill " + s.tone} style={{ width: s.score + "%" }} />}
                      </div>
                      <div className={"mz-score-tag " + s.tone}>{s.label}</div>
                    </div>
                  ))}
                </div>
                <div className="mz-legend">
                  <span>Scored only from ratios that computed cleanly.</span>
                  <span>A family with no computable ratio is reported as no data, never as neutral.</span>
                </div>
              </section>
            )}

            {coverage && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Reading coverage</h2>
                  <span className="mz-sec-note">{meta.read}/{meta.slices} slices processed</span>
                </div>
                <div className="mz-cov">
                  {coverage.map((c, i) => {
                    const cls = c.pct === 0 ? "zero" : c.pct >= 100 ? "" : "part";
                    return (
                      <div key={i} className="mz-cov-row">
                        <div>
                          <div className="mz-cov-n">{c.label}</div>
                          <div className="mz-cov-sub">{c.pages ? "pp. " + c.pages : c.proven}</div>
                        </div>
                        <div className="mz-cov-track">
                          <div className={"mz-cov-fill " + cls} style={{ width: c.pct + "%" }} />
                        </div>
                        <div className="mz-cov-p">{c.pct}%</div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {bal && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Does it balance</h2>
                  <span className="mz-sec-note">arithmetic, not a model</span>
                </div>
                <div className="mz-arith">
                  <div className="mz-strip">
                    <span>Computed in this browser</span>
                    <span>{data.entity?.currency} {data.entity?.scale}</span>
                  </div>
                  <div className="mz-eq">
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total assets</span><span className="mz-eq-val">{fmt(data.balance.totalAssets)}</span></div>
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total liabilities</span><span className="mz-eq-val">{fmt(data.balance.totalLiabilities)}</span></div>
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total equity</span><span className="mz-eq-val">{fmt(data.balance.totalNetAssets)}</span></div>
                    <div className="mz-eq-rule" />
                    <div className="mz-eq-line">
                      <span className="mz-eq-lbl">Difference</span>
                      <span className="mz-eq-val" style={{ color: bal.ok ? "var(--tick)" : "var(--esc)" }}>{fmt(bal.delta)}</span>
                    </div>
                  </div>
                  <div className={"mz-verdict " + (bal.ok ? "pass" : "fail")}>
                    {bal.ok ? MARK.verified + "  Assets equal liabilities plus equity. Nothing here rests on judgement."
                      : MARK.escalate + "  Off by " + fmt(Math.abs(bal.delta)) + ". Reported as-is. No figure here should be relied on until a person finds the cause."}
                  </div>
                </div>
              </section>
            )}

            {data.tieOut?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Tie-out</h2>
                  <span className="mz-sec-note">{data.tieOut.length} checks</span>
                </div>
                {data.tieOut.map((t, i) => {
                  const st = t.result === "pass" ? "verified" : t.result === "fail" ? "escalate" : "review";
                  return (
                    <div key={i} className="mz-row">
                      <div className={"mz-tick " + st}>{MARK[st]}</div>
                      <div className="mz-body"><p className="mz-title">{t.check}</p><p className="mz-detail">{t.detail}</p></div>
                      <div className="mz-ref">{t.ref}</div>
                    </div>
                  );
                })}
              </section>
            )}

            {data.figures?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Figures</h2>
                  <span className="mz-sec-note">every one carries its page</span>
                </div>
                <div className="mz-figs">
                  {data.figures.map((f, i) => {
                    const cf = typeof f.confidence === "number" ? f.confidence : null;
                    const band = cf == null ? "" : cf >= 95 ? "hi" : cf >= 80 ? "mid" : "lo";
                    return (
                      <div key={i} className={"mz-fig " + (f.state || "review")}>
                        <div className="mz-fig-lbl" title={f.label}>{f.label}</div>
                        <div className="mz-fig-val">{f.value}</div>
                        {cf != null && (
                          <span className={"mz-conf " + band}><span className="mz-conf-dot" />{cf}% confidence</span>
                        )}
                        <div className="mz-fig-ref">{f.ref}</div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {ratios && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Financial ratios</h2>
                  <span className="mz-sec-note">
                    {ratiosOk.length} of {ratios.length} computed
                    {blocked.length ? " \u00b7 " + blocked.length + " blocked" : ""}
                  </span>
                </div>
                {FAMILIES.map((fam) => {
                  const group = ratios.filter((r) => r.family === fam);
                  if (!group.length) return null;
                  const done = group.filter((r) => r.status === "ok").length;
                  return (
                    <div key={fam} className="mz-rfam">
                      <div className="mz-rfam-h">{fam} &middot; {done}/{group.length}</div>
                      {group.map((r) => (
                        <div key={r.name} className={"mz-ratio " + r.status}>
                          <div className="mz-ratio-main">
                            <div className="mz-ratio-name">{r.name}</div>
                            <div className="mz-ratio-formula">{r.formula}</div>
                            {r.status === "ok" && (
                              <>
                                <div className="mz-ratio-note">{r.note}</div>
                                {r.typical && <div className="mz-ratio-typ">Typical range &middot; {r.typical}</div>}
                              </>
                            )}
                            {r.status === "missing" && (
                              <div className="mz-ratio-miss">
                                <b>Could not compute.</b> {r.reason.headline} {r.reason.detail} Held for a person, not estimated.
                              </div>
                            )}
                            {r.status === "blocked" && (
                              <div className="mz-ratio-blocked">
                                <b>{r.reason.headline}</b> {r.reason.detail}
                              </div>
                            )}
                          </div>
                          <div className="mz-ratio-val">{r.status === "ok" ? r.shown : "\u2014"}</div>
                        </div>
                      ))}
                    </div>
                  );
                })}
                <div className="mz-legend">
                  <span>Every computed ratio uses figures read from the statements.</span>
                  <span>A ratio is never estimated, and never printed when its inputs disagree on scale.</span>
                </div>
              </section>
            )}

            {evalState !== "idle" && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Performance evaluation</h2>
                  <span className="mz-sec-note">
                    {evalState === "working" ? "writing" : evalState === "error" ? "unavailable"
                      : (meta && meta.failed > 0 ? "PARTIAL COVERAGE \u00b7 not final" : "AI analysis \u00b7 not arithmetic")}
                  </span>
                </div>
                {evalState === "working" && (
                  <div className="mz-note">Interpreting the ratios and figures.</div>
                )}
                {evalState === "error" && (
                  <div className="mz-note">The written evaluation could not be produced: {evalErr} The ratios and findings are unaffected.</div>
                )}
                {evalState === "done" && evaluation && (
                  <div className="mz-eval">
                    <div className="mz-eval-banner">
                      Written analysis by the model, interpreting the figures above. It is judgment, not audited fact.
                    </div>
                    {evaluation.headline && <p className="mz-eval-head">{evaluation.headline}</p>}
                    {evaluation.overall && <p className="mz-eval-over">{evaluation.overall}</p>}
                    {(evaluation.assessment || []).length > 0 && (
                      <div className="mz-eval-grid">
                        {evaluation.assessment.map((a, i) => (
                          <div key={i} className={"mz-eval-area read-" + (a.read || "mixed")}>
                            <div className="mz-eval-area-h">
                              <span>{a.area}</span>
                              <span className={"mz-eval-tag read-" + (a.read || "mixed")}>{a.read}</span>
                            </div>
                            <p className="mz-eval-area-t">{a.text}</p>
                          </div>
                        ))}
                      </div>
                    )}
                    {((evaluation.strengths || []).length > 0 || (evaluation.concerns || []).length > 0) && (
                      <div className="mz-eval-sc">
                        <div className="mz-eval-col">
                          <div className="mz-eval-col-h pos">Strengths</div>
                          <ul>{(evaluation.strengths || []).map((s, i) => <li key={i}>{s}</li>)}</ul>
                        </div>
                        <div className="mz-eval-col">
                          <div className="mz-eval-col-h neg">Concerns</div>
                          <ul>{(evaluation.concerns || []).map((s, i) => <li key={i}>{s}</li>)}</ul>
                        </div>
                      </div>
                    )}
                    {(evaluation.considerations || []).length > 0 && (
                      <div className="mz-eval-rec">
                        <div className="mz-eval-rec-h">Considerations for management</div>
                        <div className="mz-eval-rec-note">Options to weigh, grounded in the figures. Not directives.</div>
                        {evaluation.considerations.map((c, i) => (
                          <div key={i} className="mz-eval-rec-item">
                            <div className="mz-eval-rec-for">{c.for}</div>
                            <p>{c.text}</p>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </section>
            )}

            {data.findings?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Findings</h2>
                  <span className="mz-sec-note">read the tick column first</span>
                </div>
                {data.findings.map((f, i) => (
                  <div key={i} className="mz-row">
                    <div className={"mz-tick " + (f.state || "review")}>{MARK[f.state] || "?"}</div>
                    <div className="mz-body">
                      <p className="mz-title">{f.title}{f.severity && <span className={"mz-sev " + f.severity}>{f.severity}</span>}</p>
                      <p className="mz-detail">{f.detail}</p>
                      {f.metric && <p className="mz-metric">{f.metric}</p>}
                    </div>
                    <div className="mz-ref">{f.ref}</div>
                  </div>
                ))}
                <div className="mz-legend">
                  <span>{MARK.verified} read from the document</span>
                  <span>{MARK.review} derived, confirm it</span>
                  <span>{MARK.escalate} a person decides</span>
                </div>
              </section>
            )}

            {data.escalations?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Held for a person</h2>
                  <span className="mz-sec-note">not answered, on purpose</span>
                </div>
                {data.escalations.map((e, i) => {
                  const unread = refTouchesUnread(e.ref);
                  return (
                    <div key={i} className={"mz-esc-card" + (unread ? " unread" : "")}>
                      <div className="mz-esc-head">
                        <p className="mz-esc-t">{e.title}</p>
                        <span className={"mz-esc-state " + (unread ? "notread" : "notpresent")}>
                          {unread ? "NOT READ" : "NOT PRESENT"}
                        </span>
                      </div>
                      <p className="mz-esc-w">
                        {unread
                          ? "This points at a page that failed to read, not a figure the company omitted. Recover the page before treating it as an accounting gap."
                          : e.why}
                      </p>
                      <div className="mz-esc-d">
                        <b>Decision needed</b>
                        {e.decisionNeeded}
                        <div className="mz-owner">
                          <label htmlFor={"own" + i}>Accountable owner</label>
                          <input id={"own" + i} className="mz-in" placeholder="Name the person"
                            value={owners[i] || ""} onChange={(ev) => setOwners({ ...owners, [i]: ev.target.value })} />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </section>
            )}

            {meta && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Evidence record</h2>
                  <span className="mz-sec-note">emitted for every reading</span>
                </div>
                <div className="mz-ev">
                  <div><b>Document</b> {meta.name} &middot; {meta.pages} pages</div>
                  {(meta.docs || []).length > 1 && meta.docs.map((d, i) => (
                    <div key={i} style={{ paddingLeft: "1.2rem" }}>{i + 1} {d.name} &middot; {d.pages} pages</div>
                  ))}
                  <div><b>SHA-256</b> {meta.hash}</div>
                  <div><b>Read at</b> {meta.at} &middot; took {meta.seconds}s</div>
                  <div><b>System</b> Mizan {VERSION} &middot; {meta.model}</div>
                  <div>
                    <b>Coverage</b> {meta.read}/{meta.slices} slices
                    {meta.failed > 0 && <span style={{ color: "var(--esc)" }}> &middot; {meta.failed} unread, not complete</span>}
                  </div>
                  <div><b>Cost of this reading</b> ${meta.cost_usd?.toFixed(4)} &middot;{" "}
                    {(meta.input_tokens || 0).toLocaleString()} in / {(meta.output_tokens || 0).toLocaleString()} out</div>
                  <div><b>Operator</b> {operator || "UNRECORDED"}</div>
                </div>
              </section>
            )}

            <footer className="mz-foot">
              <div>
                <b>Mizan</b> {VERSION} &middot; reading of {meta?.name || "document"}<br />
                Figures are read from the document. Nothing here is an opinion on the accounts.
              </div>
              <div style={{ textAlign: "right" }}>
                <b>Jonathan Z</b><br />
                Nexus AI Assurance FZCO &middot; Dubai<br />
                nexusai.ae
              </div>
            </footer>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
