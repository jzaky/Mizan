`;

const MARK = { verified: "\u2713", review: "?", escalate: "\u2717" };
const SEV_RANK = { high: 0, medium: 1, low: 2 };

function App() {
  const [state, setState] = useState("idle");
  const [data, setData] = useState(null);
  const [meta, setMeta] = useState(null);
  const [slices, setSlices] = useState([]);
  const [err, setErr] = useState("");
  const [file, setFile] = useState(null);
  const [owners, setOwners] = useState({});
  const [operator, setOperator] = useState("");
  const [notice, setNotice] = useState("");
  const [query, setQuery] = useState("");
  const [filterState, setFilterState] = useState("all");   // all|verified|review|escalate
  const [collapsed, setCollapsed] = useState({});
  const [edits, setEdits] = useState({});                  // figure label -> corrected value
  const [manual, setManual] = useState([]);                // operator-added findings
  const [restored, setRestored] = useState(false);
  const cacheRef = useRef({});
  const builtRef = useRef([]);
  const inputRef = useRef(null);

  const PERSIST_KEY = "mizan.session.v1";

  // Restore the last reading so a refresh never destroys review work.
  React.useEffect(() => {
    try {
      const raw = localStorage.getItem(PERSIST_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.data) {
        setData(s.data); setMeta(s.meta || null); setOwners(s.owners || {});
        setOperator(s.operator || ""); setEdits(s.edits || {}); setManual(s.manual || []);
        setSlices(s.slices || []);
        setState("done"); setRestored(true);
        setNotice("Restored your last reading from this browser. Upload a new document to start fresh.");
      }
    } catch {}
  }, []);

  React.useEffect(() => {
    if (state !== "done" || !data) return;
    try {
      localStorage.setItem(PERSIST_KEY, JSON.stringify({
        data, meta, owners, operator, edits, manual,
        slices: (slices || []).map((s) => ({ ...s, pdf: undefined }))  // never persist the raw PDF bytes
      }));
    } catch {}
  }, [state, data, meta, owners, operator, edits, manual]);

  const clearSession = () => {
    try { localStorage.removeItem(PERSIST_KEY); } catch {}
    setData(null); setMeta(null); setOwners({}); setEdits({}); setManual([]);
    setSlices([]); setState("idle"); setRestored(false); setNotice("");
  };

  const fmt = (n) => (typeof n === "number" && isFinite(n) ? n.toLocaleString("en-US") : String(n ?? ""));

  const sha256 = async (buf) => {
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, "0")).join("");
  };

  const b64 = (bytes) => {
    let s = "";
    for (let i = 0; i < bytes.length; i += 8192) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    return btoa(s);
  };

  // Arithmetic. Runs here, in the browser. Never a model output.
  const checkBalance = (b) => {
    if (!b || !b.totalAssets) return null;
    const rhs = (b.totalLiabilities || 0) + (b.totalNetAssets || 0);
    const delta = b.totalAssets - rhs;
    return { rhs, delta, ok: Math.abs(delta) < 0.5 };
  };

  // Deterministic merge. No second model call, so nothing can drift here.
  const merge = (partials) => {
    const out = {
      entity: {}, classification: {}, balance: null,
      tieOut: [], figures: [], variance: [], findings: [], escalations: []
    };
    const seen = new Set();
    const votes = {};

    for (const p of partials) {
      if (!p) continue;

      if (p.entity) {
        for (const k of ["name", "period", "currency", "scale", "auditOpinion"]) {
          if (!out.entity[k] && p.entity[k]) out.entity[k] = p.entity[k];
        }
      }
      if (p.classification?.lens) {
        votes[p.classification.lens] = (votes[p.classification.lens] || 0) + 1;
        if (!out.classification.basis && p.classification.basis) {
          out.classification.basis = p.classification.basis;
          out.classification.why = p.classification.why;
        }
      }
      if (!out.balance && p.balance?.totalAssets) out.balance = p.balance;

      for (const key of ["tieOut", "figures", "variance", "findings", "escalations"]) {
        for (const item of p[key] || []) {
          const id = key + "|" + (item.title || item.label || item.check || JSON.stringify(item)).toLowerCase().slice(0, 60);
          if (seen.has(id)) continue;
          seen.add(id);
          out[key].push(item);
        }
      }
    }

    out.classification.lens =
      (votes.public_sector || 0) >= (votes.corporate || 0) && votes.public_sector
        ? "public_sector"
        : votes.corporate ? "corporate" : "corporate";

    out.findings.sort((a, b) => (SEV_RANK[a.severity] ?? 3) - (SEV_RANK[b.severity] ?? 3));
    return out;
  };

  const readSlice = async (payload) => {
    for (let attempt = 0; attempt <= RETRIES; attempt++) {
      try {
        const r = await fetch("/.netlify/functions/chunk", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const j = await r.json().catch(() => ({ error: "Netlify returned " + r.status + "." }));
        if (r.ok && j.partial) return j;
        if (attempt === RETRIES) return { error: j.error || "Netlify returned " + r.status + "." };
      } catch (e) {
        if (attempt === RETRIES) return { error: String(e.message || e) };
      }
      await new Promise((r) => setTimeout(r, 900 * (attempt + 1)));
    }
    return { error: "Unreachable." };
  };

  const dispatch = useCallback(async (built, pageCount, began, seedPartials) => {
    const partials = seedPartials || new Array(built.length).fill(null);
    const costs = [];
    const failures = [];
    let cursor = 0;
    let modelSeen = null;

    const worker = async () => {
      while (cursor < built.length) {
        const i = cursor++;
        if (partials[i]) continue;              // already have this slice, skip
        const s = built[i];
        setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "busy" } : x)));

        const res = await readSlice({ pdf: s.pdf, offset: s.from, total: pageCount });

        if (res.partial) {
          partials[i] = res.partial;
          if (res.meta) { costs.push(res.meta); modelSeen = modelSeen || res.meta.model; }
          setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "done" } : x)));
          setData(merge(partials.filter(Boolean)));
        } else {
          failures.push(res.error);
          setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "miss", why: res.error } : x)));
        }
      }
    };

    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, built.length) }, worker));
    return { partials, costs, failures, modelSeen };
  }, []);

  const finish = (f, hash, pageCount, built, partials, costs, modelSeen, began) => {
    const got = partials.filter(Boolean);
    const reading = merge(got);
    const m = {
      hash, name: f.name, size: f.size, pages: pageCount,
      slices: built.length, read: got.length, failed: built.length - got.length,
      model: modelSeen,
      input_tokens: costs.reduce((a, c) => a + (c.input_tokens || 0), 0),
      output_tokens: costs.reduce((a, c) => a + (c.output_tokens || 0), 0),
      cost_usd: Number(costs.reduce((a, c) => a + (c.cost_usd || 0), 0).toFixed(4)),
      seconds: Math.round((Date.now() - began) / 1000),
      at: new Date().toISOString()
    };
    setData(reading);
    setMeta(m);
    setState("done");
    cacheRef.current[hash] = { reading, meta: m, partials, costs, modelSeen, pageCount, built, file: { name: f.name, size: f.size } };
  };

  const run = useCallback(async (f) => {
    setState("working"); setErr(""); setNotice(""); setData(null); setMeta(null); setSlices([]);
    setOwners({});
    const began = Date.now();

    try {
      const buf = await f.arrayBuffer();
      const hash = await sha256(buf);

      // Duplicate detection: same bytes, same reading. Serve it back instantly.
      const hit = cacheRef.current[hash];
      if (hit) {
        builtRef.current = hit.built;
        setSlices(hit.built.map((b) => ({ ...b, status: "done" })));
        setData(hit.reading);
        setMeta(hit.meta);
        setState("done");
        setNotice("This exact document was already read this session. Showing the cached reading. Re-upload a changed file to force a fresh read.");
        return;
      }

      const src = await PDFDocument.load(buf, { ignoreEncryption: true });
      const pageCount = src.getPageCount();

      const plan = [];
      for (let start = 0; start < pageCount; start += PAGES_PER_SLICE) {
        const end = Math.min(start + PAGES_PER_SLICE, pageCount);
        plan.push({ idx: plan.length, start, end, from: start + 1, to: end });
      }
      setSlices(plan.map((p) => ({ ...p, status: "queued" })));

      const built = [];
      for (const p of plan) {
        const doc = await PDFDocument.create();
        const pages = await doc.copyPages(src, Array.from({ length: p.end - p.start }, (_, i) => p.start + i));
        pages.forEach((pg) => doc.addPage(pg));
        built.push({ ...p, pdf: b64(await doc.save()) });
      }
      builtRef.current = built;

      const { partials, costs, failures, modelSeen } = await dispatch(built, pageCount, began);

      if (!partials.filter(Boolean).length) {
        throw new Error("No part of this document could be read. First failure: " + (failures[0] || "unknown."));
      }
      finish(f, hash, pageCount, built, partials, costs, modelSeen, began);
    } catch (e) {
      setErr(e.message || "Something went wrong reading this document.");
      setState("error");
    }
  }, [dispatch]);

  const retryFailed = useCallback(async () => {
    const built = builtRef.current;
    if (!built.length || !meta) return;
    const cached = cacheRef.current[meta.hash];
    const partials = cached ? cached.partials.slice() : new Array(built.length).fill(null);
    // wipe only the misses so the runner re-fires exactly those
    setSlices((prev) => prev.map((x) => (x.status === "miss" ? { ...x, status: "queued" } : x)));
    setState("working"); setErr(""); setNotice("");
    const began = Date.now() - (meta.seconds * 1000);

    try {
      const { partials: filled, costs, modelSeen } = await dispatch(built, meta.pages, began, partials);
      const priorCosts = cached ? cached.costs : [];
      finish({ name: meta.name, size: meta.size }, meta.hash, meta.pages, built, filled, priorCosts.concat(costs), modelSeen || meta.model, began);
    } catch (e) {
      setErr(e.message || "Retry failed.");
      setState("error");
    }
  }, [dispatch, meta]);

  const onPick = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setFile(f); run(f); e.target.value = "";
  };

  const bal = data ? checkBalance(data.balance) : null;
  const doneCount = slices.filter((s) => s.status === "done").length;
  const missCount = slices.filter((s) => s.status === "miss").length;
  const pagesRead = slices.filter((s) => s.status === "done").reduce((a, s) => a + (s.to - s.from + 1), 0);

  const evidence = () => {
    if (!data || !meta) return null;
    const counts = { verified: 0, review: 0, escalate: 0 };
    (data.findings || []).forEach((f) => { if (counts[f.state] !== undefined) counts[f.state]++; });
    return {
      record_id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      generated_at: meta.at,
      operator: operator || "UNRECORDED",
      document: { file_name: meta.name, bytes: meta.size, pages: meta.pages, sha256: meta.hash },
      coverage: {
        slices_total: meta.slices,
        slices_read: meta.read,
        slices_failed: meta.failed,
        pages_per_slice: PAGES_PER_SLICE,
        complete: meta.failed === 0
      },
      system: { tool: "Mizan", version: VERSION, model: meta.model, elapsed_seconds: meta.seconds },
      cost_of_reading: { input_tokens: meta.input_tokens, output_tokens: meta.output_tokens, usd: meta.cost_usd },
      classification: {
        lens: data.classification?.lens,
        basis: data.classification?.basis,
        rationale: data.classification?.why
      },
      deterministic_checks: [
        bal && {
          check: "assets = liabilities + net assets",
          computed_by: "client arithmetic",
          result: bal.ok ? "pass" : "fail",
          difference: bal.delta
        }
      ].filter(Boolean),
      determinations: counts,
      escalations: (data.escalations || []).map((e, i) => ({
        item: e.title,
        decision_needed: e.decisionNeeded,
        source: e.ref,
        accountable_owner: owners[i] || "UNASSIGNED",
        decision: "PENDING"
      })),
      note: "Figures are read from the source document. This record is not an opinion on the accounts."
    };
  };

  const downloadExcel = () => {
    if (!data || typeof XLSX === "undefined") return;
    const wb = XLSX.utils.book_new();

    const figRows = (data.figures || []).map((f) => ({
      Label: f.label,
      Value: edits[f.label] != null ? edits[f.label] : f.value,
      Corrected: edits[f.label] != null ? "yes" : "",
      State: f.state, Source: f.ref
    }));
    if (figRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(figRows), "Figures");

    const allFindings = (data.findings || []).concat(manual).map((f) => ({
      State: f.state, Severity: f.severity || "", Finding: f.title,
      Detail: f.detail || "", Metric: f.metric || "", Source: f.ref || "",
      Origin: f.manual ? "operator" : "model"
    }));
    if (allFindings.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allFindings), "Findings");

    if ((data.escalations || []).length) {
      const esc = data.escalations.map((e, i) => ({
        Item: e.title, Why: e.why, "Decision needed": e.decisionNeeded,
        "Accountable owner": owners[i] || "UNASSIGNED", Source: e.ref, Decision: "PENDING"
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(esc), "Escalations");
    }

    if (bal) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{
        "Total assets": data.balance.totalAssets,
        "Total liabilities": data.balance.totalLiabilities,
        "Net assets / equity": data.balance.totalNetAssets,
        Difference: bal.delta, Result: bal.ok ? "balances" : "does not balance"
      }]), "Balance");
    }

    const info = [
      { Field: "Document", Value: meta?.name }, { Field: "Pages", Value: meta?.pages },
      { Field: "SHA-256", Value: meta?.hash }, { Field: "Read at", Value: meta?.at },
      { Field: "System", Value: "Mizan " + VERSION + " · " + (meta?.model || "") },
      { Field: "Operator", Value: operator || "UNRECORDED" },
      { Field: "Coverage", Value: (meta?.read || 0) + "/" + (meta?.slices || 0) + " slices" + (meta?.failed ? " (INCOMPLETE)" : "") },
      { Field: "Cost USD", Value: meta?.cost_usd }
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(info), "Record");

    XLSX.writeFile(wb, "mizan-" + (meta?.hash || "reading").slice(0, 12) + ".xlsx");
  };

  const downloadEvidence = () => {
    const rec = evidence(); if (!rec) return;
    const blob = new Blob([JSON.stringify(rec, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mizan-evidence-" + (meta?.hash || "").slice(0, 12) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };

  React.useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "u") { e.preventDefault(); inputRef.current?.click(); }
      if (mod && e.key.toLowerCase() === "p") { e.preventDefault(); window.print(); }
      if (mod && e.key.toLowerCase() === "e" && data) { e.preventDefault(); downloadExcel(); }
      if (mod && e.key.toLowerCase() === "s" && data) { e.preventDefault(); downloadEvidence(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [data, meta, edits, manual, owners, operator]);

  // Findings shown = model findings + operator findings, filtered and searched.
  const shownFindings = [...(data?.findings || []), ...manual].filter((f) => {
    if (filterState !== "all" && f.state !== filterState) return false;
    if (!query.trim()) return true;
    const hay = (f.title + " " + (f.detail || "") + " " + (f.ref || "") + " " + (f.metric || "")).toLowerCase();
    return hay.includes(query.toLowerCase());
  });

  const addManualFinding = () => {
    setManual((prev) => [...prev, {
      manual: true, state: "review", severity: "medium",
      title: "New finding", detail: "", metric: "", ref: "operator entry"
    }]);
  };
  const updateManual = (i, field, val) => {
    setManual((prev) => prev.map((f, ix) => (ix === i ? { ...f, [field]: val } : f)));
  };
  const removeManual = (i) => setManual((prev) => prev.filter((_, ix) => ix !== i));

  const toggle = (id) => setCollapsed((p) => ({ ...p, [id]: !p[id] }));

  const working = state === "working";

  return (
    <div className="mz">
      <style>{CSS}</style>
      <div className="mz-wrap">

        <header className="mz-head">
          <div>
            <div className="mz-mark">Mizan<span>ميزان</span></div>
            <div className="mz-sub">Financial statement analysis that shows its work</div>
          </div>
          <p className="mz-thesis">Autonomous when it is certain. Accountable when it is not.</p>
        </header>

        <div className="mz-intake">
          <input ref={inputRef} type="file" accept="application/pdf" onChange={onPick} style={{ display: "none" }} />
          <button className="mz-btn" disabled={working} onClick={() => inputRef.current?.click()}>
            {working ? "Reading" : "Read a statements PDF"}
          </button>
          <input className="mz-in" placeholder="Your name, for the record"
            value={operator} onChange={(e) => setOperator(e.target.value)} aria-label="Operator name" />
          {state === "done" && (
            <>
              <button className="mz-btn ghost" onClick={() => window.print()}>Print</button>
              <button className="mz-btn ghost" onClick={downloadExcel}>Excel</button>
              <button className="mz-btn ghost" onClick={downloadEvidence}>Evidence JSON</button>
              <button className="mz-btn ghost" onClick={clearSession}>New document</button>
            </>
          )}
          {file && state === "done" && <span className="mz-hint">{file.name}</span>}
        </div>

        {state === "idle" && (
          <div className="mz-empty">
            <p className="mz-empty-t">No document read yet.</p>
            <p className="mz-empty-s">
              Load a set of financial statements as a PDF. Long documents are cut into slices and read in parallel.
            </p>
          </div>
        )}

        {slices.length > 0 && (
          <div className="mz-panel">
            <div className="mz-panel-strip">
              <span>{working ? "Reading in parallel" : "Coverage"}</span>
              <span>{PAGES_PER_SLICE} pages per slice · {CONCURRENCY} at once</span>
            </div>
            <div className="mz-track">
              <div className="mz-track-fill" style={{ width: (((doneCount + missCount) / slices.length) * 100) + "%" }} />
            </div>
            <div className="mz-dials">
              <div className="mz-dial">
                <div className="mz-dial-l">Slices read</div>
                <div className="mz-dial-v">{doneCount}/{slices.length}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Pages covered</div>
                <div className="mz-dial-v">{pagesRead}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Findings so far</div>
                <div className="mz-dial-v">{data?.findings?.length || 0}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Unread</div>
                <div className="mz-dial-v" style={{ color: missCount ? "var(--esc)" : "var(--ink)" }}>{missCount}</div>
              </div>
            </div>
            <div className="mz-grid">
              {slices.map((s, i) => (
                <div key={s.idx ?? i} className={"mz-cell " + s.status}
                  title={"pages " + s.from + " to " + s.to + (s.why ? " · " + s.why : "")}>
                  {s.from}
                </div>
              ))}
            </div>
          </div>
        )}

        {notice && (
          <div className="mz-note">{notice}</div>
        )}

        {state === "done" && meta && meta.failed > 0 && (
          <div className="mz-retry">
            <span>{meta.failed} of {meta.slices} slices did not read. This reading is marked incomplete.</span>
            <button className="mz-btn ghost" onClick={retryFailed}>Retry failed slices</button>
          </div>
        )}

        {state === "error" && (
          <div className="mz-err">
            <p className="mz-err-t">Reading stopped</p>
            <p className="mz-err-b">{err}</p>
          </div>
        )}

        {data && (data.findings?.length > 0 || state === "done") && (
          <>
            <section className="mz-sec">
              <div className="mz-sec-head">
                <h2 className="mz-sec-title">Lens applied</h2>
                <span className="mz-sec-note">{working ? "provisional" : "settled"}</span>
              </div>
              <div className="mz-class">
                <div>
                  <div className="mz-class-meta">Classified as</div>
                  <div className="mz-class-lens">
                    {data.classification?.lens === "public_sector" ? "Public sector entity" : "Corporate entity"}
                  </div>
                  <div className="mz-class-meta" style={{ marginTop: ".4rem", marginBottom: 0 }}>
                    {[data.classification?.basis, data.entity?.name, data.entity?.period].filter(Boolean).join(" · ")}
                  </div>
                </div>
                <p className="mz-class-why">{data.classification?.why}</p>
              </div>
            </section>

            {data.entity?.auditOpinion && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Audit opinion</h2>
                  <span className="mz-sec-note">as stated</span>
                </div>
                <div className="mz-row landed">
                  <div className="mz-tick verified">{MARK.verified}</div>
                  <div className="mz-body"><p className="mz-title">{data.entity.auditOpinion}</p></div>
                  <div className="mz-ref">Auditor's report</div>
                </div>
              </section>
            )}

            {bal && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Does it balance</h2>
                  <span className="mz-sec-note">arithmetic, not a model</span>
                </div>
                <div className="mz-arith">
                  <div className="mz-arith-strip">
                    <span>Computed in this browser</span>
                    <span>{data.entity?.currency} {data.entity?.scale}</span>
                  </div>
                  <div className="mz-eq">
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total assets</span><span className="mz-eq-val">{fmt(data.balance.totalAssets)}</span></div>
                    <div className="mz-eq-line"><span className="mz-eq-lbl">Total liabilities</span><span className="mz-eq-val">{fmt(data.balance.totalLiabilities)}</span></div>
                    <div className="mz-eq-line">
                      <span className="mz-eq-lbl">{data.classification?.lens === "public_sector" ? "Net assets" : "Total equity"}</span>
                      <span className="mz-eq-val">{fmt(data.balance.totalNetAssets)}</span>
                    </div>
                    <div className="mz-eq-rule" />
                    <div className="mz-eq-line">
                      <span className="mz-eq-lbl">Difference</span>
                      <span className="mz-eq-val" style={{ color: bal.ok ? "var(--tick)" : "var(--esc)" }}>{fmt(bal.delta)}</span>
                    </div>
                  </div>
                  <div className={"mz-verdict " + (bal.ok ? "pass" : "fail")}>
                    {bal.ok
                      ? MARK.verified + "  Assets equal liabilities plus net assets. Nothing here rests on judgement."
                      : MARK.escalate + "  Off by " + fmt(Math.abs(bal.delta)) + ". Reported as-is. No figure on this page should be relied on until a person finds the cause."}
                  </div>
                </div>
              </section>
            )}

            {data.tieOut?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Tie-out</h2>
                  <span className="mz-sec-note">{data.tieOut.length} checks</span>
                </div>
                {data.tieOut.map((t, i) => {
                  const st = t.result === "pass" ? "verified" : t.result === "fail" ? "escalate" : "review";
                  return (
                    <div key={i} className="mz-row landed">
                      <div className={"mz-tick " + st}>{MARK[st]}</div>
                      <div className="mz-body"><p className="mz-title">{t.check}</p><p className="mz-detail">{t.detail}</p></div>
                      <div className="mz-ref">{t.ref}</div>
                    </div>
                  );
                })}
              </section>
            )}

            {data.figures?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Figures</h2>
                  <span className="mz-sec-note">every one carries its page</span>
                </div>
                <div className="mz-figs">
                  {data.figures.map((f, i) => {
                    const corrected = edits[f.label] != null;
                    return (
                      <div key={i} className={"mz-fig " + (f.state || "review")}>
                        <div className="mz-fig-lbl">{f.label}{corrected && <span className="mz-corrected">corrected</span>}</div>
                        <input
                          className="mz-fig-input"
                          value={corrected ? edits[f.label] : f.value}
                          onChange={(e) => setEdits((p) => ({ ...p, [f.label]: e.target.value }))}
                          aria-label={"Value for " + f.label}
                        />
                        <div className="mz-fig-ref">{f.ref}{corrected && " · edited from " + f.value}</div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {data.variance?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Budget against actual</h2>
                  <span className="mz-sec-note">bar shows spend against approved</span>
                </div>
                {data.variance.map((v, i) => {
                  const pct = v.budget ? (v.actual / v.budget) * 100 : 0;
                  const under = pct < 90;
                  return (
                    <div key={i} className="mz-var-row">
                      <div>
                        <div className="mz-var-lbl">{v.label}</div>
                        <div className="mz-var-track">
                          <div className={"mz-var-fill" + (under ? " under" : "")} style={{ width: Math.min(pct, 100) + "%" }} />
                        </div>
                      </div>
                      <div className="mz-var-pct" style={{ color: under ? "var(--query)" : "var(--ink)" }}>{pct.toFixed(0)}%</div>
                    </div>
                  );
                })}
              </section>
            )}

            {((data.findings?.length > 0) || manual.length > 0) && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Findings</h2>
                  <span className="mz-sec-note">{shownFindings.length} shown</span>
                </div>
                <div className="mz-controls">
                  <input className="mz-in" placeholder="Search findings" value={query}
                    onChange={(e) => setQuery(e.target.value)} aria-label="Search findings" />
                  <div className="mz-filters">
                    {["all", "verified", "review", "escalate"].map((k) => (
                      <button key={k} className={"mz-filter" + (filterState === k ? " on" : "")}
                        onClick={() => setFilterState(k)}>{k}</button>
                    ))}
                  </div>
                  <button className="mz-btn ghost" onClick={addManualFinding}>+ Add finding</button>
                </div>
                {shownFindings.map((f, i) => (
                  f.manual ? (
                    <div key={"m" + i} className="mz-row mz-manual landed">
                      <div className={"mz-tick " + (f.state || "review")}>{MARK[f.state] || "?"}</div>
                      <div className="mz-body">
                        <input className="mz-edit-title" value={f.title}
                          onChange={(e) => updateManual(manual.indexOf(f), "title", e.target.value)} />
                        <textarea className="mz-edit-detail" value={f.detail} placeholder="Detail"
                          onChange={(e) => updateManual(manual.indexOf(f), "detail", e.target.value)} />
                        <div className="mz-edit-row">
                          <select value={f.state} onChange={(e) => updateManual(manual.indexOf(f), "state", e.target.value)}>
                            <option value="verified">verified</option>
                            <option value="review">review</option>
                            <option value="escalate">escalate</option>
                          </select>
                          <select value={f.severity} onChange={(e) => updateManual(manual.indexOf(f), "severity", e.target.value)}>
                            <option value="high">high</option>
                            <option value="medium">medium</option>
                            <option value="low">low</option>
                          </select>
                          <button className="mz-del" onClick={() => removeManual(manual.indexOf(f))}>remove</button>
                        </div>
                      </div>
                      <div className="mz-ref">operator entry</div>
                    </div>
                  ) : (
                    <div key={"f" + i} className="mz-row landed">
                      <div className={"mz-tick " + (f.state || "review")}>{MARK[f.state] || "?"}</div>
                      <div className="mz-body">
                        <p className="mz-title">{f.title}{f.severity && <span className={"mz-sev " + f.severity}>{f.severity}</span>}</p>
                        <p className="mz-detail">{f.detail}</p>
                        {f.metric && <p className="mz-metric">{f.metric}</p>}
                      </div>
                      <div className="mz-ref">{f.ref}</div>
                    </div>
                  )
                ))}
                {shownFindings.length === 0 && (
                  <div className="mz-row"><div className="mz-tick"></div>
                    <div className="mz-body"><p className="mz-detail">No findings match this filter or search.</p></div>
                    <div className="mz-ref"></div></div>
                )}
                <div className="mz-legend">
                  <span><b style={{ color: "var(--tick)" }}>{MARK.verified}</b> read from the document</span>
                  <span><b style={{ color: "var(--query)" }}>{MARK.review}</b> derived, confirm it</span>
                  <span><b style={{ color: "var(--esc)" }}>{MARK.escalate}</b> a person decides</span>
                </div>
              </section>
            )}

            {data.escalations?.length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Held for a person</h2>
                  <span className="mz-sec-note">not answered, on purpose</span>
                </div>
                {data.escalations.map((e, i) => (
                  <div key={i} className="mz-esc-card">
                    <p className="mz-esc-t">{e.title}</p>
                    <p className="mz-esc-w">{e.why}</p>
                    <div className="mz-esc-d">
                      <b>Decision needed</b>
                      {e.decisionNeeded}
                      <div className="mz-owner">
                        <label htmlFor={"own" + i}>Accountable owner</label>
                        <input id={"own" + i} className="mz-in" placeholder="Name the person"
                          value={owners[i] || ""} onChange={(ev) => setOwners({ ...owners, [i]: ev.target.value })} />
                      </div>
                      <span style={{ display: "block", marginTop: ".5rem", fontFamily: "'IBM Plex Mono',monospace", fontSize: ".63rem", color: "var(--ink-soft)" }}>{e.ref}</span>
                    </div>
                  </div>
                ))}
              </section>
            )}

            {meta && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Evidence record</h2>
                  <span className="mz-sec-note">emitted for every reading</span>
                </div>
                <div className="mz-ev">
                  <div><b>Document</b> {meta.name} · {meta.pages} pages</div>
                  <div><b>SHA-256</b> {meta.hash}</div>
                  <div><b>Read at</b> {meta.at} · took {meta.seconds}s</div>
                  <div><b>System</b> Mizan {VERSION} · {meta.model}</div>
                  <div>
                    <b>Coverage</b> {meta.read}/{meta.slices} slices
                    {meta.failed > 0 && <span style={{ color: "var(--esc)" }}> · {meta.failed} unread, this reading is not complete</span>}
                  </div>
                  <div>
                    <b>Cost of this reading</b> ${meta.cost_usd?.toFixed(4)} ·{" "}
                    {(meta.input_tokens || 0).toLocaleString()} in / {(meta.output_tokens || 0).toLocaleString()} out
                  </div>
                  <div><b>Operator</b> {operator || "UNRECORDED"}</div>
                  <div><b>Escalations open</b> {(data.escalations || []).length} · owners named {(data.escalations || []).filter((_, i) => owners[i]).length}</div>
                </div>
              </section>
            )}

            {state === "done" && (
              <footer className="mz-foot">
                <div>
                  <b>Mizan</b> {VERSION} · reading of {file?.name || "document"}<br />
                  Figures are read from the document. Nothing here is an opinion on the accounts.
                </div>
                <div style={{ textAlign: "right" }}>
                  <b>Jonathan Z</b><br />
                  Nexus AI Assurance FZCO · Dubai<br />
                  [contact] · nexusai.ae
                </div>
              </footer>
            )}
          </>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
