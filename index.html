const { useState, useRef, useCallback } = React;
const { PDFDocument } = PDFLib;


const VERSION = "1.0.0";

// The same reading, written for a different reader. The lens never changes the
// arithmetic or the extracted figures — only who the evaluation is addressed to.
const LENSES = [
  { key: "", label: "General", blurb: "Balanced analyst view, no particular audience." },
  { key: "investor", label: "Investor lens", blurb: "Return, growth runway, dividend safety, valuation." },
  { key: "bank", label: "Bank lending lens", blurb: "Debt service capacity, coverage, downside resilience." },
  { key: "audit", label: "Audit lens", blurb: "Misstatement risk, estimate-heavy balances, what to test." },
  { key: "cfo", label: "CFO lens", blurb: "Operational levers, working capital, what to act on." },
  { key: "board", label: "Board lens", blurb: "Strategy, oversight, the decisions actually in front of you." },
  { key: "student", label: "Student lens", blurb: "Explains each measure before interpreting it." },
  { key: "credit", label: "Credit rating lens", blurb: "Indicative rating band and what would move it." }
];
const LENS_LABEL = LENSES.reduce((a, l) => { a[l.key] = l.label; return a; }, {});

const PAGES_PER_SLICE = 6;   // small enough that one call clears 10s comfortably
const CONCURRENCY = 4;       // slices in flight at once
const RETRIES = 2;

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
.mz *{box-sizing:border-box;margin:0;padding:0}

/* ---- instrument panel ---- */
.mz-panel{border:1px solid var(--ink);border-top:none;background:#fff}

.mz-dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));border-bottom:1px solid var(--rule)}
.mz-dial{padding:.8rem .9rem;border-right:1px solid var(--rule)}
.mz-dial-l{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.mz-dial-v{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;font-weight:600;margin-top:.2rem;font-variant-numeric:tabular-nums}

const MARK = { verified: "\u2713", review: "?", escalate: "\u2717" };
const SEV_RANK = { high: 0, medium: 1, low: 2 };

// Which statements a complete reading would contain. Order is the order a
// reader expects them in, not the order they happen to appear in the PDF.
const STATEMENTS = [
  { key: "income_statement", label: "Income statement" },
  { key: "balance_sheet", label: "Balance sheet" },
  { key: "cash_flow", label: "Cash flow" },
  { key: "equity_statement", label: "Changes in equity" },
  { key: "notes", label: "Notes" },
  { key: "auditor_report", label: "Auditor report" },
  { key: "management_discussion", label: "Management discussion" }
];

// Line items that prove a statement was genuinely read, not merely glimpsed.
const STATEMENT_PROOF = {
  income_statement: ["revenue", "operatingProfit", "netProfit", "costOfSales", "grossProfit"],
  balance_sheet: ["totalAssets", "totalLiabilities", "totalEquity", "currentAssets", "currentLiabilities"],
  cash_flow: ["operatingCashFlow", "capex", "dividendsPaid"]
};

// Slice coverage tells you how much of the PDF was processed; this tells you
// whether the parts that matter were among it. Module scope, because both the
// coverage map and the evaluation prompt must be looking at the same answer.
const coverageOf = (d) => STATEMENTS.map((s) => {
  const seen = (d.sections || []).filter((x) => x.kind === s.key);
  const proof = STATEMENT_PROOF[s.key] || [];
  const got = proof.filter((k) => d.lineItems && d.lineItems[k] != null).length;
  // Where we have proof fields, the share of them found is a truer read than a
  // self-reported sighting. Elsewhere fall back to whether it was seen at all.
  const pct = proof.length ? Math.round((got / proof.length) * 100) : (seen.length ? 100 : 0);
  return {
    ...s, pct, seen: seen.length > 0,
    // A page range means nothing on its own once several files are open, so the
    // document name travels with it wherever the range is shown.
    pages: seen.map((x) => ((x.doc ? x.doc + " " : "") + (x.pages || "")).trim()).filter(Boolean).join(", "),
    proven: proof.length ? got + "/" + proof.length + " key lines" : (seen.length ? "seen" : "not seen")
  };
});

function App() {
  const [state, setState] = useState("idle");
  const [data, setData] = useState(null);
  const [meta, setMeta] = useState(null);
  const [slices, setSlices] = useState([]);
  const [err, setErr] = useState("");
  const [docs, setDocs] = useState([]);   // every PDF in this reading, in upload order
  const [owners, setOwners] = useState({});
  const [operator, setOperator] = useState("");
  const [notice, setNotice] = useState("");
  const [query, setQuery] = useState("");
  const [filterState, setFilterState] = useState("all");   // all|verified|review|escalate
  const [collapsed, setCollapsed] = useState({});
  const [edits, setEdits] = useState({});                  // figure label -> corrected value
  const [manual, setManual] = useState([]);                // operator-added findings
  const [restored, setRestored] = useState(false);
  const [evaluation, setEvaluation] = useState(null);
  const [evalState, setEvalState] = useState("idle");   // idle|working|done|error
  const [evalErr, setEvalErr] = useState("");
  const [trail, setTrail] = useState([]);              // reading timeline, newest last
  const [lens, setLens] = useState("");                // evaluation lens in force
  const [openRatio, setOpenRatio] = useState(null);    // ratio whose reference card is open
  const [openFig, setOpenFig] = useState(null);        // figure whose source quote is open
  const cacheRef = useRef({});
  const evalCostRef = useRef(null);   // token cost of the evaluation call, for the audit log
  const builtRef = useRef([]);
  const inputRef = useRef(null);

  const PERSIST_KEY = "mizan.session.v1";

  // Restore the last reading so a refresh never destroys review work.
  React.useEffect(() => {
    try {
      const raw = localStorage.getItem(PERSIST_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.data) {
        setData(s.data); setMeta(s.meta || null); setOwners(s.owners || {});
        setOperator(s.operator || ""); setEdits(s.edits || {}); setManual(s.manual || []);
        setSlices(s.slices || []);
        setDocs(s.docs || []);
        setTrail(s.trail || []); setLens(s.lens || "");
        if (s.evaluation) { setEvaluation(s.evaluation); setEvalState("done"); }
        // The evaluation's token cost belongs to the audit log. Without this the
        // log loses a row on refresh and quietly under-reports what was spent.
        if (s.evalCost) evalCostRef.current = s.evalCost;
        setState("done"); setRestored(true);
        setNotice("Restored your last reading from this browser. Upload a new document to start fresh.");
      }
    } catch {}
  }, []);

  React.useEffect(() => {
    if (state !== "done" || !data) return;
    try {
      localStorage.setItem(PERSIST_KEY, JSON.stringify({
        data, meta, owners, operator, edits, manual, evaluation, trail, lens, docs,
        evalCost: evalCostRef.current,
        slices: (slices || []).map((s) => ({ ...s, pdf: undefined }))  // never persist the raw PDF bytes
      }));
    } catch {}
  }, [state, data, meta, owners, operator, edits, manual, evaluation, trail, lens, docs]);

  const clearSession = () => {
    try { localStorage.removeItem(PERSIST_KEY); } catch {}
    setData(null); setMeta(null); setOwners({}); setEdits({}); setManual([]);
    setSlices([]); setState("idle"); setRestored(false); setNotice(""); setDocs([]);
    setEvaluation(null); setEvalState("idle"); setEvalErr("");
    setTrail([]); setLens(""); setOpenRatio(null); setOpenFig(null);
    evalCostRef.current = null;
  };

  const fmt = (n) => (typeof n === "number" && isFinite(n) ? n.toLocaleString("en-US") : String(n ?? ""));

  // Reading timeline. Every entry is written at the moment the step actually
  // happens, from the real result of that step — never a scripted sequence. If a
  // slice fails, that failure is in the trail too.
  const mark = (kind, text, detail) =>
    setTrail((t) => t.concat([{ at: Date.now(), kind, text, detail: detail || "" }]));

  // Normalise the mixed scale words a document uses ("73,370 Million",
  // "1.68Tn", "359Bn", "73.4 Billion") into one consistent notation so the
  // eye can compare magnitudes down a column. Best-effort, never invents.
  const normNum = (raw) => {
    if (raw == null) return raw;
    const s = String(raw).trim();
    const mm = s.match(/([\d,]+(?:\.\d+)?)\s*(trillion|tn|billion|bn|million|mn|thousand|[mk])\b/i);
    if (!mm) return s;
    let val = parseFloat(mm[1].replace(/,/g, ""));
    if (!isFinite(val)) return s;
    const unit = (mm[2] || "").toLowerCase();
    const mult = /^t/.test(unit) ? 1e12
      : /^b/.test(unit) ? 1e9
      : (/^mi/.test(unit) || /^mn/.test(unit) || unit === "m") ? 1e6
      : (/^th/.test(unit) || unit === "k") ? 1e3 : 1;
    const abs = val * mult;
    // keep only trailing parenthetical context like "(+3%)", drop leftover unit words
    const after = s.slice(mm.index + mm[0].length);
    const paren = (after.match(/\([^)]*\)/) || [""])[0];
    let out;
    if (abs >= 1e12) out = +(abs / 1e12).toFixed(2) + "Tn";
    else if (abs >= 1e9) out = +(abs / 1e9).toFixed(abs % 1e9 === 0 ? 0 : 1) + "Bn";
    else if (abs >= 1e6) out = +(abs / 1e6).toFixed(abs % 1e6 === 0 ? 0 : 1) + "M";
    else if (abs >= 1e3) out = +(abs / 1e3).toFixed(0) + "K";
    else out = String(val);
    const cur = /aed/i.test(s) ? "AED " : /\$|usd/i.test(s) ? "$" : "";
    return (cur + out + (paren ? " " + paren : "")).trim();
  };

    // Pull "current (2024: prior)" pairs out of a figure value for a mini bar pair.
  const compPair = (raw) => {

    if (!mm) return null;
    const cur = parseFloat(mm[1].replace(/,/g, ""));
    const pri = parseFloat(mm[2].replace(/,/g, ""));
    if (!isFinite(cur) || !isFinite(pri) || pri === 0) return null;
    return { cur, pri, up: cur >= pri };

    "Operating cash-flow margin": { dir: "high", bands: [0.1, 0.2], what: "The share of revenue that arrives as operating cash.", why: "Profit is an opinion; cash is a fact. This tests whether revenue converts.", typical: "10\u201320%, higher for businesses that collect upfront.", limits: "Can be flattered temporarily by stretching payables." },
    "Cash conversion ratio": { dir: "high", bands: [0.8, 1.0], what: "Operating cash flow against net profit.", why: "The clearest single check on earnings quality. Persistent readings below 1.0 suggest profit that never becomes cash.", typical: "Around 1.0x or above.", limits: "One year can be thrown off by working-capital timing. Read the trend, not the point." },
    "Free cash flow": { dir: "high", bands: [0, 1], what: "Operating cash left after the capital spending needed to keep going.", why: "This is the cash genuinely available for dividends, debt repayment or reinvestment.", typical: "Positive and growing for a mature business.", limits: "Lumpy capex makes single years misleading; a business mid-expansion can be healthy with negative free cash flow." },
    "Free cash flow margin": { dir: "high", bands: [0.05, 0.15], what: "Free cash flow as a share of revenue.", why: "Puts free cash flow on a comparable footing across periods and entities.", typical: "5\u201315%.", limits: "Inherits the lumpiness of capex." },
    "Capex to operating cash flow": { dir: "low", bands: [0.8, 0.4], what: "The share of operating cash consumed by capital spending.", why: "It shows how much of the cash generated is being ploughed straight back in to stand still or expand.", typical: "20\u201360% depending on growth phase.", limits: "Does not distinguish maintenance capex from expansion capex, which matter very differently." },
    "Net profit growth": { dir: "high", bands: [0, 0.1], what: "Year-on-year change in the bottom line.", why: "Growth in profit, not just revenue, is what compounds value.", typical: "Varies. Steady positive growth beats a volatile average.", limits: "Very sensitive to one-offs in either year, and to a weak comparative base." },
    "Asset growth": { dir: "high", bands: [0, 0.05], what: "Year-on-year change in the asset base.", why: "Shows whether the business is investing, holding, or shrinking.", typical: "In line with revenue growth for a stable business.", limits: "Assets growing much faster than revenue can signal poor investment discipline." },
    "Earnings per share": { dir: "high", bands: [0, 1], what: "Profit attributable to each ordinary share.", why: "The per-share figure is what share prices are actually compared against.", typical: "Not comparable between companies; only its trend matters.", limits: "Changes in share count from buybacks or issues move it without any change in performance." },
    "Price-to-earnings ratio": { dir: "low", bands: [25, 15], what: "The price paid per unit of annual earnings.", why: "The most quoted valuation shorthand: how many years of current earnings the price represents.", typical: "12\u201320x for mature businesses.", limits: "Meaningless with negative earnings, and a low figure often reflects an expectation that earnings will fall, not a bargain." },
    "Dividend yield": { dir: "high", bands: [0.02, 0.04], what: "Cash dividend as a percentage of share price.", why: "The income return a shareholder receives without selling anything.", typical: "2\u20135% for income stocks.", limits: "A high yield is often a falling share price rather than generosity. Check it is covered by earnings." },
    "Dividend payout ratio": { dir: "low", bands: [0.9, 0.6], what: "The share of earnings paid out as dividends.", why: "It tests whether the dividend is sustainable and how much is retained to fund growth.", typical: "30\u201360%. Above 100% means paying out more than was earned.", limits: "A single year can be distorted by a special dividend or a weak profit year." },
    "Market capitalisation": { dir: "high", bands: [0, 1], what: "The market value of all shares outstanding.", why: "The market's own verdict on the equity, against which book equity can be compared.", typical: "Not a benchmark figure; it is scale.", limits: "Reflects sentiment as much as fundamentals, and moves daily." },
    "EV / EBITDA": { dir: "low", bands: [14, 9], what: "The value of the whole business, debt included, against EBITDA.", why: "Unlike P/E it is unaffected by capital structure, so it compares leveraged and unleveraged businesses fairly.", typical: "8\u201312x in most sectors.", limits: "Depends on EBITDA, which ignores the cost of maintaining the asset base." },
    "PEG ratio": { dir: "low", bands: [2, 1], what: "The P/E ratio divided by the growth rate.", why: "It asks whether a high multiple is justified by the growth behind it.", typical: "Around 1.0 is considered fair value.", limits: "Breaks down entirely with negative or near-zero growth, and one year of growth is a poor proxy for the future." }
  };

  // Which statement a missing input would have come from, so a ratio that cannot be
  // computed can say WHY in the reader's terms rather than listing field names.
  const SOURCE_OF = {
    revenue: "Income statement", priorRevenue: "Income statement",
    costOfSales: "Income statement", grossProfit: "Income statement",
    operatingProfit: "Income statement", netProfit: "Income statement",
    priorNetProfit: "Income statement", financeCosts: "Income statement",
    financeIncome: "Income statement", ebitda: "Income statement",
    depreciation: "Income statement", taxExpense: "Income statement",
    totalAssets: "Balance sheet", priorTotalAssets: "Balance sheet",
    totalLiabilities: "Balance sheet", totalEquity: "Balance sheet",
    currentAssets: "Balance sheet", currentLiabilities: "Balance sheet",
    inventory: "Balance sheet", tradeReceivables: "Balance sheet",
    tradePayables: "Balance sheet", fixedAssets: "Balance sheet",
    cashAndEquivalents: "Balance sheet", shortTermDeposits: "Balance sheet",
    totalDebt: "Balance sheet", netDebt: "Balance sheet",
    operatingCashFlow: "Cash flow statement", capex: "Cash flow statement",
    dividendsPaid: "Cash flow statement",
    sharesOutstanding: "Share data", marketPrice: "Market data",
    dividendPerShare: "Share data"
  };

  const NEED_LABEL = {
    currentAssets: "current assets", currentLiabilities: "current liabilities",
    cashAndEquivalents: "cash", shortTermDeposits: "short-term deposits",
    revenue: "revenue", priorRevenue: "prior-year revenue",
    operatingProfit: "operating profit", netProfit: "net profit",
    financeCosts: "finance costs", netDebt: "net debt", ebitda: "EBITDA",
    operatingCashFlow: "operating cash flow", sharesOutstanding: "share count",
    marketPrice: "market price", dividendPerShare: "dividend per share",
    costOfSales: "cost of sales", grossProfit: "gross profit",
    priorNetProfit: "prior-year net profit", depreciation: "depreciation",
    taxExpense: "tax expense", totalAssets: "total assets",
    priorTotalAssets: "prior-year total assets", totalLiabilities: "total liabilities",
    totalEquity: "total equity", inventory: "inventory",
    tradeReceivables: "trade receivables", tradePayables: "trade payables",
    fixedAssets: "fixed assets", totalDebt: "total borrowings",
    capex: "capital expenditure", dividendsPaid: "dividends paid",
    financeIncome: "finance income"
  };

  // Group the missing inputs by the statement they live on, so the reason reads
  // "Balance sheet not yet read" rather than a list of field names.
  const missReason = (keys) => {
    const stmts = [...new Set(keys.map((k) => SOURCE_OF[k]).filter(Boolean))];
    const names = keys.map((k) => NEED_LABEL[k] || k);
    if (stmts.length === 1) {
      return { headline: stmts[0] + " not yet read.", detail: "Needs " + names.join(" and ") + "." };
    }
    return { headline: "Inputs not found in what was read.", detail: "Needs " + names.join(" and ") + "." };
  };

  const computeRatios = (lineItems) => {
    if (!lineItems) return null;
    const v = lineItems;
    return RATIO_DEFS.map((d) => {
      const meta = RATIO_META[d.name] || {};
      const base = { ...d, ...meta };
      const missing = d.needs.filter((k) => v[k] == null || (v[k] === 0 && k !== "priorRevenue"));
      if (missing.length) {
        return { ...base, status: "missing", missing: missing.map((k) => NEED_LABEL[k] || k), reason: missReason(missing) };
      }
      let val;
      try { val = d.calc(v); } catch {
        return { ...base, status: "missing", missing: ["valid inputs"], reason: { headline: "Could not compute.", detail: "The inputs were present but the arithmetic failed." } };
      }
      if (!isFinite(val)) {
        return { ...base, status: "missing", missing: ["non-zero denominator"], reason: { headline: "Could not compute.", detail: "The denominator is zero, so the result is undefined." } };
      }
      const shown = d.pct ? (val * 100).toFixed(1) + "%"
        : d.money ? "AED " + val.toFixed(3)
        : d.raw ? Math.round(val).toLocaleString("en-US")
        : val.toFixed(2) + (d.unit || "");
      // Score 0-100 against the band for this ratio, used by the health scorecard.
      // Ratios with no meaningful band (scale figures like market cap) score null.
      let score = null;
      if (meta.bands && meta.dir && !d.raw) {
        const [weak, strong] = meta.bands;
        if (meta.dir === "high") score = val >= strong ? 100 : val >= weak ? 62 : 28;
        else score = val <= strong ? 100 : val <= weak ? 62 : 28;
      }
      return { ...base, status: "ok", value: val, shown, score, note: d.plain(val) };
    });
  };

  // Build a compact, number-rich summary of the finished analysis and ask the
  // evaluation function to interpret it. Kept fully separate from the arithmetic.
  // The lens changes only the reader it is written for, never the underlying data.
  const runEvaluation = async (reading, ratioList, useLens) => {
    setEvalState("working"); setEvalErr(""); setEvaluation(null);
    const chosen = useLens !== undefined ? useLens : lens;
    try {
      const okRatios = (ratioList || []).filter((r) => r.status === "ok")
        .map((r) => "- " + r.name + " (" + r.family + "): " + r.shown + " [" + r.note + "]");
      const missRatios = (ratioList || []).filter((r) => r.status !== "ok")
        .map((r) => "- " + r.name + ": not computed (" + ((r.reason && r.reason.headline) || "missing " + (r.missing || []).join(", ")) + ")");
      const figs = (reading.figures || []).map((f) => "- " + f.label + ": " + f.value + " (" + f.ref + ")" +
        (typeof f.confidence === "number" ? " [confidence " + f.confidence + "%" + (f.origin ? ", " + f.origin : "") + "]" : ""));
      const finds = (reading.findings || []).map((f) => "- [" + (f.severity || "") + "] " + f.title + ": " + (f.detail || ""));
      const claims = (reading.mgmtClaims || []).map((c) => "- \"" + c.claim + "\" (" + (c.topic || "") + ", " + (c.ref || "") + ")");
      // What was actually read. The evaluation is told to scale its confidence to
      // this, so it has to see it — a clean income statement means little if the
      // balance sheet was never opened.
      const cov = coverageOf(reading).map((c) => "- " + c.label + ": " + c.pct + "% (" +
        (c.seen ? "seen" + (c.pages ? " on pages " + c.pages : "") : "never seen") + ", " + c.proven + ")");
      // Where a reading spans several files the evaluation has to know it, both to
      // cite the right source and to weigh figures the documents disagree on.
      const srcs = (reading.entities || []).map((e) => "- " + (e.doc || "document") + ": " +
        (e.name || "entity not stated") + (e.period ? ", " + e.period : ""));
      const clash = (reading.conflicts || []).map((c) => "- " + c.label + ": " +
        c.held.doc + " says " + fmt(c.held.value) + " (used in the ratios), " +
        c.other.doc + " says " + fmt(c.other.value));

      const summary = [
        "ENTITY: " + (reading.entity?.name || "unknown") + " | " + (reading.classification?.basis || "") +
          " | " + (reading.entity?.period || ""),
        "CLASSIFICATION: " + (reading.classification?.lens || ""),
        "",
        ...(srcs.length > 1 ? ["SOURCE DOCUMENTS — this reading spans more than one file:", srcs.join("\n"), ""] : []),
        ...(clash.length ? ["FIGURES THE DOCUMENTS DISAGREE ON — the first was used; say plainly " +
          "if the disagreement undermines any conclusion:", clash.join("\n"), ""] : []),
        "READING COVERAGE — how much of each statement was actually read:", cov.join("\n"),
        "",
        "COMPUTED RATIOS:", okRatios.join("\n") || "(none computed)",
        "",
        "RATIOS NOT COMPUTED:", missRatios.join("\n") || "(all computed)",
        "",
        "KEY FIGURES:", figs.join("\n") || "(none)",
        "",
        "FINDINGS FROM THE READING:", finds.join("\n") || "(none)",
        "",
        "MANAGEMENT CLAIMS FROM THE NARRATIVE:", claims.join("\n") || "(none recorded)"
      ].join("\n");

      const r = await fetch("/.netlify/functions/evaluate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary, lens: chosen })
      });
      const j = await r.json();
      if (!r.ok || !j.evaluation) throw new Error(j.error || "The evaluation could not be produced.");
      setEvaluation(j.evaluation);
      setEvalState("done");
      if (j.meta) evalCostRef.current = j.meta;
      mark("eval", "Produced the evaluation" + (chosen ? " through the " + LENS_LABEL[chosen] : ""),
        (j.evaluation.assessment || []).length + " areas assessed, " +
        (j.evaluation.contradictions || []).length + " contradiction check" +
        ((j.evaluation.contradictions || []).length === 1 ? "" : "s") + " raised");
    } catch (e) {
      setEvalErr(e.message || "Evaluation failed.");
      setEvalState("error");
      mark("miss", "The evaluation could not be produced", e.message || "");
    }
  };

  // Deterministic merge. No second model call, so nothing can drift here.
  // Two rules that matter on a full document:
  //  1. Pick the balance sheet that actually BALANCES, not the first fragment seen.
  //  2. A confident finding beats an absence: once any slice reports the audit
  //     opinion, drop every "opinion not in my slice" note the others raised.
  // Tag one slice's reading with the file it came from. Refs get the document
  // name prefixed so a citation stays unambiguous across a multi-file set, and
  // every item keeps a machine-readable `doc` for grouping and export.
  const stampDoc = (p, docName) => {
    if (!p || !docName) return p;
    const tag = (item) => {
      if (!item || typeof item !== "object") return item;
      const ref = item.ref && !String(item.ref).startsWith(docName)
        ? docName + " · " + item.ref
        : (item.ref || docName);
      return { ...item, doc: docName, ref };
    };
    const out = { ...p, doc: docName };
    for (const k of ["tieOut", "figures", "variance", "findings", "escalations", "mgmtClaims", "sections"]) {
      if (Array.isArray(p[k])) out[k] = p[k].map(tag);
    }
    if (p.balance) out.balance = tag(p.balance);
    // lineItems is a flat map of numbers, so provenance rides alongside it.
    if (p.lineItems) out.lineItemDoc = Object.fromEntries(Object.keys(p.lineItems).map((k) => [k, docName]));
    return out;
  };

  const merge = (partials) => {
    const out = {
      entity: {}, classification: {}, balance: null, lineItems: {},
      lineItemDoc: {}, conflicts: [], entities: [],
      sections: [], mgmtClaims: [],
      tieOut: [], figures: [], variance: [], findings: [], escalations: []
    };
    const seen = new Set();
    const votes = {};
    let balScore = -1;   // higher is better: a real, balancing sheet wins

    for (const p of partials) {
      if (!p) continue;

      if (p.entity) {
        for (const k of ["name", "period", "currency", "scale", "auditOpinion"]) {
          if (!out.entity[k] && p.entity[k]) out.entity[k] = p.entity[k];
        }
        // Who each document says it is. If the set turns out to describe two
        // companies, or one company in two different years, the ratios below
        // would be built from mixed sources — so record it and say so.
        if (p.entity.name || p.entity.period) {
          const id = "entity|" + (p.doc || "") + "|" + (p.entity.name || "") + "|" + (p.entity.period || "");
          if (!seen.has(id)) {
            seen.add(id);
            out.entities.push({ doc: p.doc || "", name: p.entity.name || "", period: p.entity.period || "" });
          }
        }
      }
      if (p.classification?.lens) {
        votes[p.classification.lens] = (votes[p.classification.lens] || 0) + 1;
        if (!out.classification.basis && p.classification.basis) {
          out.classification.basis = p.classification.basis;
          out.classification.why = p.classification.why;
        }
      }

      // Balance selection: score each candidate. A sheet with all three
      // components that actually ties beats one with assets only and zeros.
      if (p.balance?.totalAssets) {
        const b = p.balance;
        const hasAll = b.totalLiabilities > 0 && b.totalNetAssets > 0;
        const ties = hasAll && Math.abs(b.totalAssets - (b.totalLiabilities + b.totalNetAssets)) < Math.max(1, b.totalAssets * 0.001);
        const score = (ties ? 100 : 0) + (hasAll ? 10 : 0) + 1;
        if (score > balScore) { out.balance = b; balScore = score; }
      }

      // Ratio inputs. Slices arrive in page order, so the first slice to report a
      // key is the one that saw it on the face of a statement; later slices are
      // usually notes repeating a fragment of it. First reading wins, and only
      // real finite numbers are taken — a key reported as text is ignored, never
      // coerced, because a ratio built on a coerced number is a guess.
      //
      // Across several documents the same rule holds, but a disagreement now
      // means something different: two files stating a different revenue are two
      // different truths, not a note repeating a face. Those are recorded as
      // conflicts and shown, never averaged and never quietly dropped.
      for (const [k, raw] of Object.entries(p.lineItems || {})) {
        const n = typeof raw === "number" ? raw : parseFloat(String(raw).replace(/[,\s]/g, ""));
        if (typeof n !== "number" || !isFinite(n)) continue;
        const from = (p.lineItemDoc || {})[k] || p.doc || "";
        if (out.lineItems[k] == null) {
          out.lineItems[k] = n;
          if (from) out.lineItemDoc[k] = from;
          continue;
        }
        const held = out.lineItems[k];
        const heldFrom = out.lineItemDoc[k] || "";
        const differs = Math.abs(held - n) > Math.max(1, Math.abs(held) * 0.005);
        if (differs && from && heldFrom && from !== heldFrom) {
          const id = "conflict|" + k + "|" + from;
          if (!seen.has(id)) {
            seen.add(id);
            out.conflicts.push({ key: k, label: NEED_LABEL[k] || k,
              held: { doc: heldFrom, value: held }, other: { doc: from, value: n } });
          }
        }
      }

      // Which statements were actually seen, and where. Deduped by kind and page
      // range so the same statement spanning two slices is not counted twice.
      for (const s of p.sections || []) {
        if (!s || !s.kind) continue;
        const id = "section|" + s.kind + "|" + (s.pages || "");
        if (seen.has(id)) continue;
        seen.add(id);
        out.sections.push(s);
      }

      // Management assertions, kept verbatim for the contradiction check.
      for (const c of p.mgmtClaims || []) {
        if (!c || !c.claim) continue;
        const id = "claim|" + c.claim.toLowerCase().slice(0, 80);
        if (seen.has(id)) continue;
        seen.add(id);
        out.mgmtClaims.push(c);
      }

      for (const key of ["tieOut", "figures", "variance", "findings", "escalations"]) {
        for (const item of p[key] || []) {
          const id = key + "|" + (item.title || item.label || item.check || JSON.stringify(item)).toLowerCase().slice(0, 60);
          if (seen.has(id)) continue;
          seen.add(id);
          out[key].push(item);
        }
      }
    }

    out.classification.lens =
      (votes.public_sector || 0) >= (votes.corporate || 0) && votes.public_sector
        ? "public_sector"
        : votes.corporate ? "corporate" : "corporate";

    // Collapse "absence of X" noise once X was actually found somewhere.
    // If any slice reported an audit opinion, a real opinion finding, or an
    // opinion escalation, drop every "not in my slice" opinion note.
    const opinionFound =
      !!out.entity.auditOpinion ||
      out.findings.some((f) => /opinion/i.test(f.title || "") && f.state !== "escalate" && !/no |not |undisclosed|missing|absent/i.test(f.title || ""));

    const isOpinionAbsence = (txt) =>
      /opinion|auditor/i.test(txt || "") && /no |not |undisclosed|missing|absent|not found|not located|not present|not stated|not visible/i.test(txt || "");

    if (opinionFound) {
      out.findings = out.findings.filter((f) => !(isOpinionAbsence(f.title) || isOpinionAbsence(f.detail)));
      out.escalations = out.escalations.filter((e) => !(isOpinionAbsence(e.title) || isOpinionAbsence(e.why)));
    }

    // Also collapse the generic "no financial statements in this slice" swarm:
    // keep at most one, and only if NO slice produced a balancing sheet.
    const noStmtRe = (txt) => /no (financial statements|balance sheet|income statement|financials|consolidated)/i.test(txt || "");
    const haveRealBalance = balScore >= 100;
    if (haveRealBalance) {
      out.findings = out.findings.filter((f) => !(noStmtRe(f.title) || noStmtRe(f.detail)));
      out.escalations = out.escalations.filter((e) => !(noStmtRe(e.title) || noStmtRe(e.why)));
    } else {
      let kept = false;
      out.findings = out.findings.filter((f) => {
        if (noStmtRe(f.title) || noStmtRe(f.detail)) { if (kept) return false; kept = true; }
        return true;
      });
    }

    out.findings.sort((a, b) => (SEV_RANK[a.severity] ?? 3) - (SEV_RANK[b.severity] ?? 3));
    return out;
  };

  const readSlice = async (payload) => {
    for (let attempt = 0; attempt <= RETRIES; attempt++) {
      try {
        const r = await fetch("/.netlify/functions/chunk", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const j = await r.json().catch(() => ({ error: "Netlify returned " + r.status + "." }));
        if (r.ok && j.partial) return j;
        if (attempt === RETRIES) return { error: j.error || "Netlify returned " + r.status + "." };
      } catch (e) {
        if (attempt === RETRIES) return { error: String(e.message || e) };
      }
      await new Promise((r) => setTimeout(r, 900 * (attempt + 1)));
    }
    return { error: "Unreachable." };
  };

  const dispatch = useCallback(async (built, pageCount, began, seedPartials) => {
    const partials = seedPartials || new Array(built.length).fill(null);
    const costs = [];
    const failures = [];
    let cursor = 0;
    let modelSeen = null;

    const worker = async () => {
      while (cursor < built.length) {
        const i = cursor++;
        if (partials[i]) continue;              // already have this slice, skip
        const s = built[i];
        setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "busy" } : x)));

        const res = await readSlice({ pdf: s.pdf, offset: s.from, total: s.docPages || pageCount });

        if (res.partial) {
          // Stamp the source document onto everything this slice produced. Page 14
          // of one file is not page 14 of another, so a bare "p.14" would make the
          // evidence trail ambiguous the moment a second document is present.
          partials[i] = stampDoc(res.partial, s.docName);
          if (res.meta) { costs.push(res.meta); modelSeen = modelSeen || res.meta.model; }
          setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "done", usage: res.meta || null } : x)));
          setData(merge(partials.filter(Boolean)));
          // Say what this slice actually yielded, so the trail is evidence not decoration.
          const p = res.partial;
          const found = [];
          const li = Object.keys(p.lineItems || {});
          if (p.entity?.name) found.push("entity " + p.entity.name);
          if (p.balance?.totalAssets) found.push("balance sheet totals");
          if (li.length) found.push(li.length + " line item" + (li.length > 1 ? "s" : ""));
          if ((p.figures || []).length) found.push((p.figures || []).length + " figure" + (p.figures.length > 1 ? "s" : ""));
          if ((p.findings || []).length) found.push((p.findings || []).length + " finding" + (p.findings.length > 1 ? "s" : ""));
          mark("read", "Read " + (s.docName ? s.docName + " " : "") + "pages " + s.from + "–" + s.to,
            found.length ? found.join(", ") : "nothing extractable on these pages");
        } else {
          failures.push(res.error);
          setSlices((prev) => prev.map((x) => (x.idx === i ? { ...x, status: "miss", why: res.error } : x)));
          mark("miss", (s.docName ? s.docName + " " : "") + "pages " + s.from + "–" + s.to + " could not be read", res.error || "");
        }
      }
    };

    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, built.length) }, worker));
    return { partials, costs, failures, modelSeen };
  }, []);

  const finish = (docList, hash, pageCount, built, partials, costs, modelSeen, began) => {
    const got = partials.filter(Boolean);
    const reading = merge(got);
    const list = Array.isArray(docList) ? docList : [docList];
    const m = {
      hash,
      name: list.length === 1 ? list[0].name : list.length + " documents",
      docs: list,
      size: list.reduce((a, d) => a + (d.size || 0), 0),
      pages: pageCount,
      slices: built.length, read: got.length, failed: built.length - got.length,
      model: modelSeen,
      input_tokens: costs.reduce((a, c) => a + (c.input_tokens || 0), 0),
      output_tokens: costs.reduce((a, c) => a + (c.output_tokens || 0), 0),
      cost_usd: Number(costs.reduce((a, c) => a + (c.cost_usd || 0), 0).toFixed(4)),
      seconds: Math.round((Date.now() - began) / 1000),
      at: new Date().toISOString()
    };
    setData(reading);
    setMeta(m);
    setDocs(list);
    setState("done");
    cacheRef.current[hash] = { reading, meta: m, partials, costs, modelSeen, pageCount, built, docs: list };

    mark("merge", "Merged " + got.length + " slice readings" +
      (list.length > 1 ? " from " + list.length + " documents" : ""),
      "deduplicated findings, chose the balance sheet that ties, collapsed absence notes");
    if ((reading.conflicts || []).length) {
      mark("miss", "Found " + reading.conflicts.length + " figure" +
        (reading.conflicts.length > 1 ? "s" : "") + " the documents disagree on",
        "held the first reading and flagged the disagreement rather than averaging it");
    }
    if (reading.balance?.totalAssets) {
      const b = checkBalance(reading.balance);
      mark("check", "Ran the balance check",
        b && b.ok ? "assets = liabilities + net assets, in balance" : "does not balance, difference " + fmt(b ? b.delta : 0));
    }
    if ((reading.tieOut || []).length) {
      mark("check", "Ran " + reading.tieOut.length + " tie-out check" + (reading.tieOut.length > 1 ? "s" : ""),
        reading.tieOut.map((t) => t.result).join(", "));
    }
    // Kick off the written evaluation using the just-computed ratios.
    const ratioList = computeRatios(reading.lineItems);
    const okCount = (ratioList || []).filter((r) => r.status === "ok").length;
    mark("ratio", "Computed " + okCount + " of " + (ratioList || []).length + " ratios",
      "arithmetic in the browser; the rest are missing inputs and were not estimated");
    runEvaluation(reading, ratioList);
  };

  // Read one or many PDFs as a single reading. A set of statements is often
  // split across files — the income statement in one, the notes in another, an
  // auditor's report in a third — and a ratio that needs revenue from one and
  // total assets from another can only be computed if both are open at once.
  const run = useCallback(async (fileList) => {
    const chosen = Array.from(fileList || []).filter(Boolean);
    if (!chosen.length) return;

    setState("working"); setErr(""); setNotice(""); setData(null); setMeta(null); setSlices([]);
    setOwners({}); setTrail([]);
    const began = Date.now();

    try {
      // Hash every file first. The cache key is the hashes of the whole set in
      // order, so re-reading the same documents together is free, while adding
      // one more document is correctly treated as a different reading.
      const loaded = [];
      for (const f of chosen) {
        const buf = await f.arrayBuffer();
        loaded.push({ file: f, buf, hash: await sha256(buf) });
      }
      const hash = loaded.length === 1
        ? loaded[0].hash
        : await sha256(new TextEncoder().encode(loaded.map((d) => d.hash).join("|")).buffer);

      mark("open", "Opened " + loaded.length + " document" + (loaded.length > 1 ? "s" : ""),
        loaded.map((d) => d.file.name + " (" + Math.round(d.file.size / 1024) + " KB)").join(" · "));

      // Duplicate detection: same bytes, same reading. Serve it back instantly.
      const hit = cacheRef.current[hash];
      if (hit) {
        builtRef.current = hit.built;
        setSlices(hit.built.map((b) => ({ ...b, status: "done" })));
        setDocs(hit.docs || []);
        setData(hit.reading);
        setMeta(hit.meta);
        setState("done");
        setNotice("This exact set of documents was already read this session. Showing the cached reading. Upload a changed file to force a fresh read.");
        return;
      }

      // One slice plan across the whole set. Page numbers stay relative to the
      // document they came from, because that is how a reviewer will look them
      // up; the document name travels with the slice to keep them apart.
      const plan = [];
      const docList = [];
      for (let d = 0; d < loaded.length; d++) {
        const { file: f, buf, hash: dhash } = loaded[d];
        const src = await PDFDocument.load(buf, { ignoreEncryption: true });
        const pageCount = src.getPageCount();
        docList.push({ doc: d, name: f.name, size: f.size, pages: pageCount, hash: dhash });

        for (let start = 0; start < pageCount; start += PAGES_PER_SLICE) {
          const end = Math.min(start + PAGES_PER_SLICE, pageCount);
          plan.push({
            idx: plan.length, doc: d, docName: f.name, docPages: pageCount,
            start, end, from: start + 1, to: end, src
          });
        }
      }
      setDocs(docList);
      setSlices(plan.map((p) => ({ ...p, src: undefined, status: "queued" })));

      const built = [];
      for (const p of plan) {
        const out = await PDFDocument.create();
        const pages = await out.copyPages(p.src, Array.from({ length: p.end - p.start }, (_, i) => p.start + i));
        pages.forEach((pg) => out.addPage(pg));
        built.push({ ...p, src: undefined, pdf: b64(await out.save()) });
      }
      builtRef.current = built;

      const totalPages = docList.reduce((a, d) => a + d.pages, 0);
      mark("slice", "Split " + totalPages + " pages into " + built.length + " slices",
        loaded.length > 1
          ? "across " + loaded.length + " documents, " + PAGES_PER_SLICE + " pages each, " + CONCURRENCY + " read at a time"
          : PAGES_PER_SLICE + " pages each, " + CONCURRENCY + " read at a time");

      const { partials, costs, failures, modelSeen } = await dispatch(built, totalPages, began);

      if (!partials.filter(Boolean).length) {
        throw new Error("No part of these documents could be read. First failure: " + (failures[0] || "unknown."));
      }
      finish(docList, hash, totalPages, built, partials, costs, modelSeen, began);
    } catch (e) {
      setErr(e.message || "Something went wrong reading these documents.");
      setState("error");
    }
  }, [dispatch]);

  const retryFailed = useCallback(async () => {
    const built = builtRef.current;
    if (!built.length || !meta) return;
    const cached = cacheRef.current[meta.hash];
    const partials = cached ? cached.partials.slice() : new Array(built.length).fill(null);
    // wipe only the misses so the runner re-fires exactly those
    setSlices((prev) => prev.map((x) => (x.status === "miss" ? { ...x, status: "queued" } : x)));
    setState("working"); setErr(""); setNotice("");
    const began = Date.now() - (meta.seconds * 1000);

    try {
      const { partials: filled, costs, modelSeen } = await dispatch(built, meta.pages, began, partials);
      const priorCosts = cached ? cached.costs : [];
      finish(meta.docs || [{ name: meta.name, size: meta.size, pages: meta.pages }],
        meta.hash, meta.pages, built, filled, priorCosts.concat(costs), modelSeen || meta.model, began);
    } catch (e) {
      setErr(e.message || "Retry failed.");
      setState("error");
    }
  }, [dispatch, meta]);

  const onPick = (e) => {
    const picked = Array.from(e.target.files || []);
    if (!picked.length) return;
    run(picked); e.target.value = "";
  };

  const bal = data ? checkBalance(data.balance) : null;
  const ratios = data ? computeRatios(data.lineItems) : null;
  const ratiosOk = (ratios || []).filter((r) => r.status === "ok");
  const doneCount = slices.filter((s) => s.status === "done").length;
  const missCount = slices.filter((s) => s.status === "miss").length;
  const pagesRead = slices.filter((s) => s.status === "done").reduce((a, s) => a + (s.to - s.from + 1), 0);

  // ---- Cross-statement health scorecard -------------------------------------
  // One score per family, averaged from the ratios that actually computed, plus an
  // overall. This is the step that stops the reading being document-by-document:
  // liquidity needs the balance sheet, cash conversion needs the cash flow, and a
  // family scored from one ratio out of five is reported as exactly that.
  const FAMILIES = ["Profitability", "Liquidity", "Solvency", "Efficiency", "Cash conversion", "Growth", "Market value"];

  const scoreBand = (s) =>
    s == null ? { label: "No data", tone: "none" }
    : s >= 85 ? { label: "Strong", tone: "good" }
    : s >= 55 ? { label: "Adequate", tone: "warn" }
    : { label: "Weak", tone: "bad" };

  const scorecard = !ratios ? null : FAMILIES.map((fam) => {
    const inFam = ratios.filter((r) => r.family === fam);
    const scored = inFam.filter((r) => r.status === "ok" && r.score != null);
    const score = scored.length ? Math.round(scored.reduce((a, r) => a + r.score, 0) / scored.length) : null;
    return {
      family: fam, score, ...scoreBand(score),
      computed: inFam.filter((r) => r.status === "ok").length,
      total: inFam.length,
      basis: scored.length
    };
  });

  const overall = (() => {
    if (!scorecard) return null;
    const got = scorecard.filter((s) => s.score != null);
    if (!got.length) return null;
    const score = Math.round(got.reduce((a, s) => a + s.score, 0) / got.length);
    return { score, ...scoreBand(score), families: got.length, of: FAMILIES.length };
  })();

  // ---- Coverage by statement ------------------------------------------------
  // What the reading actually saw, per statement type, rather than one flat number.
  const coverage = !data ? null : coverageOf(data);

  // Overall confidence blends how much of the document was processed with how much
  // of the model's own stated confidence held up, and how many statements were found.
  const overallConfidence = (() => {
    if (!data || !meta) return null;
    const sliceCov = meta.slices ? meta.read / meta.slices : 0;
    const figs = (data.figures || []).filter((f) => typeof f.confidence === "number");
    const figConf = figs.length ? figs.reduce((a, f) => a + f.confidence, 0) / figs.length / 100 : null;
    const core = coverage ? coverage.slice(0, 3) : [];
    const stmtCov = core.length ? core.reduce((a, c) => a + c.pct, 0) / (core.length * 100) : 0;
    const parts = [sliceCov, stmtCov].concat(figConf == null ? [] : [figConf]);
    return Math.round((parts.reduce((a, p) => a + p, 0) / parts.length) * 100);
  })();


  const evidence = () => {
    if (!data || !meta) return null;
    const counts = { verified: 0, review: 0, escalate: 0 };
    (data.findings || []).forEach((f) => { if (counts[f.state] !== undefined) counts[f.state]++; });
    return {
      record_id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      generated_at: meta.at,
      operator: operator || "UNRECORDED",
      document: { file_name: meta.name, bytes: meta.size, pages: meta.pages, sha256: meta.hash },
      // Each source file listed on its own, with its own hash, so a reviewer can
      // re-derive any single citation without re-uploading the whole set.
      documents: (meta.docs || []).map((d) => ({
        file_name: d.name, bytes: d.size, pages: d.pages, sha256: d.hash
      })),
      disagreements: (data.conflicts || []).map((c) => ({
        line_item: c.key, label: c.label,
        used: { document: c.held.doc, value: c.held.value },
        also_reported: { document: c.other.doc, value: c.other.value },
        resolution: "first reading kept; not averaged"
      })),
      coverage: {
        slices_total: meta.slices,
        slices_read: meta.read,
        slices_failed: meta.failed,
        pages_per_slice: PAGES_PER_SLICE,
        complete: meta.failed === 0
      },
      system: { tool: "Mizan", version: VERSION, model: meta.model, elapsed_seconds: meta.seconds },
      cost_of_reading: { input_tokens: meta.input_tokens, output_tokens: meta.output_tokens, usd: meta.cost_usd },
      classification: {
        lens: data.classification?.lens,
        basis: data.classification?.basis,
        rationale: data.classification?.why
      },
      deterministic_checks: [
        bal && {
          check: "assets = liabilities + net assets",
          computed_by: "client arithmetic",
          result: bal.ok ? "pass" : "fail",
          difference: bal.delta
        }
      ].filter(Boolean),
      determinations: counts,
      escalations: (data.escalations || []).map((e, i) => ({
        item: e.title,
        decision_needed: e.decisionNeeded,
        source: e.ref,
        accountable_owner: owners[i] || "UNASSIGNED",
        decision: "PENDING"
      })),
      note: "Figures are read from the source document. This record is not an opinion on the accounts."
    };
  };

  const downloadExcel = () => {
    if (!data || typeof XLSX === "undefined") return;
    const wb = XLSX.utils.book_new();

    const figRows = (data.figures || []).map((f) => ({
      Label: f.label,
      Value: edits[f.label] != null ? edits[f.label] : f.value,
      Corrected: edits[f.label] != null ? "yes" : "",
      State: f.state, Source: f.ref
    }));
    if (figRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(figRows), "Figures");

    const allFindings = (data.findings || []).concat(manual).map((f) => ({
      State: f.state, Severity: f.severity || "", Finding: f.title,
      Detail: f.detail || "", Metric: f.metric || "", Source: f.ref || "",
      Origin: f.manual ? "operator" : "model"
    }));
    if (allFindings.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allFindings), "Findings");

    if ((data.escalations || []).length) {
      const esc = data.escalations.map((e, i) => ({
        Item: e.title, Why: e.why, "Decision needed": e.decisionNeeded,
        "Accountable owner": owners[i] || "UNASSIGNED", Source: e.ref, Decision: "PENDING"
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(esc), "Escalations");
    }

    if (bal) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{
        "Total assets": data.balance.totalAssets,
        "Total liabilities": data.balance.totalLiabilities,
        "Net assets / equity": data.balance.totalNetAssets,
        Difference: bal.delta, Result: bal.ok ? "balances" : "does not balance"
      }]), "Balance");
    }

    const info = [
      { Field: "Document", Value: meta?.name }, { Field: "Pages", Value: meta?.pages },
      { Field: "SHA-256", Value: meta?.hash }, { Field: "Read at", Value: meta?.at },
      { Field: "System", Value: "Mizan " + VERSION + " · " + (meta?.model || "") },
      { Field: "Operator", Value: operator || "UNRECORDED" },
      { Field: "Coverage", Value: (meta?.read || 0) + "/" + (meta?.slices || 0) + " slices" + (meta?.failed ? " (INCOMPLETE)" : "") },
      { Field: "Cost USD", Value: meta?.cost_usd }
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(info), "Record");

    XLSX.writeFile(wb, "mizan-" + (meta?.hash || "reading").slice(0, 12) + ".xlsx");
  };

  const downloadEvidence = () => {
    const rec = evidence(); if (!rec) return;
    saveBlob(JSON.stringify(rec, null, 2), "application/json",
      "mizan-evidence-" + (meta?.hash || "").slice(0, 12) + ".json");
  };

  // ---- Export layer -------------------------------------------------------
  // Six shapes of the same reading. Nothing is recomputed on the way out:
  // every export reads the values already on screen, so a downloaded file and
  // the page can never disagree.

  const saveBlob = (text, type, name) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const stamp = () => (meta?.hash || "reading").slice(0, 12);

  // The per-call record behind the audit log, shared by the screen and the exports.
  const aiCalls = (slices || [])
    .filter((s) => s.usage || s.status === "miss")
    .map((s) => ({
      step: "Extraction",
      detail: "pages " + s.from + "–" + s.to,
      model: s.usage?.model || meta?.model || "",
      status: s.status === "miss" ? "failed" : s.usage?.salvaged ? "salvaged" : "ok",
      input_tokens: s.usage?.input_tokens || 0,
      output_tokens: s.usage?.output_tokens || 0,
      cost_usd: s.usage?.cost_usd || 0
    }))
    .concat(evalCostRef.current ? [{
      step: "Evaluation",
      detail: lens ? LENS_LABEL[lens] : "General",
      model: evalCostRef.current.model || "",
      status: evalState === "done" ? "ok" : evalState,
      input_tokens: evalCostRef.current.input_tokens || 0,
      output_tokens: evalCostRef.current.output_tokens || 0,
      cost_usd: evalCostRef.current.cost_usd || 0
    }] : []);

  const csvCell = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csvRows = (rows) => rows.map((r) => r.map(csvCell).join(",")).join("\r\n");

  const downloadCSV = () => {
    if (!data) return;
    const rows = [["Section", "Item", "Value", "State", "Confidence", "Source", "Note"]];
    (meta?.docs || []).forEach((d) => rows.push([
      "Document", d.name, d.pages + " pages", "read", "", d.hash || "",
      (d.size ? Math.round(d.size / 1024) + " KB" : "")
    ]));
    (data.conflicts || []).forEach((c) => rows.push([
      "Disagreement", c.label, c.held.value, "used", "", c.held.doc,
      c.other.doc + " reports " + c.other.value + "; not averaged"
    ]));
    (data.figures || []).forEach((f) => rows.push([
      "Figure", f.label, edits[f.label] != null ? edits[f.label] : f.value,
      f.state || "", f.confidence == null ? "" : f.confidence + "%", f.ref || "", f.quote || ""
    ]));
    (ratios || []).forEach((r) => rows.push([
      "Ratio", r.name, r.status === "ok" ? r.shown : "not computed",
      r.status, r.status === "ok" && r.score != null ? scoreBand(r.score).label : "",
      r.formula, r.status === "ok" ? r.note : (r.reason ? r.reason.headline + " " + r.reason.detail : "")
    ]));
    (coverage || []).forEach((c) => rows.push([
      "Coverage", c.label, c.pct + "%", c.pct === 0 ? "not read" : c.pct === 100 ? "read" : "partial",
      "", c.proven || "", c.pages || ""
    ]));
    (data.findings || []).concat(manual).forEach((f) => rows.push([
      "Finding", f.title, f.metric || "", f.state || "",
      f.confidence == null ? "" : f.confidence + "%", f.ref || "", f.detail || ""
    ]));
    (data.escalations || []).forEach((e, i) => rows.push([
      "Escalation", e.title, owners[i] || "UNASSIGNED", "PENDING", "", e.ref || "", e.decisionNeeded || ""
    ]));
    saveBlob("﻿" + csvRows(rows), "text/csv;charset=utf-8", "mizan-" + stamp() + ".csv");
  };

  const downloadMarkdown = () => {
    if (!data) return;
    const L = [];
    L.push("# " + (data.entity?.name || "Financial statement reading"));
    L.push("");
    L.push("*Read by Mizan " + VERSION + " on " + (meta?.at || "") + ". " +
      "Figures are read from the source document; nothing here is an opinion on the accounts.*");
    L.push("");
    L.push("| | |");
    L.push("|---|---|");
    L.push("| Document | " + (meta?.name || "") + " · " + (meta?.pages || 0) + " pages |");
    L.push("| SHA-256 | `" + (meta?.hash || "") + "` |");
    L.push("| Coverage | " + (meta?.read || 0) + "/" + (meta?.slices || 0) + " slices" +
      (meta?.failed ? " — **incomplete**" : "") + " |");
    L.push("| Overall confidence | " + (overallConfidence == null ? "n/a" : overallConfidence + "%") + " |");
    L.push("| Operator | " + (operator || "UNRECORDED") + " |");
    L.push("");

    if ((meta?.docs || []).length > 1) {
      L.push("## Source documents");
      L.push("");
      L.push("This reading draws on " + meta.docs.length + " files at once. Every citation below " +
        "names the file it came from.");
      L.push("");
      L.push("| File | Pages | SHA-256 |");
      L.push("|---|---|---|");
      meta.docs.forEach((d) => L.push("| " + d.name + " | " + d.pages + " | `" + (d.hash || "").slice(0, 16) + "…` |"));
      L.push("");
    }

    if ((data.conflicts || []).length) {
      L.push("## Figures the documents disagree on");
      L.push("");
      L.push("The first reading was kept and used in the ratios. Nothing was averaged.");
      L.push("");
      L.push("| Figure | Used | Also reported |");
      L.push("|---|---|---|");
      data.conflicts.forEach((c) => L.push("| " + c.label + " | " + fmt(c.held.value) + " (" + c.held.doc +
        ") | " + fmt(c.other.value) + " (" + c.other.doc + ") |"));
      L.push("");
    }

    if (overall) {
      L.push("## Overall financial health");
      L.push("");
      L.push("**" + overall.score + "/100 — " + overall.label + "**, from " +
        overall.families + " of " + overall.of + " families with computable ratios.");
      L.push("");
      scorecard.filter((s) => s.score != null).forEach((s) =>
        L.push("- **" + s.family + "** " + s.score + "/100 — " + s.label));
      L.push("");
    }

    if (coverage) {
      L.push("## Reading coverage");
      L.push("");
      L.push("| Statement | Read | Evidence |");
      L.push("|---|---|---|");
      coverage.forEach((c) => L.push("| " + c.label + " | " + c.pct + "% | " + (c.proven || "not seen") +
        (c.pages ? " · pages " + c.pages : "") + " |"));
      L.push("");
    }

    if (ratiosOk.length) {
      L.push("## Financial ratios");
      L.push("");
      L.push("| Ratio | Value | Formula | Reading |");
      L.push("|---|---|---|---|");
      (ratios || []).forEach((r) => L.push("| " + r.name + " | " +
        (r.status === "ok" ? r.shown : "—") + " | " + r.formula + " | " +
        (r.status === "ok" ? r.note : "Could not compute. " +
          (r.reason ? r.reason.headline + " " + r.reason.detail : "")) + " |"));
      L.push("");
    }

    if (evaluation) {
      L.push("## Performance evaluation" + (lens ? " · " + LENS_LABEL[lens] : ""));
      L.push("");
      L.push("*Model judgment, not arithmetic and not an audit opinion.*");
      L.push("");
      if (evaluation.headline) L.push("**" + evaluation.headline + "**");
      if (evaluation.overall) { L.push(""); L.push(evaluation.overall); }
      (evaluation.assessment || []).forEach((a) => {
        L.push("");
        L.push("### " + a.area + " — " + (a.read || ""));
        if (a.text) L.push(a.text);
        (a.drivers || []).forEach((d) => L.push("- " + d));
        if (a.conclusion) L.push("");
        if (a.conclusion) L.push("> **Conclusion.** " + a.conclusion);
      });
      if ((evaluation.contradictions || []).length) {
        L.push("");
        L.push("### Potential contradictions");
        evaluation.contradictions.forEach((c) => {
          L.push("");
          L.push("- **Management says:** " + c.claim);
          L.push("  **Financial evidence:** " + c.evidence);
          L.push("  *" + (c.severity || "") + " — " + (c.tension || "") + "*");
        });
      }
      if ((evaluation.dataGaps || []).length) {
        L.push("");
        L.push("**What limited this evaluation:** " + evaluation.dataGaps.join("; ") + ".");
      }
      L.push("");
    }

    const allF = (data.findings || []).concat(manual);
    if (allF.length) {
      L.push("## Findings");
      L.push("");
      allF.forEach((f) => {
        L.push("- **" + f.title + "** (" + (f.state || "") + (f.severity ? ", " + f.severity : "") +
          (typeof f.confidence === "number" ? ", " + f.confidence + "% confidence" : "") + ") — " +
          (f.detail || "") + " *" + (f.ref || "") + "*");
      });
      L.push("");
    }

    if ((data.escalations || []).length) {
      L.push("## Held for a person");
      L.push("");
      data.escalations.forEach((e, i) => L.push("- **" + e.title + "** — " + (e.decisionNeeded || "") +
        " · owner: " + (owners[i] || "UNASSIGNED")));
      L.push("");
    }

    if (trail.length) {
      L.push("## How this reading happened");
      L.push("");
      trail.forEach((t) => L.push("1. " + t.text + (t.detail ? " — " + t.detail : "")));
      L.push("");
    }

    saveBlob(L.join("\n"), "text/markdown;charset=utf-8", "mizan-" + stamp() + ".md");
  };

  // The raw merged model output, exactly as the ratio engine received it.
  const downloadApiResponse = () => {
    if (!data) return;
    saveBlob(JSON.stringify({ reading: data, reading_meta: meta, ai_calls: aiCalls }, null, 2),
      "application/json", "mizan-response-" + stamp() + ".json");
  };

  // Everything at once: the evidence record, the reading, the arithmetic, the
  // judgment, the operator's edits and the trail that produced them.
  const downloadAuditPackage = () => {
    if (!data || !meta) return;
    saveBlob(JSON.stringify({
      package: "mizan-audit-package",
      version: VERSION,
      evidence_record: evidence(),
      document_reading: data,
      operator_corrections: edits,
      operator_findings: manual,
      escalation_owners: owners,
      arithmetic: {
        balance_check: bal,
        ratios: (ratios || []).map((r) => ({
          family: r.family, name: r.name, formula: r.formula, status: r.status,
          value: r.status === "ok" ? r.value : null,
          shown: r.status === "ok" ? r.shown : null,
          score: r.status === "ok" ? r.score : null,
          not_computed_because: r.status === "ok" ? null
            : (r.reason ? r.reason.headline + " " + r.reason.detail : "input missing")
        })),
        scorecard, overall
      },
      coverage: { by_statement: coverage, overall_confidence: overallConfidence },
      judgment: { lens: lens || "general", lens_label: LENS_LABEL[lens] || "General", evaluation },
      ai_calls: aiCalls,
      reading_timeline: trail,
      note: "Model judgment is labelled as judgment. Arithmetic was computed on the client " +
            "from figures read out of the document, and no figure here was estimated."
    }, null, 2), "application/json", "mizan-audit-package-" + stamp() + ".json");
  };

  React.useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "u") { e.preventDefault(); inputRef.current?.click(); }
      if (mod && e.key.toLowerCase() === "p") { e.preventDefault(); window.print(); }
      if (mod && e.key.toLowerCase() === "e" && data) { e.preventDefault(); downloadExcel(); }
      if (mod && e.key.toLowerCase() === "s" && data) { e.preventDefault(); downloadEvidence(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [data, meta, edits, manual, owners, operator]);

  // Findings shown = model findings + operator findings, filtered and searched.
  const shownFindings = [...(data?.findings || []), ...manual].filter((f) => {
    if (filterState !== "all" && f.state !== filterState) return false;
    if (!query.trim()) return true;
    const hay = (f.title + " " + (f.detail || "") + " " + (f.ref || "") + " " + (f.metric || "")).toLowerCase();
    return hay.includes(query.toLowerCase());
  });

  const addManualFinding = () => {
    setManual((prev) => [...prev, {
      manual: true, state: "review", severity: "medium",
      title: "New finding", detail: "", metric: "", ref: "operator entry"
    }]);
  };
  const updateManual = (i, field, val) => {
    setManual((prev) => prev.map((f, ix) => (ix === i ? { ...f, [field]: val } : f)));
  };
  const removeManual = (i) => setManual((prev) => prev.filter((_, ix) => ix !== i));

  const toggle = (id) => setCollapsed((p) => ({ ...p, [id]: !p[id] }));

  const working = state === "working";

  return (
    <div className="mz">
      <style>{CSS}</style>
      <div className="mz-wrap">

        <header className="mz-head">
          <div>
            <div className="mz-mark">Mizan<span>ميزان</span></div>
            <div className="mz-sub">Financial statement analysis that shows its work</div>
          </div>
          <p className="mz-thesis">Autonomous when it is certain. Accountable when it is not.</p>
        </header>

        <div className="mz-intake">
          <input ref={inputRef} type="file" accept="application/pdf" multiple onChange={onPick} style={{ display: "none" }} />
          <button className="mz-btn" disabled={working} onClick={() => inputRef.current?.click()}>
            {working ? "Reading" : "Read statements PDFs"}
          </button>
          <input className="mz-in" placeholder="Your name, for the record"
            value={operator} onChange={(e) => setOperator(e.target.value)} aria-label="Operator name" />
          {state === "done" && (
            <>
              <button className="mz-btn ghost" onClick={() => window.print()}>Print</button>
              <button className="mz-btn ghost" onClick={downloadExcel}>Excel</button>
              <button className="mz-btn ghost" onClick={downloadEvidence}>Evidence JSON</button>
              <button className="mz-btn ghost" onClick={clearSession}>New reading</button>
            </>
          )}
          {docs.length > 0 && state === "done" && (
            <span className="mz-hint">
              {docs.length === 1 ? docs[0].name : docs.length + " documents · " + meta?.pages + " pages"}
            </span>
          )}
        </div>

        {docs.length > 0 && (
          <div className="mz-docs">
            {docs.map((d) => {
              const mine = slices.filter((s) => s.doc === d.doc);
              const read = mine.filter((s) => s.status === "done").length;
              const failed = mine.filter((s) => s.status === "miss").length;
              return (
                <div key={d.doc} className="mz-doc">
                  <span className="mz-doc-n">{d.name}</span>
                  <span className="mz-doc-m">
                    {d.pages} page{d.pages === 1 ? "" : "s"} · {read}/{mine.length} slices read
                    {failed ? " · " + failed + " unread" : ""}
                  </span>
                </div>
              );
            })}
          </div>
        )}

        {state === "idle" && (
          <div className="mz-empty">
            <p className="mz-empty-t">Nothing read yet.</p>
            <p className="mz-empty-s">
              Load one set of financial statements, or several at once — an income statement in
              one file and the balance sheet in another are read together as a single reading.
              Long documents are cut into slices and read in parallel.
            </p>
          </div>
        )}

        {slices.length > 0 && (
          <div className="mz-panel">
            <div className="mz-panel-strip">
              <span>{working ? "Reading in parallel" : "Coverage"}</span>
              <span>{PAGES_PER_SLICE} pages per slice · {CONCURRENCY} at once</span>
            </div>
            <div className="mz-track">
              <div className="mz-track-fill" style={{ width: (((doneCount + missCount) / slices.length) * 100) + "%" }} />
            </div>
            <div className="mz-dials">
              <div className="mz-dial">
                <div className="mz-dial-l">Slices read</div>
                <div className="mz-dial-v">{doneCount}/{slices.length}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Pages covered</div>
                <div className="mz-dial-v">{pagesRead}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Findings so far</div>
                <div className="mz-dial-v">{data?.findings?.length || 0}</div>
              </div>
              <div className="mz-dial">
                <div className="mz-dial-l">Unread</div>
                <div className="mz-dial-v" style={{ color: missCount ? "var(--esc)" : "var(--ink)" }}>{missCount}</div>
              </div>
            </div>
            <div className="mz-grid">
              {slices.map((s, i) => (
                <div key={s.idx ?? i} className={"mz-cell " + s.status}
                  title={(s.docName ? s.docName + " · " : "") + "pages " + s.from + " to " + s.to + (s.why ? " · " + s.why : "")}>
                  {s.from}
                </div>
              ))}
            </div>
          </div>
        )}

        {notice && (
          <div className="mz-note">{notice}</div>
        )}

        {state === "done" && data && (data.entities || []).length > 1 &&
          new Set(data.entities.map((e) => (e.name || "") + "|" + (e.period || ""))).size > 1 && (
          <div className="mz-mixed">
            <p className="mz-mixed-t">These documents do not describe the same thing</p>
            <p className="mz-mixed-b">
              The ratios below draw on all of them at once, which is only meaningful if they
              belong to one entity and one period. Check this before relying on the arithmetic.
            </p>
            <div className="mz-mixed-l">
              {data.entities.map((e, i) => (
                <div key={i}>
                  <b>{e.doc || "document " + (i + 1)}</b> · {e.name || "entity not stated"}
                  {e.period ? " · " + e.period : ""}
                </div>
              ))}
            </div>
          </div>
        )}

        {state === "done" && data && (data.conflicts || []).length > 0 && (
          <div className="mz-conf">
            <p className="mz-conf-t">
              {data.conflicts.length} figure{data.conflicts.length > 1 ? "s" : ""} the documents disagree on
            </p>
            <p className="mz-conf-b">
              The first reading was kept and used in the ratios. Nothing was averaged. Decide which
              document governs before signing anything off.
            </p>
            {data.conflicts.map((c, i) => (
              <div key={i} className="mz-conf-r">
                <span className="mz-conf-k">{c.label}</span>
                <span className="mz-conf-v"><b>{fmt(c.held.value)}</b> <em>{c.held.doc}</em> · used</span>
                <span className="mz-conf-v">{fmt(c.other.value)} <em>{c.other.doc}</em></span>
              </div>
            ))}
          </div>
        )}

        {state === "done" && meta && meta.failed > 0 && (
          <div className="mz-retry">
            <span>{meta.failed} of {meta.slices} slices did not read. This reading is marked incomplete.</span>
            <button className="mz-btn ghost" onClick={retryFailed}>Retry failed slices</button>
          </div>
        )}

        {state === "error" && (
          <div className="mz-err">
            <p className="mz-err-t">Reading stopped</p>
            <p className="mz-err-b">{err}</p>
          </div>
        )}

        {data && (data.findings?.length > 0 || state === "done") && (
          <>
            {state === "done" && data && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">At a glance</h2>
                  <span className="mz-sec-note">live from this reading</span>
                </div>
                <div className="mz-dash">
                  {(() => {
                    const all = [...(data.findings || []), ...manual];
                    const high = all.filter((f) => f.severity === "high").length;
                    const esc = (data.escalations || []).length;
                    const escOwned = (data.escalations || []).filter((_, i) => owners[i]).length;
                    const cells = [
                      { l: "Findings", v: all.length, tone: "" },
                      { l: "High risk", v: high, tone: high ? "bad" : "good" },
                      { l: "Held for a person", v: esc, tone: esc ? "warn" : "good" },
                      { l: "Owners named", v: escOwned + "/" + esc, tone: escOwned === esc ? "good" : "warn" },
                      { l: "Confidence", v: (overallConfidence == null ? "—" : overallConfidence + "%"),
                        tone: overallConfidence == null ? "" : overallConfidence >= 85 ? "good" : overallConfidence >= 60 ? "warn" : "bad" },
                      { l: "Ratios computed", v: ratiosOk.length + "/" + (ratios || []).length, tone: "" }
                    ];
                    return cells.map((c, i) => (
                      <div key={i} className={"mz-dash-cell " + c.tone}>
                        <div className="mz-dash-v">{c.v}</div>
                        <div className="mz-dash-l">{c.l}</div>
                      </div>
                    ));
                  })()}
                </div>
              </section>
            )}

            {state === "done" && overall && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Overall financial health</h2>
                  <span className="mz-sec-note">
                    every statement combined · {overall.families} of {overall.of} families scored
                  </span>
                </div>
                <div className="mz-score">
                  <div className="mz-score-top">
                    <div>
                      <div className={"mz-score-big " + overall.tone}>{overall.score}</div>
                      <div className="mz-score-lab">out of 100</div>
                    </div>
                    <div>
                      <div className="mz-score-verdict">{overall.label}</div>
                      <div className="mz-score-lab">
                        averaged across the {overall.families} famil{overall.families === 1 ? "y" : "ies"} with enough data
                      </div>
                    </div>
                  </div>
                  {scorecard.map((s, i) => (
                    <div key={i} className="mz-score-row">
                      <div>
                        <div className="mz-score-name">{s.family}</div>
                        <div className="mz-score-sub">{s.computed}/{s.total} computed</div>
                      </div>
                      <div className="mz-score-track">
                        {s.score != null && (
                          <div className={"mz-score-fill " + s.tone} style={{ width: s.score + "%" }} />
                        )}
                      </div>
                      <div className={"mz-score-tag " + s.tone}>{s.label}</div>
                    </div>
                  ))}
                </div>
                <div className="mz-legend">
                  <span>Scored from the ratios that computed, banded against conventional thresholds.</span>
                  <span>A family with no computable ratio is reported as no data, never as neutral.</span>
                </div>
              </section>
            )}

            {state === "done" && coverage && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Reading coverage</h2>
                  <span className="mz-sec-note">
                    what was actually read, by statement
                    {meta ? " · " + meta.read + "/" + meta.slices + " slices processed" : ""}
                  </span>
                </div>
                <div className="mz-cov">
                  {coverage.map((c, i) => {
                    const cls = c.pct === 0 ? "zero" : c.pct >= 100 ? "full" : "part";
                    return (
                      <div key={i} className="mz-cov-row">
                        <div>
                          <div className="mz-cov-n">{c.label}</div>
                          <div className="mz-cov-sub">{c.pages ? "pp. " + c.pages : c.proven}</div>
                        </div>
                        <div className="mz-cov-track">
                          <div className={"mz-cov-fill " + (cls === "full" ? "" : cls)} style={{ width: c.pct + "%" }} />
                        </div>
                        <div className={"mz-cov-p " + cls}>{c.pct}%</div>
                      </div>
                    );
                  })}
                </div>
                <div className="mz-legend">
                  <span>Measured by how many of each statement's key lines were found, not by pages turned.</span>
                  <span>Overall confidence {overallConfidence == null ? "—" : overallConfidence + "%"} blends coverage with the reading's own certainty.</span>
                </div>
              </section>
            )}

            {evalState === "done" && evaluation && evaluation.risk && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Risk profile</h2>
                  <span className="mz-sec-note">
                    model judgment · confidence {evaluation.risk.confidence != null ? evaluation.risk.confidence + "%" : "not stated"}
                  </span>
                </div>
                <div className="mz-risk">
                  {["operational", "financial", "liquidity", "accounting"].map((k) => {
                    const n = Math.max(0, Math.min(5, Number(evaluation.risk[k]) || 0));
                    return (
                      <div key={k} className="mz-risk-cell">
                        <div className="mz-risk-l">{k} risk</div>
                        <div className="mz-risk-blocks">
                          {[1, 2, 3, 4, 5].map((b) => (
                            <div key={b} className={"mz-risk-b " + (b <= n ? "on l" + n : "")} />
                          ))}
                        </div>
                        <div className="mz-risk-why">{(evaluation.risk.why || {})[k] || "—"}</div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {evalState === "done" && evaluation && (evaluation.contradictions || []).length > 0 && (
              <section className="mz-sec">
                <div className="mz-sec-head">
                  <h2 className="mz-sec-title">Potential contradictions</h2>
                  <span className="mz-sec-note">management narrative against the arithmetic</span>
                </div>
                {evaluation.contradictions.map((c, i) => (
                  <div key={i} className="mz-contra">
                    <div className="mz-contra-h">
                      <span>Potential contradiction</span>
                      <span>{c.severity || "medium"}</span>
                    </div>
                    <div className="mz-contra-b">
                      <div className="mz-contra-side">
                        <span className="mz-contra-lab">Management statement</span>
                        {c.claim}
                      </div>
                      <div className="mz-contra-v">vs</div>
                      <div className="mz-contra-side">
                        <span className="mz-contra-lab">Financial evidence</span>
                        {c.evidence}
                      </div>
                    </div>
                    {c.tension && <div className="mz-contra-t">{c.tension}</div>}
                  </div>
                ))}
                <div className="mz-legend">
                  <span>Raised for a person to judge. A flag here is a question, not a conclusion.</span>
                </div>
              </section>
            )}

            <section className="mz-sec">
              <div className="mz-sec-head">
                <h2 className="mz-sec-title">Lens applied</h2>
                <span className="mz-sec-note">{working ? "provisional" : "settled"}</span>
              </div>
